[package]
name = "midgard-client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The single shared Rust core every client shell links: crypto, sync, and storage implemented once and composed behind one typed façade — no per-shell reimplementation. [FR-C-1] [AC-C-1] [KDD-1]"

[features]
default = ["backend-fips"]
backend-fips = [
    "midgard-client-store/backend-fips",
    "midgard-client-keystore/backend-fips",
    "midgard-client-enclosure/backend-fips",
    "pqc-agility/backend-fips",
    "attest/backend-fips",
]

# Opens a demo dataset under caller-chosen anchors, or loads an unsigned body
# (`DemoEnclosure::open`, `DemoEnclosure::from_body`). For this crate's own tests
# only: production code opens with `open_pinned`, and tools/ci/no-test-backend.sh
# fails a release build graph that turns this on. [AC-C-13] [NFR-PQ-3]
demo-unpinned = []

[dependencies]
# The one-and-only implementations of each concern. The shells depend on THIS
# crate; everything security- or data-critical lives below it. [FR-C-1] [KDD-1]
midgard-client-sync = { path = "../sync" }
midgard-client-store = { path = "../store" }
midgard-client-keystore = { path = "../keystore" }
midgard-client-enclosure = { path = "../enclosure", default-features = false }
policy = { path = "../../crypto/policy" }
pqc-agility = { path = "../../crypto/pqc-agility", default-features = false }
# The strict JSON reader for console read models and the demo dataset, and the one
# signature-acceptance decision (`attest::accept`). Verifier only: no key custody.
# [NFR-PQ-3] [AC-C-13]
attest = { path = "../../crypto/attest", default-features = false, features = ["backend-fips"] }

[dev-dependencies]
# The integration tests use the unpinned entry points. [AC-C-13]
midgard-client-core = { path = ".", features = ["demo-unpinned"] }
# A test platform keystore declares its floor by wrapping a test-floor software
# root; its TrustRoot impl names kms types. Tests only. [VLD-ANB-MIDGARD-0056]
midgard-client-keystore = { path = "../keystore", features = ["test-floors"] }
kms = { path = "../../services/kms" }
# The dataset builder example (examples/build_demo_dataset.rs) unseals the demo key
# from an attest keystore (custody); the library itself only verifies. Examples are
# not release binaries (tools/ci/release-artefacts.sh derives the release matrix from
# [[bin]], src/main.rs and src/bin/ only). [NFR-PQ-3]
attest = { path = "../../crypto/attest" }

[lib]
path = "src/lib.rs"
