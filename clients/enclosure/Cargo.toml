[package]
name = "midgard-client-enclosure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Client-to-enclosure transport: a hybrid PQ-mTLS client over the suite handshake, cert/peer-pinned and failing closed if PQ negotiation fails. [FR-C-5] [NFR-PQ-1] [AC-C-3]"

[features]
# No forced backend (mirrors pq-mtls): the deterministic `test-backend` and the
# production `backend-fips` are mutually exclusive and selected explicitly.
default = []
test-backend = ["pq-mtls/test-backend", "pqc-agility/test-backend"]
backend-fips = ["pq-mtls/backend-fips", "pqc-agility/backend-fips"]

[dependencies]
# The suite's zero-trust handshake. The client is the initiator; fail-closed
# negotiation and downgrade detection are inherited unchanged. [KDD-1]
pq-mtls = { path = "../../crypto/pq-mtls", default-features = false }
pqc-agility = { path = "../../crypto/pqc-agility", default-features = false }
policy = { path = "../../crypto/policy" }

[lib]
path = "src/lib.rs"
