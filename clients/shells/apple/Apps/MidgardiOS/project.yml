# XcodeGen spec of the iPhone app (Task B3; the Maps edition only, owner decision
# 23 Nov 2026). The generated MidgardiOS.xcodeproj is committed beside it, and
# tools/ci/tests/apple-projects.test.sh holds the two together: after editing this file,
# run `xcodegen generate` here and commit both. [DD-6] [FR-C-1]
# One app, MidgardiOSMaps (bundle io.veldris.midgardmaps.ios, shown as "Midgard"):
# Info.plist (MidgardEdition maps), its entitlements (Config/Signing.xcconfig), and
# MidgardGlobeKit. iOS has no network entitlement (an iPhone app may use the network).
# tools/check-edition.sh checks what the build carries.
name: MidgardiOS
options:
  bundleIdPrefix: io.veldris.midgard
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
# Signing (automatic, team from the gitignored Signing.local.xcconfig): see the file.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # The pre-build step reads the repository (git, Rust sources) outside the target.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  # The shared package: clients/shells/apple.
  MidgardKit:
    path: ../..
targets:
  MidgardiOSMaps:
    type: application
    platform: iOS
    # The app icon (tools/make-app-icon.swift draws it) and the privacy manifest.
    sources:
      - Sources
      - Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgardmaps.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: MidgardiOSMaps
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The keychain access group only with a team (Config/Signing.xcconfig).
        CODE_SIGN_ENTITLEMENTS: $(MIDGARD_APP_ENTITLEMENTS)
    dependencies:
      - package: MidgardKit
        product: MidgardKit
      - package: MidgardKit
        product: MidgardGlobeKit
    preBuildScripts:
      - name: Refuse a non-Debug build without a team
        # Any configuration but Debug (Release, or one added later) without
        # MIDGARD_TEAM_ID has no keychain access group: it cannot keep keys outside UI
        # testing. Allowed only on purpose, with MIDGARD_ALLOW_ADHOC_RELEASE=YES
        # (Config/Signing.xcconfig).
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" != "Debug" ] && [ -z "${MIDGARD_TEAM_ID}" ] \
              && [ "${MIDGARD_ALLOW_ADHOC_RELEASE}" != "YES" ]; then
              echo "error: ${CONFIGURATION} build without a team: only Debug builds without one. Set MIDGARD_TEAM_ID in Config/Signing.local.xcconfig, or pass MIDGARD_ALLOW_ADHOC_RELEASE=YES for an ad-hoc ${CONFIGURATION} build that cannot keep keys."
              exit 1
          fi
      - name: Ensure MidgardCoreFFI.xcframework
        basedOnDependencyAnalysis: false
        script: |
          # Builds the Rust core's XCFramework only when its sources changed; links it
          # and the bindings into the package (clients/shells/apple/tools).
          /bin/bash "${SRCROOT}/../../tools/ensure-xcframework.sh"
  MidgardiOSMapsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - UITests-Maps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgardmaps.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MidgardiOSMaps
    dependencies:
      - target: MidgardiOSMaps
      - package: MidgardKit
        product: MidgardAuditKit
schemes:
  MidgardiOSMaps:
    build:
      targets:
        MidgardiOSMaps: all
        MidgardiOSMapsUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # AccessibilityAudit stays in the scheme: clients/shells/apple/audit.sh selects it
      # with -only-testing, which cannot reach a test the scheme skips.
      targets:
        - MidgardiOSMapsUITests
    archive:
      config: Release
