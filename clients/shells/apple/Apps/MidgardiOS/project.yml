# XcodeGen spec of the iPhone app (Task B3). The generated MidgardiOS.xcodeproj is
# committed beside it, and tools/ci/tests/apple-projects.test.sh holds the two together:
# after editing this file, run `xcodegen generate` here and commit both. [DD-6] [FR-C-1]
name: MidgardiOS
options:
  bundleIdPrefix: io.veldris.midgard
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
# Signing (automatic, team from the gitignored Signing.local.xcconfig): see the file.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    # The pre-build step reads the repository (git, Rust sources) outside the target.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  # The shared package: clients/shells/apple.
  MidgardKit:
    path: ../..
targets:
  MidgardiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgard.ios
        PRODUCT_NAME: MidgardiOS
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The keychain access group only with a team (Config/Signing.xcconfig).
        CODE_SIGN_ENTITLEMENTS: $(MIDGARD_APP_ENTITLEMENTS)
    dependencies:
      - package: MidgardKit
        product: MidgardKit
    preBuildScripts:
      - name: Refuse a Release build without a team
        # A Release build without MIDGARD_TEAM_ID has no keychain access group: it cannot
        # keep keys outside UI testing. Allowed only on purpose, with
        # MIDGARD_ALLOW_ADHOC_RELEASE=YES (Config/Signing.xcconfig).
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ] && [ -z "${MIDGARD_TEAM_ID}" ] \
              && [ "${MIDGARD_ALLOW_ADHOC_RELEASE}" != "YES" ]; then
              echo "error: Release build without a team: set MIDGARD_TEAM_ID in Config/Signing.local.xcconfig, or pass MIDGARD_ALLOW_ADHOC_RELEASE=YES for an ad-hoc Release build that cannot keep keys."
              exit 1
          fi
      - name: Ensure MidgardCoreFFI.xcframework
        basedOnDependencyAnalysis: false
        script: |
          # Builds the Rust core's XCFramework only when its sources changed; links it
          # and the bindings into the package (clients/shells/apple/tools).
          /bin/bash "${SRCROOT}/../../tools/ensure-xcframework.sh"
  MidgardiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgard.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MidgardiOS
    dependencies:
      - target: MidgardiOS
      - package: MidgardKit
        product: MidgardAuditKit
schemes:
  MidgardiOS:
    build:
      targets:
        MidgardiOS: all
        MidgardiOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # AccessibilityAudit stays in the scheme: clients/shells/apple/audit.sh selects it
      # with -only-testing, which cannot reach a test the scheme skips.
      targets:
        - MidgardiOSUITests
    archive:
      config: Release
