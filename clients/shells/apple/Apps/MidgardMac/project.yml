# The Midgard macOS apps (Task B2; three editions, Task B7). XcodeGen 2.46 spec; the
# generated MidgardMac.xcodeproj is committed beside it and
# tools/ci/tests/apple-projects.test.sh holds the two together: after editing this file
# run `xcodegen generate` here and commit both.
# Three editions (owner decision 22 Nov 2026), sharing Sources and UITests:
#   MidgardMac      Midgard, the signed release v0.1.0-rc.3: Info.plist (MidgardEdition
#                   release), App Sandbox with no network entitlement, no MidgardGlobeKit.
#   MidgardMac3D    Midgard 3D: Info-3D.plist (MidgardEdition 3d), its own entitlements,
#                   still with no network entitlement, and MidgardGlobeKit.
#   MidgardMacMaps  Midgard Maps: Info-Maps.plist (MidgardEdition maps), its own
#                   entitlements with the client network entitlement (Phase I's map
#                   tiles; the only edition with one), and MidgardGlobeKit.
# tools/check-edition.sh checks what each build carries.
# Signing: Config/Signing.xcconfig (ad hoc without a team; one line in the gitignored
# Signing.local.xcconfig selects the owner's team). [DD-6] [FR-C-1]
name: MidgardMac
options:
  bundleIdPrefix: io.veldris.midgard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MidgardKit:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The pre-build phase runs tools/ensure-xcframework.sh, which reads the Rust sources
    # and writes the shared build cache: outside what a sandboxed script may touch.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MidgardMac:
    type: application
    platform: macOS
    sources: [Sources]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Midgard
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgard.mac
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: $(MIDGARD_MAC_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MidgardKit
        product: MidgardKit
    preBuildScripts: &preBuildScripts
      - name: Refuse a non-Debug build without a team
        # Any configuration but Debug (Release, or one added later) without
        # MIDGARD_TEAM_ID is signed ad hoc, without the keychain access group: it cannot
        # keep keys outside UI testing. Allowed only on purpose, with
        # MIDGARD_ALLOW_ADHOC_RELEASE=YES (Config/Signing.xcconfig).
        script: |
          if [ "${CONFIGURATION}" != "Debug" ] && [ -z "${MIDGARD_TEAM_ID}" ] \
              && [ "${MIDGARD_ALLOW_ADHOC_RELEASE}" != "YES" ]; then
              echo "error: ${CONFIGURATION} build without a team: only Debug builds without one. Set MIDGARD_TEAM_ID in Config/Signing.local.xcconfig, or pass MIDGARD_ALLOW_ADHOC_RELEASE=YES for an ad-hoc ${CONFIGURATION} build that cannot keep keys."
              exit 1
          fi
        basedOnDependencyAnalysis: false
      - name: Ensure MidgardCoreFFI.xcframework
        # Builds the Rust core only when its sources changed (a content stamp, not
        # modification times), so it runs on every build.
        script: bash "$SRCROOT/../../tools/ensure-xcframework.sh"
        basedOnDependencyAnalysis: false
  MidgardMac3D:
    type: application
    platform: macOS
    sources: [Sources]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Midgard3D
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgard3d.mac
        INFOPLIST_FILE: Info-3D.plist
        GENERATE_INFOPLIST_FILE: NO
        # Its own entitlements, chosen as Config/Signing.xcconfig chooses the release
        # app's: ad hoc without a team, the full set with one.
        MIDGARD_ENTITLEMENTS_YES: Config/MidgardMac3D-AdHoc.entitlements
        MIDGARD_ENTITLEMENTS_: Config/MidgardMac3D.entitlements
        CODE_SIGN_ENTITLEMENTS: $(MIDGARD_MAC_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MidgardKit
        product: MidgardKit
      - package: MidgardKit
        product: MidgardGlobeKit
    preBuildScripts: *preBuildScripts
  MidgardMacMaps:
    type: application
    platform: macOS
    sources: [Sources]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: MidgardMaps
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgardmaps.mac
        INFOPLIST_FILE: Info-Maps.plist
        GENERATE_INFOPLIST_FILE: NO
        # Its own entitlements, chosen as Config/Signing.xcconfig chooses the release
        # app's: ad hoc without a team, the full set with one.
        MIDGARD_ENTITLEMENTS_YES: Config/MidgardMacMaps-AdHoc.entitlements
        MIDGARD_ENTITLEMENTS_: Config/MidgardMacMaps.entitlements
        CODE_SIGN_ENTITLEMENTS: $(MIDGARD_MAC_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MidgardKit
        product: MidgardKit
      - package: MidgardKit
        product: MidgardGlobeKit
    preBuildScripts: *preBuildScripts
  MidgardMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests, UITests-Release]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgard.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MidgardMac
    dependencies:
      - target: MidgardMac
      - package: MidgardKit
        product: MidgardAuditKit
  # The same UI tests, against the 3D app, with its own edition checks.
  MidgardMac3DUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests, UITests-3D]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgard3d.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MidgardMac3D
    dependencies:
      - target: MidgardMac3D
      - package: MidgardKit
        product: MidgardAuditKit
  # The same UI tests, against the maps app, with its own edition checks.
  MidgardMacMapsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests, UITests-Maps]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgardmaps.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MidgardMacMaps
    dependencies:
      - target: MidgardMacMaps
      - package: MidgardKit
        product: MidgardAuditKit
schemes:
  MidgardMac:
    build:
      targets:
        MidgardMac: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      # The console catalogue's unit tests are MidgardKit's (swift test in the package).
      targets:
        - name: MidgardMacUITests
          # Dynamic Type is measured on iOS; the macOS test fails by design (A14), so the
          # scheme skips it. audit.sh reads a skipped test as not measured, as before.
          skippedTests:
            - AccessibilityAudit/test_affordance_dynamic_type()
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MidgardMac3D:
    build:
      targets:
        MidgardMac3D: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: MidgardMac3DUITests
          skippedTests:
            - AccessibilityAudit/test_affordance_dynamic_type()
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MidgardMacMaps:
    build:
      targets:
        MidgardMacMaps: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: MidgardMacMapsUITests
          skippedTests:
            - AccessibilityAudit/test_affordance_dynamic_type()
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
