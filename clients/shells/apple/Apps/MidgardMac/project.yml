# The Midgard macOS app (Task B2; the Maps edition only, owner decision 23 Nov 2026).
# XcodeGen 2.46 spec; the generated MidgardMac.xcodeproj is committed beside it and
# tools/ci/tests/apple-projects.test.sh holds the two together: after editing this file
# run `xcodegen generate` here and commit both.
# One app, MidgardMacMaps (bundle io.veldris.midgard, shown as "Midgard"):
# Info.plist (MidgardEdition maps), App Sandbox with the client network entitlement
# (Phase I's map tiles), and MidgardGlobeKit. tools/check-edition.sh checks what the
# build carries.
# Signing: Config/Signing.xcconfig (ad hoc without a team; one line in the gitignored
# Signing.local.xcconfig selects the owner's team). [DD-6] [FR-C-1]
name: MidgardMac
options:
  bundleIdPrefix: io.veldris.midgard
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MidgardKit:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The pre-build phase runs tools/ensure-xcframework.sh, which reads the Rust sources
    # and writes the shared build cache: outside what a sandboxed script may touch.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  MidgardMacMaps:
    type: application
    platform: macOS
    # The app icon (tools/make-app-icon.swift draws it) and the privacy manifest.
    sources:
      - Sources
      - Assets.xcassets
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Midgard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgard
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Ad hoc without a team, the full set with one (Config/Signing.xcconfig).
        CODE_SIGN_ENTITLEMENTS: $(MIDGARD_MAC_ENTITLEMENTS)
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: MidgardKit
        product: MidgardKit
      - package: MidgardKit
        product: MidgardGlobeKit
    preBuildScripts:
      - name: Refuse a non-Debug build without a team
        # Any configuration but Debug (Release, or one added later) without
        # MIDGARD_TEAM_ID is signed ad hoc, without the keychain access group: it cannot
        # keep keys outside UI testing. Allowed only on purpose, with
        # MIDGARD_ALLOW_ADHOC_RELEASE=YES (Config/Signing.xcconfig).
        script: |
          if [ "${CONFIGURATION}" != "Debug" ] && [ -z "${MIDGARD_TEAM_ID}" ] \
              && [ "${MIDGARD_ALLOW_ADHOC_RELEASE}" != "YES" ]; then
              echo "error: ${CONFIGURATION} build without a team: only Debug builds without one. Set MIDGARD_TEAM_ID in Config/Signing.local.xcconfig, or pass MIDGARD_ALLOW_ADHOC_RELEASE=YES for an ad-hoc ${CONFIGURATION} build that cannot keep keys."
              exit 1
          fi
        basedOnDependencyAnalysis: false
      - name: Ensure MidgardCoreFFI.xcframework
        # Builds the Rust core only when its sources changed (a content stamp, not
        # modification times), so it runs on every build.
        script: bash "$SRCROOT/../../tools/ensure-xcframework.sh"
        basedOnDependencyAnalysis: false
  MidgardMacMapsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests, UITests-Maps]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.veldris.midgard.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MidgardMacMaps
    dependencies:
      - target: MidgardMacMaps
      - package: MidgardKit
        product: MidgardAuditKit
schemes:
  MidgardMacMaps:
    build:
      targets:
        MidgardMacMaps: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      # The console catalogue's unit tests are MidgardKit's (swift test in the package).
      targets:
        - name: MidgardMacMapsUITests
          # Dynamic Type is measured on iOS; the macOS test fails by design (A14), so the
          # scheme skips it. audit.sh reads a skipped test as not measured, as before.
          skippedTests:
            - AccessibilityAudit/test_affordance_dynamic_type()
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
