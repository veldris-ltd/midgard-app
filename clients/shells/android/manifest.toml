# Shell manifest — android
# One of the six client shell codebases (SAD_06 §3.1). Presentation only.
[shell]
name = "android"
technology = "Kotlin / Jetpack Compose"
targets = "Android (Play + APK)"

# KDD-1: this shell implements NO cryptography, key handling, or sync-merge logic.
# It links the shared Rust core and calls it for everything security-/data-related.
links_core = "midgard-client-core"
binding = "uniffi"
