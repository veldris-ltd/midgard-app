[package]
name = "audit-writer"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PQ-signed, append-only, tamper-evident audit ledger. [NFR-PQ-3]"

[features]
default = []
test-backend = ["pqc-agility/test-backend"]
backend-fips = ["pqc-agility/backend-fips"]

[dependencies]
pqc-agility = { path = "../pqc-agility" }

# No dev-dependency forces a backend: the tests run on whichever one is selected,
# `--features test-backend` or `--features backend-fips`. [MG-SEC-15]

[lib]
path = "src/lib.rs"
