<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bifrost · Release Console</title>
    <script>
      /* Mode bootstrap (dark default · light · system) — applied before paint to
         avoid a flash. Mirrors docs/mode.js; the app's ModeToggle drives it. */
      (function () {
        try {
          var m = localStorage.getItem('mg-mode') || 'dark';
          var light = m === 'system'
            ? window.matchMedia('(prefers-color-scheme: light)').matches
            : m === 'light';
          if (light) document.documentElement.classList.add('mode-light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="theme-bifrost">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
