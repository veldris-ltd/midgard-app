[package]
name = "mg-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Vulnerability and licence gate over a CycloneDX SBOM, against a vendored advisory database. Runs between sbom and sign; fails closed. [FR-MS-6] [NFR-OSS-1]"

[[bin]]
name = "mg-scan"
path = "src/main.rs"

[dependencies]
# No external crates: the SPDX expression evaluator, the semver comparator, the
# CVSS scorer and the date arithmetic are all in-crate. This runs inside the
# release gate on an air-gapped runner, so every input is a local file.
# [NFR-PRV-1] [NFR-OSS-1]
#
# The SBOM is read through `attest` — the strict JSON parser and the structural
# SBOM gate mg-sign and mg-verify use — so the scanner and the verifier cannot
# disagree about what a bill of materials contains. No key custody is needed.
attest = { path = "../../crypto/attest", default-features = false, features = ["backend-fips"] }
