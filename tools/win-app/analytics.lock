# Camera analytics runtime bundled in the Windows app (read by fetch-analytics.sh; key=value,
# no quotes). SHA-256s: python-build-standalone's SHA256SUMS for the release (which GitHub's
# asset digests match), PyPI's digests for the wheels, MODEL.md's for the model.
#
# The same CPython (3.13.16, release 20261009), numpy (2.5.4) and onnxruntime (1.23.2) as
# tools/mac-app/analytics.lock, so the Mac and Windows apps run the analytics on the same
# versions: onnxruntime 1.23.2 publishes a cp313 win_amd64 wheel (uploaded 2025-10-22), so no
# newer one is needed. numpy's win_amd64 wheel carries OpenBLAS (scipy-openblas, in
# numpy.libs). onnxruntime is installed without its declared dependencies (coloredlogs,
# flatbuffers, packaging, protobuf, sympy): inference does not import them. The CPU execution
# provider only (DirectML is a separate package, out of scope).
#
# On a Mac, fetch-analytics.sh compiles the standard library and site-packages with the Mac
# lock's CPython 3.13.16 for this Mac (the same version, so the same bytecode magic): its
# arm64_python or x64_python entry in tools/mac-app/analytics.lock. On Windows the runtime itself.
