[package]
name = "telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "In-enclosure observability: structured logging, metrics (Prometheus text /metrics), distributed tracing, liveness/readiness probes, and SLO tracking. Zero dependencies (pure std) — it CANNOT egress, honouring the air-gap. [NFR-PRV-1] [RC-33]"

# Deliberately NO dependencies: a pure-std telemetry stack has no network client and
# therefore cannot exfiltrate telemetry from the enclosure. Sinks/exporters are traits;
# the shipped implementations are all in-process (buffer / stdout). [NFR-PRV-1]
[dependencies]

# Tests only: the log-escaping test reads lines back with the repository's own JSON
# parser. A dev-dependency never reaches the shipped library. [AC-27.1]
[dev-dependencies]
service-runtime = { path = "../runtime" }

[lib]
path = "src/lib.rs"
