[package]
name = "fabric"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Object Fabric service: the semantic + kinetic object/ontology core. [DD-1] [NFR-SEC-2]"

[features]
# Audit lineage is PQ-signed, so the fabric needs the real backend.
default = ["backend-fips"]
backend-fips = [
    "pqc-agility/backend-fips",
    "audit-writer/backend-fips",
    "governance/backend-fips",
]

# Test support: `DurableObjectStore::wedge`, for a dependant's tests of recovery from
# a journal I/O failure. Never enabled in a build that ships.
test-faults = []

[dependencies]
policy = { path = "../../crypto/policy" }
audit-writer = { path = "../../crypto/audit-writer" }
pqc-agility = { path = "../../crypto/pqc-agility" }
# The fabric enforces + audits through the single governance spine (KDD-1),
# rather than re-implementing policy evaluation and audit signing.
governance = { path = "../governance" }

[dev-dependencies]
# The durable-store restart/at-rest tests seal via the real KMS (AES-256-GCM under
# ML-KEM-1024). KmsSealer implements the audit-writer Sealer the store persists to.
kms = { path = "../kms" }

[lib]
path = "src/lib.rs"
