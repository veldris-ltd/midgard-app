# On-device accessibility audits for the client shells. [RC-49] [AC-C-11] [FR-C-3]
#
# This file contains no build logic: every step is `bash tools/ci/run.sh <job>`, shared
# with the GitLab pipeline (.gitlab-ci.yml).
#
# Each shell is built and audited on the kind of runner its platform needs, and the
# audit writes a record to clients/shells/<shell>/audits/<release>.toml (schema:
# clients/shells/AUDIT_SCHEMA.md). The `gate` job then requires a fresh, passing record
# from every shell. A shell with no buildable project FAILS its audit — a record is
# never written for a UI that did not run — so this workflow is red until all six
# shells exist. That is the gate working, not the workflow failing.
#
# The `gate` job alone decides the result: a failed audit leaves no record, and the
# gate refuses a missing record. The audit jobs therefore do not fail the workflow by
# themselves, so a pre-release waived in clients/shells/audit-waivers.txt can proceed.
# A final release cannot be waived.
#
# The gate's decision is this workflow's output `verdict`, "pass" only once the gate has
# passed, and release.yml releases on that alone. A caller cannot go by the workflow's
# own result: `continue-on-error` covers an audit job that fails, not one GitHub
# cancels before it starts (a runner label it no longer serves), and either way the
# result is no longer "success" although the gate has decided.
#
# Runs on its own from the Actions tab, and as part of a release (release.yml).
name: shell-audit

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      verdict:
        description: '"pass" once every shell has a fresh, passing audit record, or a waiver for this pre-release'
        value: ${{ jobs.gate.outputs.verdict }}

permissions:
  contents: read

jobs:
  audit:
    name: ${{ matrix.shell }}
    runs-on: ${{ matrix.runner }}
    # The gate decides; see the header.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub retired the macos-14 image on 2026-11-02; a job asking for it is
          # cancelled before it starts.
          - { shell: apple, runner: macos-15 }
          - { shell: android, runner: ubuntu-24.04 }
          - { shell: linux-gtk, runner: ubuntu-24.04 }
          - { shell: desktop-tauri, runner: ubuntu-24.04 }
          - { shell: web, runner: ubuntu-24.04 }
          - { shell: extension, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: bash tools/ci/run.sh shell-audit ${{ matrix.shell }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: shell-audit-${{ matrix.shell }}
          path: |
            clients/shells/${{ matrix.shell }}/audits/
            shell-audit/
          if-no-files-found: ignore

  gate:
    name: every shell audited
    # Runs even when an audit failed, so the gate reports every missing record at once.
    if: always()
    needs: audit
    runs-on: ubuntu-24.04
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: shell-audit-*
          path: .
          merge-multiple: true
      - run: bash tools/ci/run.sh shell-audit-gate
      # Reached only when the gate passed; the release reads nothing else.
      - id: verdict
        run: echo "verdict=pass" >> "$GITHUB_OUTPUT"
