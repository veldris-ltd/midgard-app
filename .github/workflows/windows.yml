# The Windows presentation app on Windows 11 x64: the suite's Rust services, and the C#
# shell (apps/windows). [NFR-OSS-1]
#
# This file contains no build logic: every step is `bash tools/ci/run.sh <job>`, shared
# with the GitLab pipeline (.gitlab-ci.yml). The services are built natively on a
# Windows runner with the pinned toolchain (rust-toolchain.toml) and the vendored
# crates, for the Windows presentation app (docs/plans/2026-10-23-windows-app-design.md).
# The shell is built with the runner's .NET 10 SDK (apps/windows/global.json) from the
# committed NuGet lock files.
name: windows

on:
  push:
    branches: [md_windows-app]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Git Bash, not the WSL launcher that `bash` can resolve to from PowerShell.
    shell: bash

jobs:
  build:
    name: build, smoke-test and test the services (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/
          key: windows-target-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-target-${{ runner.arch }}-
      - id: build
        run: bash tools/ci/run.sh windows-build
      # The six services and BUILD.txt, for tools/win-app/fetch-artifacts.sh.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: midgard-services-windows-x64-${{ github.sha }}
          path: target/windows-services/
          if-no-files-found: error
          retention-days: 30
      - id: smoke
        run: bash tools/ci/run.sh windows-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.smoke.outcome == 'failure'
        with:
          name: windows-smoke-logs
          path: target/windows-smoke/logs/
          if-no-files-found: warn
      # The tests run whether or not the smoke test passed, once the services built.
      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: bash tools/ci/run.sh windows-test

  shell:
    name: build, test and publish the C# shell (win-x64)
    runs-on: windows-latest
    # A few minutes normally; a hung test is cut off by dotnet test's blame (5 min) first.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: build
        run: bash tools/ci/run.sh windows-shell-build
      # The tests run whether or not the publish passed, once the restore and build did.
      - id: test
        if: ${{ !cancelled() }}
        run: bash tools/ci/run.sh windows-shell-test
      # The results (.trx), any hang dumps, and the fake services' logs.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.test.outcome == 'failure'
        with:
          name: windows-shell-test-results
          path: target/windows-shell-test/
          if-no-files-found: warn

  # The real shell end to end: Midgard.exe --headless-check on a package of the services,
  # the consoles and a fixture, with its window (WebView2) on the runner's desktop. It
  # builds the services itself, from the target/ cache the build job keeps (restored
  # only, never saved here).
  shell-e2e:
    name: the C# shell end to end (headless check, win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/
          key: windows-target-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-target-${{ runner.arch }}-
      - id: e2e
        run: bash tools/ci/run.sh windows-shell-e2e
      # The report, home.png, heimdall.png and the shell's and services' logs, pass or fail.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-shell-e2e
          path: target/windows-shell-e2e/report/
          if-no-files-found: warn
          retention-days: 14

  # The camera analytics on the pinned Windows runtime (tools/win-app/analytics.lock): its
  # python.exe, one analysis of a synthetic clip with midgard-frames.exe and YOLOX-s, and the
  # comparison with ffmpeg. No Rust.
  analytics:
    name: the camera analytics on the Windows runtime (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: analytics
        run: bash tools/ci/run.sh windows-analytics
      # The check's report, the synthetic clip, the sizes and the runtime's manifest, pass or fail.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-analytics
          path: target/windows-analytics/report/
          if-no-files-found: warn
          retention-days: 14
