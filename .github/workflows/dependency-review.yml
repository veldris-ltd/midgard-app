# The monthly dependency review. [AC-25.6] [NFR-OSS-1] (VLD-ANB-MIDGARD-0090)
#
# This file contains no build logic: `bash tools/ci/run.sh dependency-review` fetches the
# RustSec database and the OSV npm export on the runner (`just advisory-db-refresh` and
# `just advisory-db-npm-refresh` then rewrite vendor/advisory-db and
# vendor/advisory-db-npm from them inside the offline toolchain image), runs the
# advisory scan, and opens a pull request from chore/advisory-refresh-<date> with `gh`
# when either snapshot moved. Nothing is merged here. The GitLab pipeline runs the same
# job from a pipeline schedule (.gitlab-ci.yml, `dependency-review`).
#
# Only this workflow may write: it pushes the branch and opens the pull request with the
# workflow token, passed to the job through the environment and never persisted in the
# checkout. The actions are the ones ci.yml pins, by the same commit SHAs.
# See docs/dev/BUILD_ENV.md, "Offline / vendored dependencies".
name: dependency-review

on:
  schedule:
    # Monthly: the 1st, 04:17 UTC.
    - cron: '17 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review
  cancel-in-progress: false

jobs:
  dependency-review:
    name: refresh the advisory snapshots and review
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ci-cache
          key: toolchain-${{ runner.arch }}-${{ hashFiles('deploy/acceptance/Dockerfile') }}
      - run: bash tools/ci/run.sh toolchain
      - run: bash tools/ci/run.sh dependency-review
