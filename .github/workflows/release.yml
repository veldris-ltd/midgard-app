# The release. [RC-07] [AC-B-1] [NFR-PQ-3] [AC-RF-SC-5a] [AC-RF-SC-5c] [AC-RF-SC-5e]
#
# This file contains no build logic: every step is `bash tools/ci/run.sh <job>`, shared
# with the GitLab pipeline (.gitlab-ci.yml). See tools/ci/run.sh and tools/ci/release.sh.
#
# Three ways in:
#   - a pull request that touches the release machinery, or a manual run in `dry-run`
#     mode: the WHOLE gate runs for every binary with throwaway keys on a hosted
#     runner, and nothing is published;
#   - a `v*` tag, or a manual run in `release` mode: the release itself, on the
#     self-hosted signing runners (docs/ops/PKI.md, "Signing runner");
#   - a manual run in `release` mode with `publish` set to a tag, made ON that tag:
#     the output of the tag's own release run, as it was released, becomes a DRAFT
#     pre-release. Nothing is built or signed again: the Bifrost registry refuses a
#     second release of a version it holds, and what is published must be what was
#     released. Nothing here makes a release public.
#
# The set of binaries is derived from the workspace (`just release-manifest`), so a new
# binary is gated with no edit to this file. tools/ci/release.sh fails the run if what
# reached the Bifrost registry is not exactly what was gated.
name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'tools/**'
      - 'crypto/attest/**'
      - 'bifrost/artefact/**'
      - 'bifrost/bundle/**'
      - 'supply-chain/**'
      - 'vendor/advisory-db/snapshot.toml'
      - 'vendor/advisory-db-npm/snapshot.toml'
      - 'deploy/images/**'
      - 'deploy/air-gap-bundle/**'
      - 'deploy/acceptance/Dockerfile'
      - 'justfile'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'sdk/**'
      - 'ui/**'
      - 'products/*/ui/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run gates everything and publishes nothing; release runs on the signing runners'
        type: choice
        options: [dry-run, release]
        default: dry-run
      publish:
        description: 'release mode only: the tag to attach a DRAFT pre-release to (empty = none)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: release gate, dry run
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ci-cache
          key: toolchain-${{ runner.arch }}-${{ hashFiles('deploy/acceptance/Dockerfile') }}
      - run: bash tools/ci/run.sh toolchain
      # The JavaScript artefacts are built on the runner, where node is; the release
      # then gates them inside the toolchain image with everything else. Vite 7 needs
      # Node 22.12 or later (package.json engines), above the runner's default. The
      # latest 22.x, not 22.12.0 itself: that release's corepack only knows npm's old
      # signing key and refuses to fetch pnpm.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: bash tools/ci/run.sh js-build
      - run: bash tools/ci/run.sh release-dry-run
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-dry-run-manifest
          path: target/release-out/release-manifest.txt

  preflight:
    name: signing-runner preflight
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.publish == '')
    runs-on: [self-hosted, kms]
    # The protected `release` environment: v* tags only, and a second maintainer
    # approves before anything runs on the signing runner. [VLD-ANB-MIDGARD-0035]
    environment: release
    env:
      MIDGARD_SIGNING_KEYSTORE: ${{ secrets.MIDGARD_SIGNING_KEYSTORE_PATH }}
      MIDGARD_BIFROST_KEYSTORE: ${{ secrets.MIDGARD_BIFROST_KEYSTORE_PATH }}
      # Each keystore's root is wrapped under a passphrase kept apart from it
      # (docs/ops/PKI.md, "Signing runner"). [VLD-ANB-MIDGARD-0007]
      MIDGARD_SIGNING_KEYSTORE_PASSPHRASE_FILE: ${{ secrets.MIDGARD_SIGNING_KEYSTORE_PASSPHRASE_FILE }}
      MIDGARD_BIFROST_KEYSTORE_PASSPHRASE_FILE: ${{ secrets.MIDGARD_BIFROST_KEYSTORE_PASSPHRASE_FILE }}
      MIDGARD_BIFROST_REGISTRY: ${{ secrets.MIDGARD_BIFROST_REGISTRY_PATH }}
      # The runner's own copy of allowed_signers, outside the workspace: the tag is
      # verified against it, not against the tagged commit's (docs/ops/PKI.md).
      MIDGARD_ALLOWED_SIGNERS_PATH: ${{ secrets.MIDGARD_ALLOWED_SIGNERS_PATH }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # The gate record names a commit, and the tag must be on main; checking
          # either needs the history.
          fetch-depth: 0
      # The gate is not the tag's own code: the tag check and the preflight run from a
      # checkout of main, the protected branch, and judge the tagged checkout from
      # there. Only once they pass does anything from the tagged commit run, by then
      # proven signed and on main. [VLD-ANB-MIDGARD-0035]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          path: .ci-trusted
          fetch-depth: 0
          persist-credentials: false
      - run: bash .ci-trusted/tools/ci/run.sh release-tag
        env:
          VERIFY_TAG_ROOT: ${{ github.workspace }}
      - run: bash .ci-trusted/tools/ci/run.sh release-preflight
      - run: bash tools/ci/run.sh gate-record --release
      - run: bash tools/ci/run.sh numbers

  shell-audits:
    name: client shell audits
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.publish == '')
    uses: ./.github/workflows/shell-audit.yml

  release:
    name: gate, admit, account
    needs: [preflight, shell-audits]
    # The shell-audit gate's verdict decides, not the audit jobs' results: see the header
    # of shell-audit.yml. A cancelled run stops here.
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.shell-audits.outputs.verdict == 'pass' }}
    runs-on: [self-hosted, kms]
    environment: release
    env:
      MIDGARD_SIGNING_KEYSTORE: ${{ secrets.MIDGARD_SIGNING_KEYSTORE_PATH }}
      MIDGARD_BIFROST_KEYSTORE: ${{ secrets.MIDGARD_BIFROST_KEYSTORE_PATH }}
      MIDGARD_SIGNING_KEYSTORE_PASSPHRASE_FILE: ${{ secrets.MIDGARD_SIGNING_KEYSTORE_PASSPHRASE_FILE }}
      MIDGARD_BIFROST_KEYSTORE_PASSPHRASE_FILE: ${{ secrets.MIDGARD_BIFROST_KEYSTORE_PASSPHRASE_FILE }}
      MIDGARD_BIFROST_REGISTRY: ${{ secrets.MIDGARD_BIFROST_REGISTRY_PATH }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: bash tools/ci/run.sh js-build
      - run: bash tools/ci/run.sh release
      - run: bash tools/ci/run.sh release-images
      - run: bash tools/ci/run.sh release-bundle
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release
          path: target/release-out
          if-no-files-found: error

  publish:
    name: draft pre-release
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release' && inputs.publish != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # To find the tag's release run and download what it made.
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Passed as data, never interpolated into a command line.
      MIDGARD_PUBLISH_TAG: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # Fetches the release the tag's own run made, checks it, and drafts it.
      - run: bash tools/ci/run.sh release-publish
