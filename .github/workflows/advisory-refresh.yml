# The weekly advisory refresh. [AC-P4.5] [NFR-OSS-1] (VLD-ANB-MIDGARD-0076)
#
# This file contains no build logic: `bash tools/ci/run.sh advisory-refresh` fetches the
# RustSec database and the OSV npm export, rewrites vendor/advisory-db and
# vendor/advisory-db-npm from them inside the offline toolchain image, scans every
# workspace SBOM before and after, and opens a pull request with the scan diff when
# either snapshot moved. Nothing is merged here. The GitLab pipeline runs the same job
# from a pipeline schedule (.gitlab-ci.yml, `advisory-refresh`).
#
# Only this workflow may write: it pushes deps/advisory-refresh-<date> and opens the
# pull request with the workflow token, passed to the job through the environment and
# never persisted in the checkout. See docs/dev/CI.md, "Dependency updates".
name: advisory-refresh

on:
  schedule:
    # Mondays, 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-refresh
  cancel-in-progress: false

jobs:
  advisory-refresh:
    name: refresh the advisory snapshots
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .ci-cache
          key: toolchain-${{ runner.arch }}-${{ hashFiles('deploy/acceptance/Dockerfile') }}
      - run: bash tools/ci/run.sh toolchain
      - run: bash tools/ci/run.sh advisory-refresh
