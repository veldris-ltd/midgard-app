# Gitleaks configuration for the Midgard workspace.
#
# The CI guard (.github/workflows/ci.yml) runs the upstream gitleaks binary
# directly rather than gitleaks-action, because the action requires a paid
# licence for organisation-owned repositories and therefore never actually ran.
# The binary is MIT-licensed and the scan is identical. [ASVS V14.3]
#
# Everything below SUPPRESSES KNOWN FALSE POSITIVES ONLY. Each entry names the
# exact string it tolerates, so a real credential in the same file is still
# caught. Do not add a path here to silence a finding you have not read.

title = "Midgard"

[extend]
useDefault = true

[[allowlists]]
description = """
Vendored third-party crates. Each .cargo-checksum.json holds SHA-256 digests of
the crate's files — high-entropy by construction, and the mechanism cargo uses to
prove the vendored source is untampered. They are not credentials, and the tree
is not ours to edit.
"""
paths = ['''^vendor/''']

# The default `generic-api-key` rule is keyword-proximity based: it flags a slash-joined
# token that happens to follow a word like "secret", "credential", "token" or "api". The
# four entries below are English prose and product names, not secrets. Each pairs the
# literal with the one file it occurs in (condition AND), so the same literal anywhere
# else, or any other value in that file, still fails the scan. There is no global
# stopword list: a stopword would suppress a real secret containing it in any file.
# [ASVS V14.3] (VLD-ANB-MIDGARD-0089) [AC-25.5]

[[allowlists]]
description = "BUILD_PLAYBOOK.md: '...Keychain, Keystore, TPM/DPAPI, Secret Service, WebCrypto/enclave...'"
condition = "AND"
# The history scan also sees the file's first location, readme/, in the initial import.
paths = ['''^BUILD_PLAYBOOK\.md$''', '''^readme/BUILD_PLAYBOOK\.md$''']
regexes = ['''WebCrypto/enclave''']

[[allowlists]]
description = "admin/identity/src/error.rs: '...wrong credential, forged/absent signature...'"
condition = "AND"
paths = ['''^admin/identity/src/error\.rs$''']
regexes = ['''forged/absent''']

[[allowlists]]
description = "SAD_02b: '...Gemma template/tokenizer, GGUF/quantised formats...'"
condition = "AND"
paths = ['''^docs/dev/markdown/SAD_02b_Mimir_Model_Supply_Resolution\.md$''']
regexes = ['''GGUF/quantised''']

[[allowlists]]
description = "SAD_02b: '...behind the existing inference API, Forge/Bifrost/Heimdall are unchanged...'"
condition = "AND"
paths = ['''^docs/dev/markdown/SAD_02b_Mimir_Model_Supply_Resolution\.md$''']
regexes = ['''Forge/Bifrost/Heimdall''']

[[allowlists]]
description = """
samples/2-forge-datasets/weather.json keys each METAR report as WX-<ICAO>-<unix
time>, under the JSON key "key", which the keyword-proximity `generic-api-key` rule
reads as a credential. They are object keys of public NOAA weather reports. The
pattern and the file must both match, so any other value in the file still fails.
"""
condition = "AND"
paths = ['''^samples/2-forge-datasets/weather\.json$''']
regexes = ['''WX-[A-Z0-9]{4}-[0-9]{10}''']
