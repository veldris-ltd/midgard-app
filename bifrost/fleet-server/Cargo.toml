[package]
name = "bifrost-fleet-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "bifrost-server (alias bifrost-fleet): the Bifrost fleet manager and artefact registry as a running service. Agents check in over PQ-mTLS, signed SBOM-attested builds are uploaded, gate-verified and sealed at rest, every request is authorised and audited, and operators read drift, liveness and the registry; plus bifrost-agent, the on-host client. [FR-B-1] [FR-B-3] [FR-B-4] [RC-12] [RC-17] [NFR-SEC-1]"

[features]
default = ["backend-fips"]
backend-fips = [
    "pqc-agility/backend-fips",
    "pq-mtls/backend-fips",
    "gateway/backend-fips",
    "governance/backend-fips",
    "audit-writer/backend-fips",
    "service-runtime/backend-fips",
    "bifrost-artefact/backend-fips",
    "attest/backend-fips",
]

[dependencies]
# Declarative channels, installations, check-ins and drift, durably journalled.
bifrost-fleet = { path = "../fleet" }
bifrost-rollout = { path = "../rollout" }
# The artefact registry: the manifest, the SBOM and the verify gate; and the release
# signers' anchor format. Verification needs no key custody; `custody` is for
# bifrost-release, which signs manifests with the sealed release keystore (it is in the
# graph already through service-runtime).
bifrost-artefact = { path = "../artefact" }
attest = { path = "../../crypto/attest", default-features = false, features = ["custody"] }
audit-writer = { path = "../../crypto/audit-writer" }
pqc-agility = { path = "../../crypto/pqc-agility" }
pq-mtls = { path = "../../crypto/pq-mtls" }
policy = { path = "../../crypto/policy" }
# PQ-mTLS termination and routing, and the authorise-and-audit spine every request
# goes through.
gateway = { path = "../../services/gateway" }
governance = { path = "../../services/governance" }
telemetry = { path = "../../services/telemetry" }
service-runtime = { path = "../../services/runtime" }
# The suite agent: flock on its suite root, and SIGTERM handling.
libc = "0.2"

[dev-dependencies]
# Tests issue real mesh identities with an in-enclosure issuer.
iam = { path = "../../services/iam" }
attest = { path = "../../crypto/attest" }

[[bin]]
name = "bifrost-server"
path = "src/bin/bifrost-server.rs"

# The earlier name, kept so deploy/compose and verify-bifrost keep working.
[[bin]]
name = "bifrost-fleet"
path = "src/main.rs"

[[bin]]
name = "bifrost-agent"
path = "src/bin/bifrost-agent.rs"

# The release tooling's registry client (tools/bifrost/release.sh): sign, upload, list.
[[bin]]
name = "bifrost-release"
path = "src/bin/bifrost-release.rs"

[lib]
path = "src/lib.rs"
