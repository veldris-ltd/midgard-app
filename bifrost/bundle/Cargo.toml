[package]
name = "bifrost-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bifrost offline release bundles: ML-DSA-signed multi-artefact packages an air-gapped site verifies fully offline before any deploy. [FR-B-5] [AC-B-3]"

[features]
default = ["backend-fips"]
backend-fips = [
    "bifrost-artefact/backend-fips",
    "pqc-agility/backend-fips",
    "attest/backend-fips",
]

[dependencies]
bifrost-artefact = { path = "../artefact" }
pqc-agility = { path = "../../crypto/pqc-agility" }
# The shared acceptance decision, in the bundle signing domain. [AC-RF-SC-2d]
attest = { path = "../../crypto/attest", default-features = false }

[lib]
path = "src/lib.rs"
