# Midgard on one machine: the enclosure's HTTP edge, the Mimir inference plane, the
# Bifrost fleet manager, the Heimdall feed gateway and the Forge worker, each in its own
# hardened container with its own state. [NFR-SEC-1] [NFR-PRV-1] [RC-33]
#
#   docker compose -f deploy/compose/compose.yaml up -d --build --wait
#   docker compose -f deploy/compose/compose.yaml run --rm probe
#   docker compose -f deploy/compose/compose.yaml run --rm fleet-agent
#   docker compose -f deploy/compose/compose.yaml run --rm fleet-status
#   docker compose -f deploy/compose/compose.yaml run --rm feed-source
#   docker compose -f deploy/compose/compose.yaml run --rm picture
#
# `init` runs first: it creates the enclosure (issuer and audit keys) and issues every
# mesh workload its identity. Each mesh service mounts only its own identity volume.
# The gateway mounts core-state, which holds the enclosure's keys/ (the issuer and audit
# keystores, passphrase-wrapped since keystore format version 3): the gateway is the
# enclosure, and signs and unseals as it. Compose is for development and evaluation
# only; a production deployment provisions identities from key custody
# (deploy/helm/midgard/README.md). [VLD-ANB-MIDGARD-0018]
#
# Every keystore's custody root is wrapped under a passphrase. `init` generates one
# random passphrase per keystore holder into a volume of its own, `<holder>-passphrase`,
# never the volume the keystores are in; each service mounts only its own, read-only, at
# /keystore-passphrase, and finds it through MIDGARD_KEYSTORE_PASSPHRASE_FILE (set for
# every service below, so overlays that replace an entrypoint keep it). Back the
# passphrase volumes up apart from the data volumes: a lost passphrase is a lost
# enclosure. [VLD-ANB-MIDGARD-0007]
#
# The mesh network is internal and no mesh service is published on a host port; each is
# reachable only over PQ-mTLS by a certified workload. The gateway is also on `edge`,
# for the 127.0.0.1 publish only: `edge` does no masquerade and carries no
# container-to-container traffic, and on a server mg-install's firewall rule drops
# anything forwarded out of it, so neither network routes anything out of the host.
# [VLD-ANB-MIDGARD-0061]
#
# The image is built locally from source and is NOT the signed release image
# (deploy/images/service.Dockerfile verifies a release signature before it runs).
# Use this for development and evaluation, not production.

name: midgard

# Every service runs under cgroup limits, so a flood of idle connections, growing
# metrics or inference load exhausts one container, not the host. These sizes are for
# evaluation: services override them below where they need more, and mg-install
# writes values sized from the server's cores and memory into the site overlay
# (compose.site.yaml), which compose merges over these. Raise them the same way, in
# an overlay of your own. [VLD-ANB-MIDGARD-0029]
x-service: &service
  image: midgard/dev:local
  build:
    context: ../..
    dockerfile: deploy/compose/Dockerfile
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  mem_limit: 512m
  memswap_limit: 512m
  cpus: 1.0
  pids_limit: 256
  ulimits:
    nofile: { soft: 4096, hard: 4096 }
  environment:
    MIDGARD_KEYSTORE_PASSPHRASE_FILE: /keystore-passphrase/passphrase

services:
  init:
    <<: *service
    entrypoint: ["midgard-init"]
    network_mode: none
    volumes:
      - core-state:/vol/core-state
      - mimir-identity:/vol/mimir-identity
      - mimir-state:/vol/mimir-state
      - probe-identity:/vol/probe-identity
      - fleet-identity:/vol/fleet-identity
      - fleet-state:/vol/fleet-state
      - fleet-clients:/vol/fleet-clients
      - heimdall-identity:/vol/heimdall-identity
      - heimdall-state:/vol/heimdall-state
      - heimdall-clients:/vol/heimdall-clients
      - gateway-identity:/vol/gateway-identity
      - forge-identity:/vol/forge-identity
      - forge-state:/vol/forge-state
      - core-passphrase:/vol/core-passphrase
      - mimir-passphrase:/vol/mimir-passphrase
      - probe-passphrase:/vol/probe-passphrase
      - fleet-passphrase:/vol/fleet-passphrase
      - fleet-clients-passphrase:/vol/fleet-clients-passphrase
      - heimdall-passphrase:/vol/heimdall-passphrase
      - heimdall-clients-passphrase:/vol/heimdall-clients-passphrase
      - forge-passphrase:/vol/forge-passphrase
    # mg-admin's own operations on the state directory use the enclosure's passphrase;
    # init.sh names each service's passphrase explicitly where it writes that service's
    # keystores.
    environment:
      MIDGARD_KEYSTORE_PASSPHRASE_FILE: /vol/core-passphrase/passphrase

  # The edge on the host port, and on the mesh the door certified workloads sync
  # records into the fabric through.
  gateway:
    <<: *service
    entrypoint:
      - http-gateway
      - --state-dir
      - /state
      - --bind
      - 0.0.0.0:7710
      # The plaintext edge on the container's interface, published to the host's
      # loopback only; TLS termination fronts it off-host. [VLD-ANB-MIDGARD-0032]
      - --allow-non-loopback
      - --mesh-bind
      - 0.0.0.0:7711
      - --mesh-identity-dir
      - /mesh-identity
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - core-state:/state
      - gateway-identity:/mesh-identity:ro
      - core-passphrase:/keystore-passphrase:ro
    networks: [edge, mesh]
    ports:
      - "127.0.0.1:7710:7710"
    # The edge holds every client connection: more memory, threads and descriptors.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    ulimits:
      nofile: { soft: 8192, hard: 8192 }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "midgard-ready", "7710", "/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12

  mimir-server:
    <<: *service
    entrypoint:
      - mimir-server
      - --identity-dir
      - /identity
      - --state-dir
      - /state
      - --purposes
      - investigation
      - --bind
      - 0.0.0.0:7720
      - --health-bind
      - 0.0.0.0:9090
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - mimir-identity:/identity:ro
      - mimir-passphrase:/keystore-passphrase:ro
      - mimir-state:/state
    networks: [mesh]
    # Inference, and with Granite the verification and staging of the weights.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 4.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "midgard-ready", "9090", "/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One PQ-mTLS inference call as a certified consumer:
  #   docker compose -f deploy/compose/compose.yaml run --rm probe
  probe:
    <<: *service
    profiles: [probe]
    entrypoint:
      - mimir-probe
      - --identity-dir
      - /identity
      - --addr
      - mimir-server:7720
      - --purpose
      - investigation
    depends_on:
      mimir-server:
        condition: service_healthy
    volumes:
      - probe-identity:/identity:ro
      - probe-passphrase:/keystore-passphrase:ro
    networks: [mesh]

  bifrost-fleet:
    <<: *service
    entrypoint:
      - bifrost-fleet
      - --identity-dir
      - /identity
      - --state-dir
      - /state
      - --bind
      - 0.0.0.0:7740
      - --health-bind
      - 0.0.0.0:9090
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - fleet-identity:/identity:ro
      - fleet-passphrase:/keystore-passphrase:ro
      - fleet-state:/state
    networks: [mesh]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "midgard-ready", "9090", "/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # An installation checking in. Pass other versions with
  #   docker compose ... run --rm fleet-agent --channel stable --version 0.2.0
  fleet-agent:
    <<: *service
    profiles: [fleet]
    entrypoint:
      - bifrost-agent
      - --identity-dir
      - /identity
      - --service
      - fleet-agent-1
      - --addr
      - bifrost-fleet:7740
    command: ["--channel", "stable", "--version", "0.1.0"]
    depends_on:
      bifrost-fleet:
        condition: service_healthy
    volumes:
      - fleet-clients:/identity:ro
      - fleet-clients-passphrase:/keystore-passphrase:ro
    networks: [mesh]

  # The fleet as an operator sees it: versions, liveness, drift.
  fleet-status:
    <<: *service
    profiles: [fleet]
    entrypoint:
      - bifrost-agent
      - --identity-dir
      - /identity
      - --service
      - fleet-operator
      - --addr
      - bifrost-fleet:7740
      - --status
    depends_on:
      bifrost-fleet:
        condition: service_healthy
    volumes:
      - fleet-clients:/identity:ro
      - fleet-clients-passphrase:/keystore-passphrase:ro
    networks: [mesh]

  heimdall-feed:
    <<: *service
    entrypoint:
      - heimdall-feed
      - --identity-dir
      - /identity
      - --state-dir
      - /state
      - --bind
      - 0.0.0.0:7730
      - --health-bind
      - 0.0.0.0:9090
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - heimdall-identity:/identity:ro
      - heimdall-passphrase:/keystore-passphrase:ro
      - heimdall-state:/state
    networks: [mesh]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "midgard-ready", "9090", "/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  # A feed source submitting one signed observation. Pass your own with
  #   docker compose ... run --rm feed-source --kind air-track --entity AC-7 --attrs speed=410
  feed-source:
    <<: *service
    profiles: [heimdall]
    entrypoint:
      - heimdall-source
      - --identity-dir
      - /identity
      - --service
      - feed-source-1
      - --addr
      - heimdall-feed:7730
    command: ["--kind", "air-track", "--entity", "AC-1", "--attrs", "speed=420"]
    depends_on:
      heimdall-feed:
        condition: service_healthy
    volumes:
      - heimdall-clients:/identity:ro
      - heimdall-clients-passphrase:/keystore-passphrase:ro
    networks: [mesh]

  # The fused picture as an analyst reads it.
  picture:
    <<: *service
    profiles: [heimdall]
    entrypoint:
      - heimdall-source
      - --identity-dir
      - /identity
      - --service
      - picture-analyst
      - --addr
      - heimdall-feed:7730
      - --picture
    depends_on:
      heimdall-feed:
        condition: service_healthy
    volumes:
      - heimdall-clients:/identity:ro
      - heimdall-clients-passphrase:/keystore-passphrase:ro
    networks: [mesh]

  # Syncs the sample sources in deploy/compose/forge into versioned datasets and on
  # into the enclosure's fabric through the gateway's mesh door, every job's interval.
  forge-worker:
    <<: *service
    entrypoint:
      - forge-worker
      - --identity-dir
      - /identity
      - --state-dir
      - /state
      - --jobs
      - /etc/midgard/forge/jobs.json
      - --gateway
      - gateway:7711
      - --health-bind
      - 0.0.0.0:9090
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - forge-identity:/identity:ro
      - forge-passphrase:/keystore-passphrase:ro
      - forge-state:/state
    networks: [mesh]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "midgard-ready", "9090", "/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  # Only for publishing the gateway on 127.0.0.1: no masquerade, so nothing on it is
  # routed out of the host, and no traffic between its containers (the console's
  # browser reaches the gateway through the published port). `internal: true` would
  # deny egress outright, but Docker publishes no port from an internal network. A
  # host that NATs or forwards this subnet itself (Docker Desktop's VM does) would
  # still route it, so the bridge has a fixed interface name, mg-edge0, and mg-install
  # adds a firewall rule (DOCKER-USER) that drops anything forwarded from it to another
  # interface. Without the installer, only the bridge setting applies. The name is at
  # most 15 characters; MIDGARD_EDGE_BRIDGE changes it, so a second project (smoke.sh)
  # can run beside this one. [VLD-ANB-MIDGARD-0061]
  edge:
    driver_opts:
      com.docker.network.bridge.name: ${MIDGARD_EDGE_BRIDGE:-mg-edge0}
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  mesh:
    internal: true

volumes:
  core-state: {}
  mimir-identity: {}
  mimir-state: {}
  probe-identity: {}
  fleet-identity: {}
  fleet-state: {}
  fleet-clients: {}
  heimdall-identity: {}
  heimdall-state: {}
  heimdall-clients: {}
  gateway-identity: {}
  forge-identity: {}
  forge-state: {}
  core-passphrase: {}
  mimir-passphrase: {}
  probe-passphrase: {}
  fleet-passphrase: {}
  fleet-clients-passphrase: {}
  heimdall-passphrase: {}
  heimdall-clients-passphrase: {}
  forge-passphrase: {}
