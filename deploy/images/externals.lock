# The images Midgard runs but does not build, pinned by their index digest, and the
# bundle member each one crosses the air gap as. [VLD-ANB-MIDGARD-0035]
# [VLD-ANB-MIDGARD-0068]
#
# The release machine fetches each one once, while connected, as an OCI archive that
# keeps its index digest (`bash deploy/images/externals.sh fetch DIR`); `run.sh
# release-bundle` packs them into the air-gap bundle, and install.sh refuses an archive
# whose digest is not the one here. Each digest must equal the pin where the image is
# used (`use`): tools/ci/tests/externals-lock.test.sh checks that they agree.
#
#   seedImage           deploy/helm/midgard/values.yaml (seedImage.repository and .digest)
#   modelServing.image  deploy/helm/midgard/values.yaml, deploy/compose/compose.granite.yaml
#                       and deploy/kind/model.sh
#   egressBroker.image  deploy/helm/midgard/values.yaml
#   kind                deploy/kind/cluster.yaml: the kind node image, for rehearsals only
#
# reference                                      index digest                                                             member                            use
