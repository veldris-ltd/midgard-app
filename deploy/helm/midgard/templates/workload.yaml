{{- /*
One hardened StatefulSet + Service + NetworkPolicies per enabled service. Non-root,
read-only root filesystem, no capabilities, the restricted seccomp profile, probes and
resource limits; a single replica with its own volume, because each service holds a
single-writer state directory. [AC-B-1] [AC-B-2] [RC-18] [RC-33] [NFR-SEC-1]
*/ -}}
{{- define "midgard.hardened" -}}
allowPrivilegeEscalation: false
readOnlyRootFilesystem: true
capabilities:
  drop: ["ALL"]
{{- end -}}
{{- /*
Every port names who may reach it: "*" (any pod in the cluster) refuses to render,
enabled or not, before anything else is read. [VLD-ANB-MIDGARD-0027]
*/ -}}
{{- range .Values.services }}
{{- if kindIs "map" . }}
{{- $service := . }}
{{- range (.ports | default list) }}
{{- if and (kindIs "map" .) (has "*" (.from | default list)) }}
{{- fail (printf "service %v port %v: from must name workloads, not \"*\"" $service.name .name) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- range .Values.services }}
{{- if .enabled }}
{{- /* The image: image.single as given (kind, development); else pinned by digest; else,
only with image.allowTag (development), by tag and pulled every time. A release chart
does not render without every digest. [VLD-ANB-MIDGARD-0012] */ -}}
{{- $digest := index (default dict $.Values.image.digests) .name | default "" }}
{{- $image := "" }}
{{- $pullPolicy := $.Values.image.pullPolicy }}
{{- if $.Values.image.single }}
{{- $image = $.Values.image.single }}
{{- else if $digest }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" $digest) }}
{{- fail (printf "image.digests.%s is %q, not sha256:<64 lower-case hex digits>" .name $digest) }}
{{- end }}
{{- $image = printf "%s/%s@%s" $.Values.image.registry .name $digest }}
{{- $pullPolicy = "IfNotPresent" }}
{{- else if $.Values.image.allowTag }}
{{- $image = printf "%s/%s:%s" $.Values.image.registry .name $.Values.image.tag }}
{{- $pullPolicy = "Always" }}
{{- else }}
{{- fail (printf "image.digests.%s is empty: release charts pin images by digest (deploy/helm/set-digests.sh); set image.allowTag=true only for a development cluster" .name) }}
{{- end }}
{{- $eb := $.Values.egressBroker }}
{{- $broker := and $eb.enabled (eq .name $eb.service) }}
{{- $ms := $.Values.modelServing }}
{{- $model := and $ms.enabled (eq .name $ms.service) }}
{{- $args := .args }}
{{- if $broker }}
{{- $args = concat $args (list "--egress-routes" "/egress-routes/routes.json") }}
{{- end }}
{{- if .sourcesSecret }}
{{- $args = concat $args (list "--secrets-dir" "/secrets") }}
{{- end }}
{{- if eq .name $ms.service }}
{{- $args = concat $args (list "--model-marking" $ms.modelMarking) }}
{{- end }}
{{- if $model }}
{{- $args = concat $args (list "--engine" $ms.engine "--model-dir" (printf "/models/%s" $ms.modelDir) "--model-trust" "/model-trust/model-signing.pub" "--serve-dir" "/serve" "--sidecar" "127.0.0.1:8080") }}
{{- end }}
{{- $nodeSelector := .nodeSelector }}
{{- $tolerations := .tolerations }}
{{- if $model }}
{{- $nodeSelector = $ms.nodeSelector | default $nodeSelector }}
{{- $tolerations = $ms.tolerations | default $tolerations }}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: midgard
spec:
  serviceName: {{ .name }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/part-of: midgard
      annotations:
        # Whether the pod's image is pinned by digest, so a cluster audit can list the
        # pods that are not. [VLD-ANB-MIDGARD-0012]
        midgard.veldris.io/image-pinned: {{ contains "@sha256:" $image | toString | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with $nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- if or .seed $broker .identity }}
      initContainers:
      {{- end }}
      {{- if $broker }}
        # Render the egress broker's configuration from the routes, refusing any job
        # whose source is not one of the broker's local ports.
        - name: egress-config
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          {{- if $.Values.image.single }}
          command: ["forge-egress"]
          {{- else }}
          env:
            - name: MIDGARD_SERVICE
              value: forge-egress
          {{- end }}
          args: ["--routes", "/egress-routes/routes.json", "--jobs", "/jobs/jobs.json",
                 "--ca-dir", "/etc/egress/ca", "--out", "/egress/haproxy.cfg"]
          securityContext:
{{ include "midgard.hardened" . | indent 12 }}
          resources:
{{ toYaml $.Values.defaultResources | indent 12 }}
          volumeMounts:
            - { name: egress, mountPath: /egress }
            - { name: egress-routes, mountPath: /egress-routes, readOnly: true }
            - { name: jobs, mountPath: /jobs, readOnly: true }
            {{- if not $.Values.image.single }}
            - { name: trust, mountPath: /trust, readOnly: true }
            {{- end }}
      {{- end }}
      {{- if .seed }}
        # First start only: unpack the provisioned state (keys, policy, ledger) into the
        # volume. Later starts keep what the service has written.
        # A release service image is distroless (no shell, no tar), so this runs in
        # seedImage, pinned by digest; image.single (development) carries both itself.
        # [VLD-ANB-MIDGARD-0068]
        {{- if $.Values.image.single }}
        - name: seed
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          # The volume's root belongs to the node, so leave its own mode and times alone.
          command: ["/bin/sh", "-c", "[ -e /state/.seeded ] || { tar --no-overwrite-dir --no-same-owner -xf /seed/seed.tar -C /state && touch /state/.seeded; }"]
        {{- else }}
        {{- $seed := $.Values.seedImage }}
        {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" ($seed.digest | default "")) }}
        {{- fail "seedImage.digest must be sha256:<64 hex>: the seed image is pinned by digest" }}
        {{- end }}
        - name: seed
          image: {{ printf "%s@%s" $seed.repository $seed.digest }}
          imagePullPolicy: {{ $seed.pullPolicy | default "IfNotPresent" }}
          # The volume's root belongs to the node, so leave its own mode and times alone:
          # BusyBox tar does not change an existing directory it did not create, which
          # is what GNU tar's --no-overwrite-dir asks for (and BusyBox does not accept).
          command: ["sh", "-c", "[ -e /state/.seeded ] || { tar --no-same-owner -xf /seed/seed.tar -C /state && touch /state/.seeded; }"]
        {{- end }}
          securityContext:
{{ include "midgard.hardened" . | indent 12 }}
          resources:
{{ toYaml $.Values.defaultResources | indent 12 }}
          volumeMounts:
            - { name: state, mountPath: /state }
            - { name: seed, mountPath: /seed, readOnly: true }
      {{- end }}
      {{- if .identity }}
        # The keystore passphrase, copied into memory as a file the service's own user
        # owns, mode 0400: a secret or CSI volume reaches a non-root pod only as a
        # root-owned, group-readable file, which the service refuses (a passphrase file
        # must be owner-only). The service never mounts the source. [VLD-ANB-MIDGARD-0007]
        # [VLD-ANB-MIDGARD-0018]
        # A release service image is distroless (no shell), so, like the seed step, this
        # runs in seedImage, pinned by digest; image.single (development) carries a
        # shell itself. [VLD-ANB-MIDGARD-0068]
        {{- if $.Values.image.single }}
        - name: keystore-passphrase
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          command: ["/bin/sh", "-c", "umask 077 && rm -f /keystore-passphrase/passphrase /keystore-passphrase/.passphrase && cat /keystore-passphrase-source/passphrase > /keystore-passphrase/.passphrase && chmod 0400 /keystore-passphrase/.passphrase && mv /keystore-passphrase/.passphrase /keystore-passphrase/passphrase"]
        {{- else }}
        {{- $tools := $.Values.seedImage }}
        {{- if not (regexMatch "^sha256:[0-9a-f]{64}$" ($tools.digest | default "")) }}
        {{- fail "seedImage.digest must be sha256:<64 hex>: the seed image is pinned by digest" }}
        {{- end }}
        - name: keystore-passphrase
          image: {{ printf "%s@%s" $tools.repository $tools.digest }}
          imagePullPolicy: {{ $tools.pullPolicy | default "IfNotPresent" }}
          command: ["sh", "-c", "umask 077 && rm -f /keystore-passphrase/passphrase /keystore-passphrase/.passphrase && cat /keystore-passphrase-source/passphrase > /keystore-passphrase/.passphrase && chmod 0400 /keystore-passphrase/.passphrase && mv /keystore-passphrase/.passphrase /keystore-passphrase/passphrase"]
        {{- end }}
          securityContext:
{{ include "midgard.hardened" . | indent 12 }}
          resources:
{{ toYaml $.Values.defaultResources | indent 12 }}
          volumeMounts:
            - { name: keystore-passphrase-source, mountPath: /keystore-passphrase-source, readOnly: true }
            - { name: keystore-passphrase, mountPath: /keystore-passphrase }
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ $image }}
          imagePullPolicy: {{ $pullPolicy }}
          {{- if $.Values.image.single }}
          command: [{{ .binary | quote }}]
          {{- end }}
          env:
            {{- if not $.Values.image.single }}
            - name: MIDGARD_SERVICE
              value: {{ .name }}
            {{- end }}
            # The pod's own address, so the health port binds it ("$(POD_IP):9090")
            # rather than every interface. [VLD-ANB-MIDGARD-0027]
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            {{- if .identity }}
            - name: MIDGARD_KEYSTORE_PASSPHRASE_FILE
              value: /keystore-passphrase/passphrase
            {{- end }}
          args: {{ toJson $args }}
          ports:
            {{- range .ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
            {{- end }}
          securityContext:
{{ include "midgard.hardened" . | indent 12 }}
          resources:
{{ toYaml (.resources | default $.Values.defaultResources) | indent 12 }}
          readinessProbe:
            httpGet: { path: {{ .probe.path }}, port: {{ .probe.port }} }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            {{- if $model }}
            # With a model sidecar, readiness waits on the sidecar; liveness must not.
            {{- end }}
            httpGet: { path: {{ if $model }}/healthz{{ else }}{{ .probe.path }}{{ end }}, port: {{ .probe.port }} }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: state, mountPath: /state }
            {{- if .identity }}
            - { name: identity, mountPath: /identity, readOnly: true }
            - { name: keystore-passphrase, mountPath: /keystore-passphrase, readOnly: true }
            {{- end }}
            {{- if .jobsConfigMap }}
            - { name: jobs, mountPath: /jobs, readOnly: true }
            {{- end }}
            {{- if $broker }}
            - { name: egress-routes, mountPath: /egress-routes, readOnly: true }
            {{- end }}
            {{- if .sourcesSecret }}
            - { name: sources, mountPath: /secrets, readOnly: true }
            {{- end }}
            {{- if $model }}
            - { name: models, mountPath: /models, readOnly: true }
            - { name: model-trust, mountPath: /model-trust, readOnly: true }
            - { name: model-serve, mountPath: /serve }
            {{- end }}
            {{- if not $.Values.image.single }}
            - { name: trust, mountPath: /trust, readOnly: true }
            {{- end }}
        {{- if $model }}
        # The model engine, on the pod's loopback only. It never sees the model volume:
        # it waits for mimir-server to stage the verified weights into /serve, which it
        # mounts read-only, and loads that copy. [MG-SEC-14]
        - name: model-sidecar
          image: {{ $ms.image }}
          imagePullPolicy: {{ $ms.pullPolicy | default "IfNotPresent" }}
          command: {{ toJson (concat (list "sh" "-c" "until [ -f /serve/staged.ready ]; do sleep 1; done; exec \"$@\"" "wait-for-staged") $ms.sidecarEntrypoint) }}
          args: {{ toJson $ms.sidecarArgs }}
          securityContext:
{{ include "midgard.hardened" . | indent 12 }}
          resources:
{{ toYaml ($ms.resources | default $.Values.defaultResources) | indent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: model-serve, mountPath: /serve, readOnly: true }
        {{- end }}
        {{- if $broker }}
        # TLS 1.3 to each declared upstream, verified against its pinned CA; nothing else.
        - name: egress-broker
          image: {{ $eb.image }}
          imagePullPolicy: IfNotPresent
          args: ["haproxy", "-f", "/egress/haproxy.cfg"]
          securityContext:
{{ include "midgard.hardened" . | indent 12 }}
          resources:
{{ toYaml $.Values.defaultResources | indent 12 }}
          volumeMounts:
            - { name: egress, mountPath: /egress, readOnly: true }
            - { name: egress-ca, mountPath: /etc/egress/ca, readOnly: true }
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .identity }}
        - name: identity
          {{ include "midgard.secretSource" (list $ (printf "%s-identity" .name)) }}
        - name: keystore-passphrase-source
          {{ include "midgard.secretSource" (list $ (printf "%s-keystore-passphrase" .name)) }}
        # Memory only, and only the passphrase init container writes it.
        - name: keystore-passphrase
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        {{- end }}
        {{- if .seed }}
        - name: seed
          {{ include "midgard.secretSource" (list $ (printf "%s-seed" .name)) }}
        {{- end }}
        {{- if .jobsConfigMap }}
        - name: jobs
          configMap: { name: {{ .jobsConfigMap }} }
        {{- end }}
        {{- if $broker }}
        - name: egress
          emptyDir: {}
        - name: egress-routes
          configMap: { name: {{ $eb.routesConfigMap }} }
        - name: egress-ca
          secret: { secretName: {{ $eb.caSecret }}, defaultMode: 288 }
        {{- end }}
        {{- if .sourcesSecret }}
        - name: sources
          secret: { secretName: {{ .sourcesSecret }}, defaultMode: 288 }
        {{- end }}
        {{- if $model }}
        - name: models
          persistentVolumeClaim: { claimName: {{ $ms.modelsClaim }}, readOnly: true }
        - name: model-trust
          configMap: { name: {{ $ms.trustConfigMap }} }
        # The verified weights, staged by mimir-server for the sidecar. [MG-SEC-14]
        - name: model-serve
          emptyDir: { sizeLimit: {{ $ms.serveSizeLimit | default "8Gi" }} }
        {{- end }}
        {{- if not $.Values.image.single }}
        - name: trust
          configMap: { name: {{ $.Values.trustKeyConfigMap }} }
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .storage | default "64Mi" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
spec:
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    {{- range .ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
    {{- end }}
---
# Who may reach {{ .name }}, port by port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}-ingress
  namespace: {{ $.Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  policyTypes: [Ingress]
  ingress:
    {{- range .ports }}
    {{- /* "metrics-scraper" names the scraper: scraper.podLabel, and scraper.nodeCidrs for
    the kubelet's probes. [VLD-ANB-MIDGARD-0027] */}}
    {{- $scraper := has "metrics-scraper" .from }}
    {{- $from := list }}
    {{- range .from }}
    {{- $from = append $from (ternary $.Values.scraper.podLabel . (eq . "metrics-scraper")) }}
    {{- end }}
    - ports:
        - { protocol: TCP, port: {{ .port }} }
      from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ toJson $from }}
      {{- if $scraper }}
      {{- range $.Values.scraper.nodeCidrs }}
        - ipBlock: { cidr: {{ . }} }
      {{- end }}
      {{- end }}
    {{- end }}
{{- if or .talksTo $broker }}
---
# The service ports {{ .name }} may reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ .name }}-egress
  namespace: {{ $.Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  policyTypes: [Egress]
  egress:
    {{- range .talksTo }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name }}
      ports:
        - { protocol: TCP, port: {{ .port }} }
    {{- end }}
    {{- if $broker }}
    {{- range $eb.upstreamPorts }}
    # An egress broker upstream port, outside the cluster.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: {{ . }} }
    {{- end }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
