{{- /*
secrets.provider=externalSecrets: one ExternalSecret per Secret a workload mounts,
populating exactly the names the kubernetes provider expects, so the pod template does
not change. The identity, the keystore passphrase and the seed are separate remote keys
and separate Secrets: the passphrase never sits beside the keystores. [NFR-SEC-1]
[VLD-ANB-MIDGARD-0018] [VLD-ANB-MIDGARD-0007]
*/ -}}
{{- if eq .Values.secrets.provider "externalSecrets" }}
{{- $es := .Values.secrets.externalSecrets }}
{{- range .Values.services }}
{{- if and .enabled .identity }}
{{- $files := dict
      "identity" (list (printf "%s.keystore" .name) (printf "%s.audit.keystore" .name) (printf "%s.cert" .name) "mesh.anchor" "mesh.crl")
      "keystore-passphrase" (list "passphrase") }}
{{- if .seed }}
{{- $_ := set $files "seed" (list "seed.tar") }}
{{- end }}
{{- $svc := .name }}
{{- range $kind := list "identity" "keystore-passphrase" "seed" }}
{{- if hasKey $files $kind }}
{{- $secret := printf "%s-%s" $svc $kind }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $secret }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ $svc }}
    app.kubernetes.io/part-of: midgard
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeRef.name }}
    kind: {{ $es.storeRef.kind }}
  target:
    name: {{ $secret }}
    creationPolicy: Owner
  data:
    {{- range index $files $kind }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $es.keyPrefix }}{{ $secret }}
        property: {{ . }}
        decodingStrategy: {{ $es.decodingStrategy }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
