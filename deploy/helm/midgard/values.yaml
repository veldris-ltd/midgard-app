# Midgard Helm values. The defaults are the release posture: one signed,
# verify-before-run image per service. deploy/kind/values.yaml overrides the image for
# a local cluster built from source.
namespace: midgard-enclosure
# Create the namespace (with the restricted pod-security profile) from this chart.
createNamespace: true

image:
  # Release: "<registry>/<service>@<digest>", each image re-verifying its binary's
  # signature before it runs (its entrypoint, mg-verify --run-service: see
  # deploy/images/service.Dockerfile). The verifier and its key travel inside the
  # image, so only the digest binds a pod to the signed build: a release chart pins
  # every image by digest, and does not render while a service's digest is empty.
  # deploy/helm/set-digests.sh writes them from the signed images.lock of a release,
  # which names every release image (supply-chain/release-artefacts.txt), so each has an
  # entry here. mimir-probe is one the chart does not run: it is the image for the
  # mimir-probe mesh client (`clients`, below), which runs as a Job, and its digest is
  # here so that Job can be pinned too. [VLD-ANB-MIDGARD-0012]
  registry: registry.enclosure.local/midgard
  digests:
    http-gateway: ""
    mimir-server: ""
    mimir-probe: ""
    bifrost-fleet: ""
    heimdall-feed: ""
    forge-worker: ""
  # true renders "<registry>/<service>:<tag>" for a service with no digest, with
  # imagePullPolicy Always: for development clusters only, never a release.
  allowTag: false
  tag: "0.1.0-rc.3"
  # Used for image.single only: a digest pulls IfNotPresent, a tag Always.
  pullPolicy: IfNotPresent
  # Set to one image holding every binary (the compose image) to run each service's
  # binary directly instead — for development clusters only; nothing is verified.
  single: ""

# The pinned public release trust key mg-verify checks every image against before it
# runs. Provisioned by the key ceremony (RT-35). Unused with image.single.
trustKeyConfigMap: midgard-release-trust

# The image the `seed` init container unpacks a service's seed.tar with (services with
# seed: true). A release service image runs on distroless, with no shell or tar, so
# seeding needs its own small image with both: by default Google's distroless
# base-debian12 debug-nonroot, whose BusyBox provides sh and tar, and nothing runs in it
# but the one unpack command. It runs as the service's user, with the same hardened
# securityContext, and mounts only the state volume and the seed Secret. Pinned by
# digest, always: the chart refuses a digest that is not sha256:<64 hex>. Mirror it into
# the enclosure's registry and set repository to match. With image.single the single
# image is used instead, and this is unused. [VLD-ANB-MIDGARD-0068]
# The digest is the multi-arch index digest of
# gcr.io/distroless/base-debian12:debug-nonroot, read with
# `docker buildx imagetools inspect` on 2026-11-01 (linux/amd64 manifest
# sha256:23f77acf6d1b00a5d63ed914c2afa1e1a64eb473388be5eed8b8937b08266af8).
seedImage:
  repository: gcr.io/distroless/base-debian12
  digest: sha256:9162795c8ec16d4f83921e4c173d07ce366a5d6eef9c461e707dbef4f81146b9
  pullPolicy: IfNotPresent

# Where each service's identity, keystore passphrase and seed come from. [NFR-SEC-1]
# [VLD-ANB-MIDGARD-0018] See README.md beside this file.
#   kubernetes       Secrets "<name>-identity", "<name>-keystore-passphrase" and
#                    "<name>-seed", created outside the chart. They live in etcd and in
#                    every etcd backup, so outside the kind profile (image.single) the
#                    render fails unless acknowledgeEtcdEncryption is true: set it only
#                    once etcd encrypts Secrets at rest (EncryptionConfiguration with a
#                    KMS v2 provider).
#   csi              Secrets Store CSI driver volumes, from SecretProviderClass objects
#                    of the same names that the operator supplies; nothing is written to
#                    etcd.
#   externalSecrets  ExternalSecret objects (external-secrets.io/v1beta1) from
#                    externalSecrets.storeRef populate the same Secret names, so the pod
#                    template is the same as for kubernetes.
secrets:
  provider: kubernetes
  acknowledgeEtcdEncryption: false
  externalSecrets:
    # The SecretStore or ClusterSecretStore holding the files. Required for the
    # externalSecrets provider.
    storeRef: { name: "", kind: ClusterSecretStore }
    # Remote key for Secret "<name>-..." is "<keyPrefix><name>-...", one property per file.
    keyPrefix: midgard/
    refreshInterval: 1h
    # Keystores and seeds are binary: store each property base64-encoded.
    decodingStrategy: Base64

# Namespace-wide resource ceiling.
quota:
  requestsCpu: "4"
  requestsMemory: 4Gi
  limitsCpu: "8"
  limitsMemory: 8Gi
  pods: "50"

# Default per-container resources (overridable per service).
defaultResources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { cpu: "1", memory: 512Mi }

# Who may reach the health ports (/healthz, /readyz, /metrics on 9090), which carry no
# identity check of their own. [VLD-ANB-MIDGARD-0027]
#   podLabel   the app.kubernetes.io/name of the scraper pod: a port whose from: lists
#              "metrics-scraper" admits pods with this label. Label your Prometheus pod
#              app.kubernetes.io/name=metrics-scraper, or set this to its name.
#   nodeCidrs  node address ranges admitted to those ports too, for CNIs that apply
#              NetworkPolicy to the kubelet's probes; empty admits no node range.
scraper:
  podLabel: metrics-scraper
  nodeCidrs: []

# The services. Each holds a single-writer state directory (sealed journals and a
# PQ-signed ledger, locked while it runs), so each is a one-replica StatefulSet with
# its own volume: a second replica would be refused the lock, not share the load.
#
# Per service:
#   args            the binary's options (/identity, /state and /jobs are the mounts)
#   ports           each port, and the app names allowed to reach it. Name workloads:
#                   "*" (any pod) refuses to render. "metrics-scraper" stands for the
#                   scraper above, and also admits scraper.nodeCidrs.
#   probe           the HTTP readiness/liveness endpoint
#   identity        mount "<name>-identity" (what `mg-admin mesh issue` wrote) at
#                   /identity, and "<name>-keystore-passphrase" (key `passphrase`) at
#                   /keystore-passphrase (copied owner-only into memory), both
#                   from secrets.provider
#   seed            on first start, unpack "<name>-seed" (seed.tar) into /state
#   storage         the state volume's size
#   jobsConfigMap   mount this ConfigMap at /jobs
#   talksTo         the service ports this one may reach (egress)
#   sourcesSecret   mount this Secret at /secrets (forge-worker's --secrets-dir)
#   nodeSelector, tolerations, affinity   the pod's placement
# Secrets and the jobs ConfigMap are provisioned outside the chart, from key custody
# (deploy/kind/bootstrap-secrets.sh for a local kind cluster only).
services:
  - name: http-gateway
    enabled: true
    binary: http-gateway
    args: ["--state-dir", "/state", "--bind", "0.0.0.0:7710", "--allow-non-loopback",
           "--mesh-bind", "0.0.0.0:7711", "--mesh-identity-dir", "/identity"]
    ports:
      - { name: http, port: 7710, from: [console-edge] }
      - { name: mesh, port: 7711, from: [forge-worker] }
    probe: { port: 7710, path: /api/v1/health }
    identity: true
    seed: true
    storage: 256Mi

  # Inference admission control, at its defaults: max_tokens is clamped to
  # --max-tokens; a prompt over --max-prompt-bytes is refused PROMPT_TOO_LARGE; more
  # than --max-concurrent calls in flight (twice the sidecar's two slots), or
  # --max-concurrent-per-identity for one caller, are refused BUSY; a completion waits
  # at most --infer-timeout seconds on the sidecar. [VLD-ANB-MIDGARD-0016]
  # Every --reload-interval seconds it looks for STOP in /state, and with modelServing
  # re-reads /state/revoked.list and the model trust key and re-checks the verified
  # manifest: STOP, or the model id in revoked.list, stops inference (readiness false,
  # calls refused SERVING_STOPPED or MODEL_REVOKED) until it is removed
  # (docs/ops/RUNBOOKS.md RB-8). [VLD-ANB-MIDGARD-0057]
  - name: mimir-server
    enabled: true
    binary: mimir-server
    args: ["--identity-dir", "/identity", "--state-dir", "/state",
           "--purposes", "investigation", "--bind", "0.0.0.0:7720",
           "--health-bind", "$(POD_IP):9090",
           "--max-tokens", "1024", "--max-prompt-bytes", "262144",
           "--max-concurrent", "4", "--max-concurrent-per-identity", "2",
           "--infer-timeout", "60", "--reload-interval", "60"]
    ports:
      - { name: mesh, port: 7720, from: [mimir-probe] }
      - { name: health, port: 9090, from: [metrics-scraper] }
    probe: { port: 9090, path: /readyz }
    identity: true
    seed: true
    storage: 64Mi

  - name: bifrost-fleet
    enabled: true
    binary: bifrost-fleet
    args: ["--identity-dir", "/identity", "--state-dir", "/state",
           "--bind", "0.0.0.0:7740", "--health-bind", "$(POD_IP):9090"]
    ports:
      - { name: mesh, port: 7740, from: [fleet-agent, fleet-operator] }
      - { name: health, port: 9090, from: [metrics-scraper] }
    probe: { port: 9090, path: /readyz }
    identity: true
    seed: true
    storage: 64Mi

  - name: heimdall-feed
    enabled: true
    binary: heimdall-feed
    args: ["--identity-dir", "/identity", "--state-dir", "/state",
           "--bind", "0.0.0.0:7730", "--health-bind", "$(POD_IP):9090"]
    ports:
      - { name: mesh, port: 7730, from: [feed-source, picture-analyst] }
      - { name: health, port: 9090, from: [metrics-scraper] }
    probe: { port: 9090, path: /readyz }
    identity: true
    seed: true
    storage: 64Mi

  - name: forge-worker
    enabled: true
    binary: forge-worker
    args: ["--identity-dir", "/identity", "--state-dir", "/state",
           "--jobs", "/jobs/jobs.json", "--gateway", "http-gateway:7711",
           "--health-bind", "$(POD_IP):9090"]
    ports:
      - { name: health, port: 9090, from: [metrics-scraper] }
    probe: { port: 9090, path: /readyz }
    identity: true
    storage: 128Mi
    jobsConfigMap: forge-jobs
    talksTo:
      - { name: http-gateway, port: 7711 }
    # The secrets job sources name (database passwords, secret keys), mounted at
    # /secrets for --secrets-dir. Empty: no sources need secrets.
    sourcesSecret: ""

# Serve a real model behind `service` instead of the reference engine. [FR-MI-1]
# [AC-MI-7] A sidecar runs the engine in the pod, listening on 127.0.0.1:8080 only.
# mimir-server verifies the model in /models/<modelDir> before it serves: a manifest
# signed by the key in trustConfigMap, and weights whose size, format and SHA-256
# match it. modelsClaim is a PersistentVolumeClaim holding the staged model
# directories; mimir-server mounts it read-only, and the sidecar not at all. [MG-SEC-14] The sidecar loads by path, so
# mimir-server copies the weights it verified, from the file it verified them through
# and hashing them again, into /serve — an emptyDir only it writes, at most
# serveSizeLimit — read-only and under their signed file name, then writes
# /serve/staged.ready. The sidecar mounts /serve read-only and runs sidecarEntrypoint
# with sidecarArgs only once that marker exists, so point sidecarArgs at
# /serve/<weights file>. It is ready only while the sidecar is healthy and the staged
# copy is unchanged.
# trustConfigMap holds the committed anchor: key model-signing.pub, built from
# deploy/trust/model-signing.pub (published by the key ceremony; deploy/kind/model.sh
# creates it from the checkout), mounted read-only at /model-trust. It is never built
# from the models claim, and mimir-server refuses a trust key inside the model
# directory. Without it, the pod does not start (fail closed). [VLD-ANB-MIDGARD-0028]
modelServing:
  enabled: false
  service: mimir-server
  # The model's accreditation, passed to `service` as --model-marking whether or not a
  # real model is enabled: the highest marking of data it may be given, LEVEL or
  # LEVEL:COMPARTMENT,... (UNCLASSIFIED, CONFIDENTIAL, SECRET, TOP_SECRET). A request
  # marked above it is refused by policy and the refusal audited. UNCLASSIFIED refuses
  # every marked prompt; raise it only to the model's actual accreditation.
  # [VLD-ANB-MIDGARD-0034]
  modelMarking: UNCLASSIFIED
  # llama-cpp (CPU, GGUF) or vllm (GPU, safetensors).
  engine: llama-cpp
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:bbf6fde2eedbe1b6c8ee9d93a54ea4606e90a4eda18681a7f8b4b6ed0cbc9f00
  pullPolicy: IfNotPresent
  modelsClaim: mimir-models
  modelDir: granite
  trustConfigMap: mimir-model-trust
  # Room for the staged copy of the weights.
  serveSizeLimit: 4Gi
  # The engine's own program, from its image, and arguments. For vLLM, use its image,
  # its server as sidecarEntrypoint and e.g. ["--model", "/serve/<weights file>",
  # "--served-model-name", "<manifest id>", "--host", "127.0.0.1", "--port", "8080"],
  # with a GPU in resources. Only the signed weights file is staged.
  sidecarEntrypoint: ["/app/llama-server"]
  sidecarArgs: ["-m", "/serve/granite-3.3-2b-instruct-Q4_K_M.gguf",
                "--alias", "granite-3.3-2b-instruct-q4km",
                "--host", "127.0.0.1", "--port", "8080", "--ctx-size", "4096"]
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 4Gi }
  # Where the model may run, overriding the service's own placement: for vLLM, e.g.
  # nodeSelector { nvidia.com/gpu.present: "true" } and the GPU nodes' toleration.
  nodeSelector: {}
  tolerations: []

# Sources outside the enclosure, through the egress broker, for `service`. [NFR-SEC-1]
# An init container renders HAProxy's configuration with forge-egress from the routes
# ConfigMap (key routes.json), refusing any job that would reach around it; HAProxy
# runs beside the worker, originating TLS 1.3 to each route's upstream against the CA
# files in caSecret; the worker is started with --egress-routes; and the pod may reach
# only upstreamPorts outside the cluster.
egressBroker:
  enabled: false
  service: forge-worker
  routesConfigMap: forge-egress-routes
  caSecret: forge-egress-ca
  image: haproxy@sha256:34cc7d1f6142464d7d2b73e2a1eef7392556dbf304160aef543e513cfd9e5162
  upstreamPorts: []

# Mesh clients that run as Jobs (probes, agents, sources): the service ports each may
# reach. Their identities are Secrets named here.
clients:
  - { name: mimir-probe, talksTo: [{ name: mimir-server, port: 7720 }] }
  - { name: fleet-agent, talksTo: [{ name: bifrost-fleet, port: 7740 }] }
  - { name: fleet-operator, talksTo: [{ name: bifrost-fleet, port: 7740 }] }
  - { name: feed-source, talksTo: [{ name: heimdall-feed, port: 7730 }] }
  - { name: picture-analyst, talksTo: [{ name: heimdall-feed, port: 7730 }] }
