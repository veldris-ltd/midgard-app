# Helm values for a local kind cluster: every service runs its binary from the compose
# image built from this checkout and loaded into the cluster (`kind load`). Nothing is
# signature-verified before it runs — this is for development and evaluation, not a
# release. [RC-33]
image:
  single: midgard/dev:local
  pullPolicy: Never
  # No digests either: the image is built here, not released. [VLD-ANB-MIDGARD-0012]
  allowTag: true

quota:
  requestsCpu: "4"
  requestsMemory: 4Gi
  limitsCpu: "12"
  limitsMemory: 12Gi
  pods: "40"

# kind is a local throwaway: its Secrets (from deploy/kind/bootstrap-secrets.sh) hold
# throwaway keys in the kind node's etcd, which is not encrypted. A real cluster uses
# the csi or externalSecrets provider, or encrypts etcd before it sets this.
# [VLD-ANB-MIDGARD-0018]
secrets:
  provider: kubernetes
  acknowledgeEtcdEncryption: true
