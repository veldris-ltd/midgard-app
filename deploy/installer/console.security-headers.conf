# The console's security headers, included by console.nginx.conf in the server block
# and in every location that sets a header of its own: nginx drops a parent's
# add_header directives in a location that adds any, so each such location includes
# this file again. [RC-37] [NFR-SEC-1] [VLD-ANB-MIDGARD-0085]
#
# __INLINE_SCRIPTS__ and __GATEWAY_ORIGIN__ are replaced when the image is built
# (console.Dockerfile): the page's inline scripts by their SHA-256, and the origin of
# the gateway URL the console was built against. style-src keeps 'unsafe-inline'
# because the design system renders <style> elements for its keyframes; see
# docs/compliance/RESIDUAL_RISK_REGISTER.md.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __INLINE_SCRIPTS__; connect-src 'self' http://127.0.0.1:7710 http://localhost:7710 __GATEWAY_ORIGIN__; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
