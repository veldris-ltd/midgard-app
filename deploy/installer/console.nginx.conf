# The Midgard console's static server: one origin, no third parties, and the browser
# may talk only to this site and the gateway edge. [RC-37] [NFR-SEC-1]
#
# Every response carries the same security headers, from one shared file: the
# /assets/ location sets its own Cache-Control, and nginx would otherwise drop the
# server block's headers there. [VLD-ANB-MIDGARD-0085]
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/console.security-headers.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/console.security-headers.conf;
    }
}
