<!-- @dsCard group="Components" viewport="700x340" name="Core · Buttons, Badges, Tags, Status" subtitle="Actions & inline state" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-page)}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase;width:100%;margin:6px 0 2px}
</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel">
const NS = window.__mgNS();

const { Button, IconButton, Badge, Tag, StatusPill, Icon } = NS;
function Demo(){
  return (<>
    <div className="cap">Button · variants</div>
    <div className="row">
      <Button variant="primary" iconRight={<Icon name="arrow-right" size={15}/>}>Deploy release</Button>
      <Button variant="secondary">Secondary</Button>
      <Button variant="outline">Outline</Button>
      <Button variant="ghost">Ghost</Button>
      <Button variant="primary" disabled>Disabled</Button>
    </div>
    <div className="cap">Sizes + IconButton</div>
    <div className="row">
      <Button size="sm" variant="secondary">Small</Button>
      <Button size="md" variant="secondary">Medium</Button>
      <Button size="lg" variant="secondary">Large</Button>
      <IconButton label="Settings" variant="solid"><Icon name="settings" size={17}/></IconButton>
      <IconButton label="Terminal" variant="solid" active><Icon name="terminal" size={17}/></IconButton>
      <IconButton label="Alerts"><Icon name="bell" size={17}/></IconButton>
    </div>
    <div className="cap">Badge / Tag / StatusPill</div>
    <div className="row">
      <Badge tone="accent">GA</Badge>
      <Badge tone="secure">SEALED</Badge>
      <Badge tone="warn">CANARY</Badge>
      <Badge>v1.0.0</Badge>
      <Tag active>pipeline:prod</Tag>
      <Tag>air-gap</Tag>
      <Tag onRemove={()=>{}}>marking:C</Tag>
      <StatusPill status="secure" label="PQ-SEALED"/>
      <StatusPill status="gated"/>
      <StatusPill status="danger" label="Rollback"/>
    </div>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
