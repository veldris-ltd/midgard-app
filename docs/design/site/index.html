<!-- @dsCard group="Marketing Site" viewport="1440x900" subtitle="midgard.eu · suite home with early-access signup" name="midgard.eu" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Midgard · The sovereign enclosure</title>
<link rel="stylesheet" href="../styles.css">
<script src="../docs/mode.js"></script>
<style>body{margin:0}</style></head>
<body class="theme-midgard">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../ds-loader.js"></script>
<script src="fabric-bg.js"></script>
<script type="text/babel" src="site-shell.jsx"></script>
<script type="text/babel">
const { SiteShell, PRODUCTS, NS } = window.Site;
const { Icon, ProductMark, Button, Badge, StatusPill, SectionLabel, Terminal, StatBlock, Card } = NS;

function Hero() {
  return (
    <section className="mg-grid-bg" style={{ background: 'color-mix(in srgb, var(--bg-sunken) 55%, transparent)', padding: 'clamp(64px, 10vw, 140px) clamp(16px, 4vw, 36px) clamp(48px, 7vw, 96px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 26 }}>
          <StatusPill status="secure" label="PQ-SEALED · ML-KEM-1024" pulse={false} />
          <StatusPill status="online" label="AIR-GAP READY" pulse={false} />
          <Badge tone="accent">OPEN-SOURCE CORE</Badge>
        </div>
        <h1 style={{ fontSize: 'clamp(2.4rem, 6.5vw, 4.5rem)', lineHeight: 1.04, maxWidth: 820, fontWeight: 800 }}>
          Decisions, not just data.<br />
          <span style={{ color: 'var(--text-muted)' }}>Inside your own walls.</span>
        </h1>
        <p style={{ margin: '22px 0 0', fontSize: 'clamp(1rem, 1.6vw, 1.125rem)', color: 'var(--text-body)', maxWidth: 620, lineHeight: 1.7 }}>
          Midgard is a sovereign, open-source, post-quantum platform suite: one enclosure for your data, your models, and your operations. Four products, one trust boundary, zero outbound dependencies.
        </p>
        <div style={{ display: 'flex', gap: 12, marginTop: 32, flexWrap: 'wrap' }}>
          <a href="#early-access" style={{ textDecoration: 'none' }}><Button variant="primary" size="lg" iconRight={<Icon name="arrow-right" size={16} />}>Request early access</Button></a>
          <a href="#suite" style={{ textDecoration: 'none' }}><Button variant="outline" size="lg">Explore the suite ↓</Button></a>
        </div>
        <div style={{ display: 'flex', gap: 'clamp(24px, 5vw, 56px)', marginTop: 'clamp(40px, 6vw, 72px)', flexWrap: 'wrap' }}>
          <StatBlock value="0" label="OUTBOUND CALLS · CORE" />
          <StatBlock value="100%" label="PQ COVERAGE · FIPS 203/204/205" />
          <StatBlock value="99.9%" label="CONTROL-PLANE SLO" accent />
          <StatBlock value="7" label="CLIENT TARGETS · ONE CORE" />
        </div>
      </div>
    </section>
  );
}

function Suite() {
  const items = [
    { id: 'forge', icon: 'hammer', line: 'Ingest, transform, and version data like source control, then project it into the object fabric.', domain: 'forge.midgard.eu' },
    { id: 'mimir', icon: 'brain-circuit', line: 'Agentic AI served entirely in-enclosure. Grounded, cited, evaluated, and human-gated.', domain: 'mimir.midgard.eu' },
    { id: 'bifrost', icon: 'rocket', line: 'Zero-downtime delivery with PQ-signed artefacts, staged rings, and air-gap bundles.', domain: 'bifrost.midgard.eu' },
    { id: 'heimdall', icon: 'radar', line: 'Many feeds, one live picture. AI proposes options; your people authorise actions.', domain: 'heimdall.midgard.eu' },
  ];
  return (
    <section id="suite" style={{ padding: 'clamp(48px, 8vw, 96px) clamp(16px, 4vw, 36px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <SectionLabel number={1}>THE SUITE</SectionLabel>
        <h2 style={{ fontSize: 'clamp(1.7rem, 4vw, 2.6rem)', margin: '14px 0 32px', maxWidth: 640 }}>Four products. One enclosure.</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(270px, 100%), 1fr))', gap: 14 }}>
          {items.map(p => (
            <a key={p.id} href={p.id + '.html'} className={'theme-' + p.id} style={{ textDecoration: 'none' }}>
              <Card interactive accentRule size="lg" style={{ height: '100%' }}>
                <Icon name={p.icon} size={26} color="var(--accent)" />
                <div style={{ marginTop: 16 }}><ProductMark product={p.id} size="md" /></div>
                <p style={{ margin: '14px 0 18px', fontSize: 'var(--fs-sm)', color: 'var(--text-body)', lineHeight: 1.65 }}>{p.line}</p>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.08em', color: 'var(--accent-hover)' }}>{p.domain} →</span>
              </Card>
            </a>
          ))}
        </div>
        <p style={{ margin: '20px 0 0', fontFamily: 'var(--font-mono)', fontSize: 10.5, letterSpacing: '0.08em', color: 'var(--text-faint)' }}>EACH PRODUCT RUNS STANDALONE ATOP MIDGARD CORE · TOGETHER THEY COMPOUND</p>
      </div>
    </section>
  );
}

function Principles() {
  const rows = [
    ['lock', 'Post-quantum by default', 'Hybrid X25519 + ML-KEM-768 in transit. AES-256-GCM under ML-KEM-1024-wrapped keys at rest. ML-DSA signatures on everything that moves. Not an add-on: the substrate.'],
    ['eye-off', 'Sovereign by construction', 'No core function makes an outbound call. Self-host it, air-gap it, or run it on a ship. Your data and your models never leave your walls.'],
    ['brain-circuit', 'AI that answers to you', 'All inference is local. Every agent action is grounded in your data, cited to its evidence, scored against evaluation suites, and human-gated where it changes state.'],
    ['code', 'Open-source core', 'Reproducible builds, a CycloneDX SBOM with every release, and an OSI-approved licence. Trust you can rebuild from source, bit for bit.'],
  ];
  return (
    <section style={{ background: 'var(--bg-sunken)', borderTop: '1px solid var(--border)', borderBottom: '1px solid var(--border)', padding: 'clamp(48px, 8vw, 96px) clamp(16px, 4vw, 36px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <SectionLabel number={2}>WHY MIDGARD</SectionLabel>
        <h2 style={{ fontSize: 'clamp(1.7rem, 4vw, 2.6rem)', margin: '14px 0 32px', maxWidth: 720 }}>Built for the people who can't send their data to someone else's cloud.</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(280px, 100%), 1fr))', gap: 'clamp(20px, 3vw, 36px)' }}>
          {rows.map(([icon, title, body]) => (
            <div key={title}>
              <Icon name={icon} size={22} color="var(--accent)" />
              <h3 style={{ fontSize: 'var(--fs-h4)', margin: '12px 0 8px' }}>{title}</h3>
              <p style={{ margin: 0, fontSize: 'var(--fs-sm)', color: 'var(--text-muted)', lineHeight: 1.7 }}>{body}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Proof() {
  return (
    <section style={{ padding: 'clamp(48px, 8vw, 96px) clamp(16px, 4vw, 36px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', gap: 'clamp(24px, 4vw, 48px)', flexWrap: 'wrap', alignItems: 'center' }}>
        <div style={{ flex: '1 1 320px' }}>
          <SectionLabel number={3}>THE ENCLOSURE</SectionLabel>
          <h2 style={{ fontSize: 'clamp(1.7rem, 4vw, 2.6rem)', margin: '14px 0 12px' }}>Nothing leaves Midgard.</h2>
          <p style={{ margin: 0, fontSize: 'var(--fs-body)', color: 'var(--text-muted)', lineHeight: 1.7, maxWidth: 480 }}>
            Identity, object fabric, storage, compute, governance, and cryptography live inside one defended boundary. Every read, write, and agent action lands in an append-only, PQ-signed lineage, so audit is a query, not an archaeology project.
          </p>
        </div>
        <Terminal title="ENCLOSURE" style={{ flex: '1 1 360px' }} lines={[
          '> midgard status --enclosure',
          'identity     OK · self-contained IdP',
          'fabric       OK · 312 object types',
          'kms          OK · ML-KEM-1024 · agility armed',
          'governance   OK · lineage signed 100%',
          'egress       DENIED BY DEFAULT',
          '# sovereign · air-gapped · yours',
        ]} />
      </div>
    </section>
  );
}

function App() {
  return (
    <SiteShell active="midgard">
      <Hero />
      <Suite />
      <Principles />
      <Proof />
    </SiteShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
