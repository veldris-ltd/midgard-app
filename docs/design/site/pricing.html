<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Midgard · Licence</title>
<link rel="stylesheet" href="../styles.css">
<script src="../docs/mode.js"></script>
<style>body{margin:0}</style></head>
<body class="theme-midgard">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../ds-loader.js"></script>
<script src="fabric-bg.js"></script>
<script type="text/babel" src="site-shell.jsx"></script>
<script type="text/babel">
const { SiteShell, NS } = window.Site;
const { Icon, Button, Badge, SectionLabel, Card } = NS;

const COVERS = [
  'The source of every subsystem: Midgard core, Forge, Mimir, Bifrost, Heimdall, the admin and client crates',
  'The specification: the Solutions Architecture Documents and their diagrams',
  'The design system and the console UIs',
  'The release tooling, the acceptance gate and its recorded runs',
];
const LICENCE_URL = 'https://github.com/veldris-ltd/midgard-app/blob/main/LICENSE';

function App() {
  return (
    <SiteShell active="midgard">
      <section className="mg-grid-bg" style={{ background: 'color-mix(in srgb, var(--bg-sunken) 55%, transparent)', padding: 'clamp(60px, 9vw, 110px) clamp(16px, 4vw, 36px) clamp(40px, 6vw, 72px)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <div className="mg-label" style={{ marginBottom: 14 }}>01 // LICENCE</div>
          <h1 style={{ fontSize: 'clamp(2.2rem, 5.5vw, 3.6rem)', lineHeight: 1.06, maxWidth: 760, fontWeight: 800 }}>
            Open source.<br /><span style={{ color: 'var(--text-muted)' }}>Apache-2.0.</span>
          </h1>
          <p style={{ margin: '20px 0 0', fontSize: 'var(--fs-body-lg)', color: 'var(--text-body)', maxWidth: 620, lineHeight: 1.7 }}>
            Midgard is published under the Apache License, Version 2.0. Read it, build it, run it and change it under that licence. The LICENSE file in the repository is authoritative.
          </p>
        </div>
      </section>
      <section style={{ padding: 'clamp(40px, 6vw, 80px) clamp(16px, 4vw, 36px)' }}>
        <div style={{ maxWidth: 720, margin: '0 auto' }}>
          <Card size="lg" accentRule style={{ display: 'flex', flexDirection: 'column' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <h2 style={{ fontSize: 'var(--fs-h4)' }}>What the repository holds</h2>
              <span style={{ marginLeft: 'auto' }}><Badge tone="accent">APACHE-2.0</Badge></span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 0, margin: '16px 0 20px' }}>
              {COVERS.map(it => (
                <div key={it} style={{ display: 'flex', gap: 9, alignItems: 'flex-start', padding: '7px 0', borderBottom: '1px solid var(--divider)', fontSize: 'var(--fs-xs)', color: 'var(--text-body)', lineHeight: 1.5 }}>
                  <Icon name="check" size={13} color="var(--secure)" style={{ marginTop: 2 }} />{it}
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
              <a href={LICENCE_URL} style={{ textDecoration: 'none' }}><Button variant="primary">Read the licence</Button></a>
              <a href="github.html" style={{ textDecoration: 'none' }}><Button variant="ghost">Get the source</Button></a>
            </div>
          </Card>
        </div>
        <p style={{ maxWidth: 720, margin: '18px auto 0', fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.08em', color: 'var(--text-faint)' }}>
          VENDORED THIRD-PARTY CRATES KEEP THEIR OWN LICENCES · THE CLAIMS LEDGER SAYS WHAT EACH CAPABILITY DOES TODAY
        </p>
      </section>
      <section style={{ background: 'var(--bg-sunken)', borderTop: '1px solid var(--border)', padding: 'clamp(40px, 6vw, 80px) clamp(16px, 4vw, 36px)' }}>
        <div style={{ maxWidth: 880, margin: '0 auto' }}>
          <SectionLabel number={2}>STRAIGHT ANSWERS</SectionLabel>
          <h2 style={{ fontSize: 'clamp(1.5rem, 3.4vw, 2.2rem)', margin: '14px 0 24px' }}>Questions we'd ask too.</h2>
          {[
            ['Is it actually usable, or a demo?', 'Usable, within stated limits. Five services run today: the edge and object fabric, Mimir inference, the Bifrost fleet manager, the Heimdall feed gateway and the Forge worker. Most other subsystems are tested libraries. The claims ledger in the repository gives the status of every capability.'],
            ['Can we audit what we run?', 'Yes, bit for bit. Every release artefact is built twice and proven bit-identical, and ships with a CycloneDX SBOM and an ML-DSA signature. No release has been published yet; the first will be v0.1.0-rc.1, a release candidate. If your rebuild differs, that is a finding; open an issue.'],
            ['Does any of it call out of our network?', 'No core function makes an outbound call, telemetry stays inside the enclosure, and an air-gapped estate takes releases as a signed offline bundle.'],
          ].map(([q, a]) => (
            <div key={q} style={{ padding: '16px 0', borderBottom: '1px solid var(--divider)' }}>
              <h3 style={{ fontSize: 'var(--fs-body)', margin: '0 0 6px' }}>{q}</h3>
              <p style={{ margin: 0, fontSize: 'var(--fs-sm)', color: 'var(--text-muted)', lineHeight: 1.7 }}>{a}</p>
            </div>
          ))}
        </div>
      </section>
    </SiteShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
