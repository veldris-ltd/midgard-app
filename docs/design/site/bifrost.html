<!-- @dsCard group="Marketing Site" viewport="1440x900" subtitle="bifrost.midgard.eu · product page with early-access signup" name="bifrost.midgard.eu" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Bifrost · Continuous delivery for the enclosure</title>
<link rel="stylesheet" href="../styles.css">
<script src="../docs/mode.js"></script>
<style>body{margin:0}</style></head>
<body class="theme-bifrost">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../ds-loader.js"></script>
<script src="fabric-bg.js"></script>
<script type="text/babel" src="site-shell.jsx"></script>
<script type="text/babel">
const { SiteShell, NS } = window.Site;
const { Icon, ProductMark, Button, Badge, StatusPill, SectionLabel, Terminal, StatBlock, Card, Tag } = NS;

function Hero({ eyebrow, headline, sub, seals, stats }) {
  return (
    <section className="mg-grid-bg" style={{ background: 'color-mix(in srgb, var(--bg-sunken) 55%, transparent)', padding: 'clamp(64px, 9vw, 120px) clamp(16px, 4vw, 36px) clamp(44px, 6vw, 84px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 24 }}>{seals}</div>
        <div className="mg-label" style={{ marginBottom: 14 }}>{eyebrow}</div>
        <h1 style={{ fontSize: 'clamp(2.2rem, 5.5vw, 3.8rem)', lineHeight: 1.06, maxWidth: 780, fontWeight: 800 }}>{headline}</h1>
        <p style={{ margin: '20px 0 0', fontSize: 'clamp(1rem, 1.6vw, 1.125rem)', color: 'var(--text-body)', maxWidth: 600, lineHeight: 1.7 }}>{sub}</p>
        <div style={{ display: 'flex', gap: 12, marginTop: 30, flexWrap: 'wrap' }}>
          <a href="#early-access" style={{ textDecoration: 'none' }}><Button variant="primary" size="lg" iconRight={<Icon name="arrow-right" size={16} />}>Request early access</Button></a>
          <a href="index.html" style={{ textDecoration: 'none' }}><Button variant="ghost" size="lg">The full suite →</Button></a>
        </div>
        <div style={{ display: 'flex', gap: 'clamp(24px, 5vw, 56px)', marginTop: 'clamp(36px, 5vw, 64px)', flexWrap: 'wrap' }}>{stats}</div>
      </div>
    </section>
  );
}

function Capabilities({ num, title, items }) {
  return (
    <section style={{ padding: 'clamp(44px, 7vw, 88px) clamp(16px, 4vw, 36px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto' }}>
        <SectionLabel number={num}>CAPABILITIES</SectionLabel>
        <h2 style={{ fontSize: 'clamp(1.6rem, 3.6vw, 2.4rem)', margin: '14px 0 30px', maxWidth: 680 }}>{title}</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(min(280px, 100%), 1fr))', gap: 14 }}>
          {items.map(([icon, t, d]) => (
            <Card key={t} size="md">
              <Icon name={icon} size={20} color="var(--accent)" />
              <h3 style={{ fontSize: 'var(--fs-body)', margin: '12px 0 7px' }}>{t}</h3>
              <p style={{ margin: 0, fontSize: 'var(--fs-sm)', color: 'var(--text-muted)', lineHeight: 1.65 }}>{d}</p>
            </Card>
          ))}
        </div>
      </div>
    </section>
  );
}

function Showcase({ num, title, body, terminal, reverse }) {
  return (
    <section style={{ background: 'var(--bg-sunken)', borderTop: '1px solid var(--border)', borderBottom: '1px solid var(--border)', padding: 'clamp(44px, 7vw, 88px) clamp(16px, 4vw, 36px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', gap: 'clamp(24px, 4vw, 48px)', flexWrap: 'wrap', alignItems: 'center', flexDirection: reverse ? 'row-reverse' : 'row' }}>
        <div style={{ flex: '1 1 320px' }}>
          <SectionLabel number={num}>IN PRACTICE</SectionLabel>
          <h2 style={{ fontSize: 'clamp(1.6rem, 3.6vw, 2.4rem)', margin: '14px 0 12px', maxWidth: 480 }}>{title}</h2>
          <p style={{ margin: 0, fontSize: 'var(--fs-body)', color: 'var(--text-muted)', lineHeight: 1.7, maxWidth: 480 }}>{body}</p>
        </div>
        {terminal}
      </div>
    </section>
  );
}

function Standalone({ num, line }) {
  return (
    <section style={{ padding: 'clamp(36px, 6vw, 72px) clamp(16px, 4vw, 36px)' }}>
      <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', gap: 16, flexWrap: 'wrap', alignItems: 'center' }}>
        <SectionLabel number={num} muted>COMPOSABLE</SectionLabel>
        <p style={{ margin: 0, fontSize: 'var(--fs-body)', color: 'var(--text-body)', flex: '1 1 400px', lineHeight: 1.65 }}>{line}</p>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.1em', color: 'var(--text-faint)' }}>MIDGARD CORE REQUIRED · EVERYTHING ELSE OPTIONAL</span>
      </div>
    </section>
  );
}


function App() {
  return (
    <SiteShell active="bifrost">
      <Hero
        eyebrow="01 // BIFROST · CONTINUOUS DELIVERY"
        headline={<>Ship without downtime.<br /><span style={{ color: 'var(--text-muted)' }}>Even where the internet can't reach.</span></>}
        sub="Bifrost orchestrates zero-downtime rolling upgrades across your fleet: PQ-signed artefacts, staged rings with health gates, automatic rollback, and signed offline bundles for the sites that never connect."
        seals={<><StatusPill status="secure" label="ARTEFACTS ML-DSA ✓" pulse={false} /><Badge tone="accent">AIR-GAP NATIVE</Badge></>}
        stats={<><StatBlock value="0" label="FAILED REQUESTS · ROLLOUT" accent /><StatBlock value="41s" label="ROLLBACK TO HEALTHY" /><StatBlock value="100%" label="RELEASES SIGNED + SBOM" /></>}
      />
      <Capabilities num={2} title="Trust is verified before anything deploys."
        items={[
          ['package', 'Signed artefact registry', 'Reproducible builds, CycloneDX SBOMs, and ML-DSA signatures, verified on ingest and again before every deploy.'],
          ['rings', 'Staged ring rollouts', 'Canary to broad, with health gates between rings. A bad release never reaches the whole fleet.'],
          ['undo-2', 'Rollback as a rehearsed path', 'Standing rollback plans staged with every promotion, drilled on schedule, triggered automatically on gate failure.'],
          ['git-branch', 'Declarative channels', 'Stable, beta, canary: fleet state is declared, reconciled, and drift-alerted.'],
          ['download', 'Offline bundles', 'Signed release bundles travel by courier to air-gapped sites, verify offline, and return signed receipts.'],
          ['sparkles', 'Release intelligence', 'Mimir scores release risk and spots anomalies locally. Advisory by default, gating when you say so.'],
        ]} />
      <Showcase num={3} title="Fail closed, roll forward."
        body="No signature, no deploy. A tampered artefact is rejected before it moves; a failing health gate reverses the rollout automatically, with zero downtime either way."
        terminal={<Terminal title="PROMOTION" style={{ flex: '1 1 360px' }} lines={[
          '> bifrost promote midgard-suite:2.5.0',
          'verify     reproducible ✓ · SBOM ✓ · ML-DSA ✓',
          'ring 0     canary 4/4 · gates green',
          'ring 1     staging 12/12 · gates green',
          'ring 2     prod-eu 48/48 · p99 OK',
          'ring 3     air-gap · bundle B-2050-07A cut',
          '# zero downtime · rollback staged throughout',
        ]} />}
      />
      <Standalone num={4} line="Midgard + Bifrost delivers continuous deployment for the platform itself. It is also how everything else arrives: Forge, Mimir, Heimdall, and every client build ship through Bifrost." />
    </SiteShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
