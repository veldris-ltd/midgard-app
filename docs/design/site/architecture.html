<!-- @dsCard group="Marketing Site" viewport="1440x900" subtitle="Public architecture overview: enclosure, fabric, PQ substrate" name="midgard.eu/architecture" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Midgard · Architecture</title>
<link rel="stylesheet" href="../styles.css">
<script src="../docs/mode.js"></script>
<style>body{margin:0}</style></head>
<body class="theme-midgard">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../ds-loader.js"></script>
<script src="fabric-bg.js"></script>
<script type="text/babel" src="site-shell.jsx"></script>
<script type="text/babel">
const { SiteShell, NS } = window.Site;
const { Icon, ProductMark, Button, Badge, StatusPill, SectionLabel, Terminal, StatBlock, Card, Tag, Table } = NS;

function Layer({ n, title, desc, items, accent }) {
  return (
    <div style={{ display: 'flex', gap: 'clamp(12px, 2vw, 24px)', alignItems: 'flex-start' }}>
      <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 'clamp(20px, 3vw, 28px)', color: 'var(--text-faint)', width: 44, flex: 'none', lineHeight: 1.2 }}>{String(n).padStart(2, '0')}</span>
      <div style={{ flex: 1, borderLeft: '2px solid ' + (accent ? 'var(--accent)' : 'var(--border-strong)'), paddingLeft: 'clamp(14px, 2.5vw, 24px)', paddingBottom: 'clamp(24px, 4vw, 40px)' }}>
        <h3 style={{ fontSize: 'var(--fs-h4)', margin: '0 0 6px' }}>{title}</h3>
        <p style={{ margin: '0 0 12px', fontSize: 'var(--fs-sm)', color: 'var(--text-muted)', lineHeight: 1.7, maxWidth: 560 }}>{desc}</p>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {items.map(i => <Tag key={i}>{i}</Tag>)}
        </div>
      </div>
    </div>
  );
}
function App() {
  return (
    <SiteShell active="midgard">
      <section className="mg-grid-bg" style={{ background: 'color-mix(in srgb, var(--bg-sunken) 55%, transparent)', padding: 'clamp(60px, 9vw, 110px) clamp(16px, 4vw, 36px) clamp(40px, 6vw, 72px)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto' }}>
          <div className="mg-label" style={{ marginBottom: 14 }}>01 // ARCHITECTURE</div>
          <h1 style={{ fontSize: 'clamp(2.2rem, 5.5vw, 3.6rem)', lineHeight: 1.06, maxWidth: 800, fontWeight: 800 }}>
            The enclosure, layer by layer.
          </h1>
          <p style={{ margin: '20px 0 0', fontSize: 'var(--fs-body-lg)', color: 'var(--text-body)', maxWidth: 640, lineHeight: 1.7 }}>
            One defended trust boundary. Everything your operations need lives inside it; nothing it needs lives outside it. This page is the public summary; early-access partners receive the full Solutions Architecture Documents.
          </p>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginTop: 24 }}>
            <Badge tone="accent">ARC42 + TOGAF STRUCTURED</Badge>
            <Badge>NIST SP 800-53 · OWASP ASVS · ISO 27001 ALIGNED</Badge>
          </div>
        </div>
      </section>
      <section style={{ padding: 'clamp(44px, 7vw, 88px) clamp(16px, 4vw, 36px)' }}>
        <div style={{ maxWidth: 1000, margin: '0 auto' }}>
          <Layer n={1} title="Post-quantum substrate" accent
            desc="Cryptography is a platform property, inherited by every product. Hybrid key agreement in transit, wrapped keys at rest, lattice signatures on every artefact and every audit record, with algorithm agility so tomorrow's standards swap in without a data migration."
            items={['X25519 + ML-KEM-768', 'AES-256-GCM · ML-KEM-1024 wrap', 'ML-DSA / SLH-DSA', 'HSM/TPM sealing', 'hot-swap agility']} />
          <Layer n={2} title="Identity & zero trust"
            desc="A self-contained identity provider that works air-gapped, with optional federation. Every request, whether human, service, or agent, is authenticated and authorised on identity, device posture, and declared purpose. Deny is the default."
            items={['self-contained OIDC', 'WebAuthn / passkeys', 'PQ-signed tokens', 'purpose-bound sessions']} />
          <Layer n={3} title="The object fabric" accent
            desc="Your organisation as typed objects, links, and actions: semantics and kinetics in one layer. Policy is evaluated at query time, per row and per marking, and every mutation flows through a validated, audited action."
            items={['object + link types', 'actions & functions', 'search-around', 'marking-aware queries', 'incremental indexing']} />
          <Layer n={4} title="Governance & lineage"
            desc="Role, marking, and purpose access control enforced at the data layer, with an append-only, PQ-signed audit lineage of every read, write, and agent step. Audit is a query, not a project."
            items={['policy point', 'append-only ledger', 'ML-DSA-signed lineage', 'retention by marking']} />
          <Layer n={5} title="The products" accent
            desc="Forge, Mimir, Bifrost, and Heimdall each depend only on the core's contracts; every one runs standalone, and inter-product capabilities are discovered at runtime. Losing one degrades gracefully; it never cascades."
            items={['Forge · data ops', 'Mimir · local AI', 'Bifrost · delivery', 'Heimdall · fusion', 'contract-based composition']} />
          <Layer n={6} title="Clients & administration"
            desc="Seven client targets share one Rust core for crypto, sync, and storage, offline-first with conflict-free merge. A separate, self-governed admin panel composes every subsystem under dual-control and break-glass discipline."
            items={['one Rust core · 7 targets', 'offline-first CRDT', 'admin dual-control', 'no super-admin']} />
        </div>
      </section>
      <section style={{ background: 'var(--bg-sunken)', borderTop: '1px solid var(--border)', padding: 'clamp(44px, 7vw, 88px) clamp(16px, 4vw, 36px)' }}>
        <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', gap: 'clamp(24px, 4vw, 48px)', flexWrap: 'wrap', alignItems: 'center' }}>
          <div style={{ flex: '1 1 320px' }}>
            <SectionLabel number={2}>DEPLOYMENT</SectionLabel>
            <h2 style={{ fontSize: 'clamp(1.6rem, 3.6vw, 2.4rem)', margin: '14px 0 12px' }}>From a laptop to a fleet of enclaves.</h2>
            <p style={{ margin: 0, fontSize: 'var(--fs-body)', color: 'var(--text-muted)', lineHeight: 1.7, maxWidth: 480 }}>
              Single-node for development, HA clusters for production, and fully air-gapped sites fed by signed offline bundles. The same releases, the same signatures, every topology.
            </p>
          </div>
          <Terminal title="TOPOLOGIES" style={{ flex: '1 1 360px' }} lines={[
            '> midgard deploy --list-profiles',
            'dev        1 node · self-signed trust root',
            'prod       HA cluster · HSM-sealed roots',
            'air-gap    HA · egress-deny · bundle import',
            'multi-site prod + PQ-encrypted replication',
            '# one build · four topologies · zero downtime',
          ]} />
        </div>
      </section>
    </SiteShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
