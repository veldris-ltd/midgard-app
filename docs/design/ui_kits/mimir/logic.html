<!-- @dsCard group="Mimir" viewport="1440x820" subtitle="No-code agent logic: triggers, steps, gates" name="Mimir · Logic Builder" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Mimir · Logic Builder</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-mimir">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;
const { Card, Table, StatBlock, StatusPill, Badge, Button, IconButton, Input, Select, Switch, Icon, SectionLabel, Terminal, ProvenanceTag, MarkingChip, Tag, Tabs } = NS;

const STEPS = [
  { n: 1, icon: 'zap', title: 'Trigger', body: 'MaintenanceEvent created with severity ≥ high', kind: 'trigger' },
  { n: 2, icon: 'boxes', title: 'Retrieve context', body: 'Aircraft history + open events (OAG, policy-scoped)', kind: 'retrieve' },
  { n: 3, icon: 'brain-circuit', title: 'Reason', body: 'Draft dispatch recommendation · Mistral Small 3.2 local', kind: 'infer' },
  { n: 4, icon: 'gauge', title: 'Check', body: 'Confidence ≥ 0.8 else escalate to analyst queue', kind: 'branch' },
  { n: 5, icon: 'zap', title: 'Propose action', body: 'Schedule maintenance (state mutation)', kind: 'action' },
  { n: 6, icon: 'user', title: 'Human gate', body: 'Ops analyst authorises or rejects', kind: 'gate' },
  { n: 7, icon: 'scroll-text', title: 'Record lineage', body: 'ML-DSA-signed decision record', kind: 'audit' },
];
function App() {
  const [sel, setSel] = React.useState(5);
  const s = STEPS[sel];
  const kindColor = { trigger: 'var(--info)', gate: 'var(--warn)', audit: 'var(--secure)' };
  return (
    <ConsoleShell product="mimir" active="logic" context="AGENT STUDIO / LOGIC · DISPATCH-01"
      toolbar={<>
        <Button variant="secondary" size="sm">Test run</Button>
        <Button variant="primary" size="sm" iconLeft={<Icon name="check" size={14} />}>Publish v7</Button>
      </>}
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name={s.icon} size={17} color={kindColor[s.kind] || 'var(--accent)'} />
          <h2 style={{ fontSize: 15, flex: 1 }}>Step {s.n} · {s.title}</h2>
        </div>
        <Card size="sm">
          <p style={{ margin: 0, fontSize: 'var(--fs-sm)', color: 'var(--text-body)', lineHeight: 1.6 }}>{s.body}</p>
        </Card>
        {s.kind === 'gate' && (
          <Card size="sm" style={{ borderColor: 'var(--warn)' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.12em', color: 'var(--warn)', marginBottom: 6 }}>MANDATORY STEP</div>
            <p style={{ margin: 0, fontSize: 'var(--fs-xs)', color: 'var(--text-body)', lineHeight: 1.55 }}>Logic containing a state-mutating action cannot publish without a human gate between proposal and execution. This step cannot be deleted.</p>
          </Card>
        )}
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>VERSIONS</div>
          {[['v7 · draft', 'editing now'], ['v6 · live', 'published 3d ago · evals 96%'], ['v5', 'retired']].map(([v, meta], i) => (
            <div key={v} style={{ display: 'flex', gap: 10, padding: '7px 0', borderBottom: '1px solid var(--divider)', fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-xs)' }}>
              <span style={{ color: i === 0 ? 'var(--accent-hover)' : 'var(--grey-100)', width: 76, flex: 'none' }}>{v}</span>
              <span style={{ color: 'var(--text-faint)' }}>{meta}</span>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 'auto' }}>
          <ProvenanceTag id="FR-MI-4" title="No-code (Logic) and pro-code builders for AI functions and agents" />
        </div>
      </>}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 24 }}>
        <div>
          <SectionLabel number={6}>LOGIC</SectionLabel>
          <h1 style={{ fontSize: 'var(--fs-h3)', marginTop: 6 }}>dispatch-01 · workflow v7</h1>
        </div>
        <div style={{ flex: 1 }} />
        <StatBlock value="7" label="STEPS" size="sm" />
        <StatBlock value="1" label="HUMAN GATES" size="sm" accent />
        <StatBlock value="96%" label="EVALS · V6 LIVE" size="sm" />
      </div>
      <div className="mg-grid-bg" style={{ flex: 1, background: 'var(--bg-sunken)', border: '1px solid var(--border)', borderRadius: 'var(--radius-md)', padding: 24, overflowY: 'auto' }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 0, maxWidth: 560 }}>
          {STEPS.map((st, i) => (
            <React.Fragment key={st.n}>
              <div onClick={() => setSel(i)} style={{
                display: 'flex', alignItems: 'center', gap: 12, padding: '12px 16px', cursor: 'pointer',
                background: i === sel ? 'var(--surface-raised)' : 'var(--surface-card)',
                border: '1px solid ' + (i === sel ? 'var(--accent)' : st.kind === 'gate' ? 'var(--warn)' : 'var(--border)'),
                borderRadius: 'var(--radius-md)',
                boxShadow: i === sel ? 'var(--shadow-glow)' : 'none',
              }}>
                <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 15, color: i === sel ? 'var(--accent-hover)' : 'var(--text-faint)', width: 22 }}>{String(st.n).padStart(2, '0')}</span>
                <Icon name={st.icon} size={16} color={st.kind === 'gate' ? 'var(--warn)' : st.kind === 'audit' ? 'var(--secure)' : 'var(--accent)'} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 'var(--fs-sm)', fontWeight: 600, color: 'var(--text-heading)' }}>{st.title}</div>
                  <div style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-muted)', marginTop: 2 }}>{st.body}</div>
                </div>
                {st.kind === 'gate' && <Badge tone="warn">MANDATORY</Badge>}
              </div>
              {i < STEPS.length - 1 && <div style={{ width: 2, height: 14, background: 'var(--border-strong)', marginLeft: 43 }} />}
            </React.Fragment>
          ))}
        </div>
      </div>
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
