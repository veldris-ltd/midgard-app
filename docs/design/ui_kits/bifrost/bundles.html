<!-- @dsCard group="Bifrost" viewport="1440x820" subtitle="Signed bundles for air-gapped sites: cut, export, verify, receipt" name="Bifrost · Offline Bundles" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Bifrost · Offline Bundles</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-bifrost">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;
const { Card, Table, StatBlock, StatusPill, Badge, Button, IconButton, Input, Select, Switch, Icon, SectionLabel, Terminal, ProvenanceTag, MarkingChip, Tag, Tabs } = NS;

const BUNDLES = [
  { id: 'B-2050-07A', release: '2.5.0', sites: 'site-north-ag +3', size: '42 GB', cut: 'today 09:12', status: 'awaiting courier', st: 'gated', stl: 'Ready' },
  { id: 'B-2050-06B', release: '2.4.1', sites: 'site-east-ag', size: '41 GB', cut: '12d ago', status: 'applied · receipt returned', st: 'secure', stl: 'Applied' },
  { id: 'B-2050-06A', release: '2.4.1', sites: 'site-north-ag +3', size: '41 GB', cut: '31d ago', status: 'applied · receipt returned', st: 'secure', stl: 'Applied' },
];
function App() {
  const [sel, setSel] = React.useState(0);
  const b = BUNDLES[sel];
  return (
    <ConsoleShell product="bifrost" active="bundles" context="DELIVERY / OFFLINE BUNDLES"
      toolbar={<Button variant="primary" size="sm" iconLeft={<Icon name="package" size={14} />}>Cut new bundle</Button>}
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="download" size={17} color="var(--accent)" />
          <h2 style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, fontSize: 14, flex: 1 }}>{b.id}</h2>
          <StatusPill status={b.st} pulse={false} label={b.stl} />
        </div>
        <Card size="sm">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <StatBlock value={b.release} label="RELEASE" size="sm" />
            <StatBlock value={b.size} label="SIZE" size="sm" />
          </div>
        </Card>
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>CONTENTS</div>
          {[['Platform artefacts', '14 images · signed'], ['Model weights', 'Mistral Small 3.2.1 · digest-pinned'], ['SBOMs', 'CycloneDX · every artefact'], ['Rollback set', 'previous version included']].map(([k, v]) => (
            <div key={k} style={{ display: 'flex', gap: 10, padding: '7px 0', borderBottom: '1px solid var(--divider)', fontSize: 'var(--fs-xs)' }}>
              <span style={{ fontFamily: 'var(--font-mono)', color: 'var(--text-faint)', width: 110, flex: 'none' }}>{k.toUpperCase()}</span>
              <span style={{ color: 'var(--text-body)' }}>{v}</span>
            </div>
          ))}
        </div>
        <Terminal title="OFFLINE VERIFICATION · AT SITE" lines={[
          '> bifrost bundle verify ' + b.id,
          'manifest   ML-DSA verified',
          'artefacts  14/14 digests OK',
          'weights    sha3 match · sig OK',
          '# apply permitted · rollback staged',
        ]} />
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 'auto' }}>
          <ProvenanceTag id="DD-7" title="Sovereignty: on-prem, self-hosted, air-gapped by design" /><ProvenanceTag id="FR-B-5" title="Signed offline bundles for air-gapped sites" />
          <ProvenanceTag id="AC-M-5" title="Full air-gap acceptance criterion" />
        </div>
      </>}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 24 }}>
        <div>
          <SectionLabel number={4}>AIR-GAP</SectionLabel>
          <h1 style={{ fontSize: 'var(--fs-h3)', marginTop: 6 }}>Offline bundles</h1>
        </div>
        <div style={{ flex: 1 }} />
        <StatBlock value="9" label="AIR-GAPPED SITES" size="sm" />
        <StatBlock value="100%" label="RECEIPTS RETURNED" size="sm" accent />
        <StatBlock value="1" label="AWAITING COURIER" size="sm" />
      </div>
      <div className="mg-grid-bg" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: 18, background: 'var(--bg-sunken)', border: '1px solid var(--border)', borderRadius: 'var(--radius-md)', overflowX: 'auto' }}>
        {[['package', 'Cut & sign'], ['download', 'Export media'], ['arrow-right', 'Courier'], ['shield-check', 'Verify offline'], ['rings', 'Apply · rolling'], ['upload', 'Receipt returns']].map(([ic, lb], i, arr) => (
          <React.Fragment key={lb}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '8px 12px', borderRadius: 6, background: 'var(--surface-card)', border: '1px solid ' + (i <= 1 && sel === 0 ? 'var(--accent)' : 'var(--border)'), whiteSpace: 'nowrap' }}>
              <Icon name={ic} size={13} color="var(--accent)" />
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-micro)', color: 'var(--grey-100)' }}>{lb}</span>
            </span>
            {i < arr.length - 1 && <Icon name="chevron-right" size={13} color="var(--text-faint)" />}
          </React.Fragment>
        ))}
      </div>
      <Table
        columns={[
          { header: 'Bundle', cell: r => <span style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-xs)', color: 'var(--accent-hover)' }}>{r.id}</span>, width: 120 },
          { header: 'Release', key: 'release', mono: true, width: 90 },
          { header: 'Target sites', key: 'sites', mono: true, width: 160 },
          { header: 'Size', key: 'size', mono: true, align: 'right', width: 80 },
          { header: 'Cut', key: 'cut', mono: true, width: 110 },
          { header: 'Status', key: 'status' },
          { header: 'State', cell: r => <StatusPill status={r.st} pulse={false} label={r.stl} />, width: 110 },
        ]}
        rows={BUNDLES} selectedIndex={sel} onRowClick={setSel}
      />
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
