<!-- @dsCard group="Forge" viewport="1440x820" subtitle="Mapping dataset columns to fabric objects, links, and markings" name="Forge · Object Projection" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Forge · Object Projection</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-forge">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;
const { Card, Table, StatBlock, StatusPill, Badge, Button, IconButton, Input, Select, Switch, Icon, SectionLabel, Terminal, ProvenanceTag, MarkingChip, Tag, Tabs } = NS;

const MAP = [
  { col: 'icao24', to: 'Aircraft.tail_id', kind: 'key', note: 'primary match' },
  { col: 'callsign', to: 'Aircraft.callsign', kind: 'property', note: 'trim + uppercase' },
  { col: 'operator_code', to: 'operates → Route', kind: 'link', note: 'via route registry' },
  { col: 'alt_ft, lat, lon', to: 'Aircraft.position', kind: 'struct', note: 'composite · 1Hz downsample' },
  { col: 'src_classification', to: 'marking', kind: 'governance', note: 'row-level marking' },
];
function App() {
  const [sel, setSel] = React.useState(4);
  const m = MAP[sel];
  return (
    <ConsoleShell product="forge" active="projection" context="DATA OPS / OBJECT PROJECTION"
      toolbar={<Button variant="primary" size="sm" iconLeft={<Icon name="boxes" size={14} />}>Sync now</Button>}
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="boxes" size={17} color="var(--accent)" />
          <h2 style={{ fontSize: 15, flex: 1 }}>Aircraft projection</h2>
          <StatusPill status="healthy" pulse={false} label="In sync" />
        </div>
        <Card size="sm">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <StatBlock value="12,408" label="OBJECTS" size="sm" />
            <StatBlock value="41s" label="SYNC LAG" size="sm" />
          </div>
        </Card>
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>SELECTED MAPPING</div>
          <Terminal lines={[m.col + '  →  ' + m.to, '# ' + m.note]} />
        </div>
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>GOVERNANCE CARRY-THROUGH</div>
          <p style={{ margin: 0, fontSize: 'var(--fs-xs)', color: 'var(--text-muted)', lineHeight: 1.6 }}>Row markings survive projection: a CONFIDENTIAL source row yields a CONFIDENTIAL object. Policy applies at query time in the fabric, not at copy time.</p>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 10 }}>
            <ProvenanceTag id="FR-F-4" title="Project curated datasets into Midgard object/link types via a mapping layer" />
            <ProvenanceTag id="NFR-SEC-2" title="Markings enforced at query time" />
          </div>
        </div>
        <Button variant="secondary" size="sm" style={{ marginTop: 'auto' }} iconLeft={<Icon name="arrow-up-right" size={14} />}>Open type in Midgard</Button>
      </>}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 24 }}>
        <div>
          <SectionLabel number={5}>PROJECTION</SectionLabel>
          <h1 style={{ fontSize: 'var(--fs-h3)', marginTop: 6 }}>flight_tracks_eu → Aircraft</h1>
        </div>
        <div style={{ flex: 1 }} />
        <StatBlock value="18/18" label="COLUMNS MAPPED" size="sm" accent />
        <StatBlock value="2" label="LINK TYPES" size="sm" />
        <StatBlock value="0" label="UNMARKED ROWS" size="sm" />
      </div>
      <div className="mg-grid-bg" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: 18, background: 'var(--bg-sunken)', border: '1px solid var(--border)', borderRadius: 'var(--radius-md)' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '9px 13px', borderRadius: 8, background: 'var(--surface-card)', border: '1px solid var(--border)' }}>
          <Icon name="table" size={15} color="var(--accent)" />
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-xs)', color: 'var(--grey-100)' }}>flight_tracks_eu · v42</span>
        </span>
        <Icon name="chevron-right" size={15} color="var(--text-faint)" />
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, color: 'var(--text-faint)', letterSpacing: '0.1em' }}>MAPPING · 18 RULES</span>
        <Icon name="chevron-right" size={15} color="var(--text-faint)" />
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '9px 13px', borderRadius: 8, background: 'var(--surface-card)', border: '1px solid var(--accent)' }}>
          <Icon name="boxes" size={15} color="var(--accent)" />
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-xs)', color: 'var(--grey-100)' }}>Aircraft · object fabric</span>
        </span>
        <span style={{ marginLeft: 'auto' }}><MarkingChip level="confidential" compartment="OPS-N" /></span>
      </div>
      <Table
        columns={[
          { header: 'Source column(s)', key: 'col', mono: true },
          { header: 'Maps to', key: 'to', mono: true },
          { header: 'Kind', cell: r => <Badge tone={r.kind === 'governance' ? 'warn' : r.kind === 'link' ? 'accent' : 'neutral'}>{r.kind.toUpperCase()}</Badge>, width: 130 },
          { header: 'Transform', key: 'note', width: 220 },
        ]}
        rows={MAP} selectedIndex={sel} onRowClick={setSel}
      />
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
