<!-- @dsCard group="Forge" viewport="1440x820" subtitle="Versioned datasets: branches, diffs, seals, lineage" name="Forge · Dataset Browser" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Forge · Dataset Browser</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-forge">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;
const { Card, Table, StatBlock, StatusPill, Badge, Button, IconButton, Input, Select, Switch, Icon, SectionLabel, Terminal, ProvenanceTag, MarkingChip, Tag, Tabs } = NS;

const DS = [
  { name: 'flight_tracks_eu', ver: 'v42', branch: 'main', rows: '4.2M', schema: 18, marking: 'confidential', st: 'secure', stl: 'Sealed' },
  { name: 'sensor_feed_north', ver: 'v12', branch: 'main', rows: '96M', schema: 21, marking: 'restricted', st: 'healthy', stl: 'Healthy' },
  { name: 'maintenance_events', ver: 'v8', branch: 'dev/fuse-fix', rows: '48k', schema: 12, marking: 'internal', st: 'warn', stl: 'Ahead of main' },
  { name: 'crew_roster', ver: 'v31', branch: 'main', rows: '3,051', schema: 17, marking: 'internal', st: 'secure', stl: 'Sealed' },
];
function App() {
  const [sel, setSel] = React.useState(0);
  const [tab, setTab] = React.useState(0);
  const d = DS[sel];
  return (
    <ConsoleShell product="forge" active="datasets" context="DATA OPS / DATASETS"
      toolbar={<Button variant="secondary" size="sm" iconLeft={<Icon name="git-branch" size={14} />}>New branch</Button>}
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="table" size={17} color="var(--accent)" />
          <h2 style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, fontSize: 14, flex: 1 }}>{d.name}</h2>
          <MarkingChip level={d.marking} />
        </div>
        <Card size="sm">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <StatBlock value={d.ver} label={'BRANCH · ' + d.branch.toUpperCase()} size="sm" />
            <StatBlock value={d.rows} label="ROWS" size="sm" />
          </div>
        </Card>
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>VERSION DIFF · {d.ver} ← v{parseInt(d.ver.slice(1)) - 1}</div>
          {[['+ 12,406 rows', 'var(--secure)'], ['− 88 rows (dedup)', 'var(--danger)'], ['~ column alt_ft: bounds filter added', 'var(--warn)']].map(([l, c], i) => (
            <div key={i} style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-xs)', color: c, padding: '5px 0', borderBottom: '1px solid var(--divider)' }}>{l}</div>
          ))}
        </div>
        <Terminal title="SEAL" lines={['> forge seal status ' + d.name, 'dek     fabric-dek-ring-a', 'wrap    ML-KEM-1024 · root-03', 'addr    content-hash sha3:22f1…9e04', 'sig     ML-DSA · lineage OK', '# sealed · rebuild reproducible']} />
        <div style={{ display: 'flex', gap: 8, marginTop: 'auto' }}>
          <Button variant="secondary" size="sm" fullWidth>Time travel</Button>
          <Button variant="primary" size="sm" fullWidth iconRight={<Icon name="arrow-right" size={14} />}>Open in builder</Button>
        </div>
      </>}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 24 }}>
        <div>
          <SectionLabel number={2}>DATASETS</SectionLabel>
          <h1 style={{ fontSize: 'var(--fs-h3)', marginTop: 6 }}>Dataset browser</h1>
        </div>
        <div style={{ flex: 1 }} />
        <StatBlock value="412" label="DATASETS" size="sm" />
        <StatBlock value="100%" label="SEALED AT REST" size="sm" accent />
        <StatBlock value="31" label="OPEN BRANCHES" size="sm" />
      </div>
      <Tabs tabs={[{ label: 'All datasets', badge: '412' }, { label: 'My branches', badge: '3' }, { label: 'Pending merges', badge: '1' }]} active={tab} onChange={setTab} />
      <Table
        columns={[
          { header: 'Dataset', cell: r => <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="table" size={14} color="var(--accent)" />{r.name}</span> },
          { header: 'Version', key: 'ver', mono: true, width: 80 },
          { header: 'Branch', key: 'branch', mono: true, width: 130 },
          { header: 'Rows', key: 'rows', mono: true, align: 'right', width: 90 },
          { header: 'Columns', key: 'schema', mono: true, align: 'right', width: 80 },
          { header: 'Marking', cell: r => <MarkingChip level={r.marking} />, width: 150 },
          { header: 'State', cell: r => <StatusPill status={r.st} pulse={false} label={r.stl} />, width: 140 },
        ]}
        rows={DS} selectedIndex={sel} onRowClick={setSel}
      />
      <div>
        <SectionLabel number={3} muted>LINEAGE · {DS[sel].name}</SectionLabel>
        <div className="mg-grid-bg" style={{ display: 'flex', alignItems: 'center', gap: 8, padding: 16, marginTop: 8, background: 'var(--bg-sunken)', border: '1px solid var(--border)', borderRadius: 'var(--radius-md)', overflowX: 'auto' }}>
          {[['database', 'flights_jdbc'], ['workflow', 'clean_flights'], ['table', DS[sel].name + ' ' + DS[sel].ver], ['boxes', 'Aircraft objects']].map(([ic, lb], i, arr) => (
            <React.Fragment key={lb}>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '7px 11px', borderRadius: 6, background: 'var(--surface-card)', border: '1px solid ' + (i === 2 ? 'var(--accent)' : 'var(--border)'), whiteSpace: 'nowrap' }}>
                <Icon name={ic} size={13} color="var(--accent)" />
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-micro)', color: 'var(--grey-100)' }}>{lb}</span>
              </span>
              {i < arr.length - 1 && <Icon name="chevron-right" size={13} color="var(--text-faint)" />}
            </React.Fragment>
          ))}
        </div>
      </div>
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
