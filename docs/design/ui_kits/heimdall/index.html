<!-- @dsCard group="Heimdall" viewport="1440x820" subtitle="Operational fusion: common picture, entity tracking, human-gated decisions" name="Heimdall · Common Operating Picture" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Heimdall · Common Operating Picture</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-heimdall">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;

const { Card, StatusPill, Badge, Button, IconButton, Icon, SectionLabel, StatBlock, Switch, MarkingChip, ProvenanceTag } = NS;

const ENTITIES = [
  { id: 'E-2214', cls: 'AIRCRAFT', conf: 0.97, x: 22, y: 30, layer: 'air', track: 'stable', hdg: 78, spd: 460, alt: 'FL340', feeds: 4 },
  { id: 'E-2231', cls: 'AIRCRAFT', conf: 0.91, x: 38, y: 18, layer: 'air', track: 'stable', hdg: 132, spd: 430, alt: 'FL360', feeds: 3 },
  { id: 'E-0442', cls: 'VESSEL', conf: 0.88, x: 62, y: 66, layer: 'maritime', track: 'stable', hdg: 221, spd: 14, alt: 'SURFACE', feeds: 2 },
  { id: 'E-0871', cls: 'UNKNOWN', conf: 0.54, x: 74, y: 34, layer: 'air', track: 'anomalous', hdg: 197, spd: 388, alt: 'FL212 ↓', feeds: 2 },
  { id: 'E-1108', cls: 'GROUND UNIT', conf: 0.93, x: 45, y: 74, layer: 'ground', track: 'stable', hdg: 12, spd: 3, alt: 'GND', feeds: 3 },
];
const CAPABILITY = { AIRCRAFT: 'IFF · ADS-B · RADAR', VESSEL: 'AIS · RADAR', 'GROUND UNIT': 'OBSERVER NET', UNKNOWN: 'RADAR ONLY · UNCORROBORATED' };

const OPTIONS = [
  { rank: 1, title: 'Re-task sensor feed NORTH-2 to track E-0871', why: 'Highest expected classification gain (+0.31 confidence) within 12 min.', cites: ['SensorFeed/NORTH-2', 'Entity/E-0871'] },
  { rank: 2, title: 'Cross-cue maritime radar sweep', why: 'Covers ambiguity if E-0871 descends below FL100.', cites: ['Feed/MAR-RAD-1'] },
  { rank: 3, title: 'Hold, continue passive fusion', why: 'No kinetic urgency; anomaly may resolve within current track window.', cites: ['Track/E-0871·history'] },
];

function App() {
  const [layers, setLayers] = React.useState({ air: true, maritime: true, ground: true, feeds: false });
  const [sel, setSel] = React.useState('E-0871');
  const [authorised, setAuthorised] = React.useState(false);
  const [chosen, setChosen] = React.useState(1);
  const [hover, setHover] = React.useState(null);
  const e = ENTITIES.find(x => x.id === sel);
  const visible = ENTITIES.filter(en => layers[en.layer] !== false);

  return (
    <ConsoleShell product="heimdall" active="cop" context="COMMON OPERATING PICTURE / SECTOR NORTH" asideWidth={360}
      mainStyle={{ padding: 0, gap: 0, position: 'relative' }}
      toolbar={<>
        <IconButton label="Alerts" active><Icon name="bell" size={17} /></IconButton>
        <IconButton label="Settings"><Icon name="settings" size={17} /></IconButton>
      </>}
      navFooter={
        <div style={{ padding: '10px 10px 4px', display: 'flex', flexDirection: 'column', gap: 9 }}>
          <div className="mg-label" style={{ color: 'var(--text-faint)' }}>LAYERS</div>
          <Switch checked={layers.air} onChange={(v) => setLayers(l => ({ ...l, air: v }))} label="Air" />
          <Switch checked={layers.maritime} onChange={(v) => setLayers(l => ({ ...l, maritime: v }))} label="Maritime" />
          <Switch checked={layers.ground} onChange={(v) => setLayers(l => ({ ...l, ground: v }))} label="Ground" />
          <Switch checked={layers.feeds} onChange={(v) => setLayers(l => ({ ...l, feeds: v }))} label="Feed coverage" />
        </div>
      }
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexWrap: 'wrap' }}>
          <Icon name="crosshair" size={17} color={e.track === 'anomalous' ? 'var(--warn)' : 'var(--accent)'} />
          <h2 style={{ fontSize: 'var(--fs-h4)', minWidth: 0 }}>{e.id}</h2>
          <Badge tone={e.track === 'anomalous' ? 'warn' : 'neutral'}>{e.cls}</Badge>
          <span style={{ marginLeft: 'auto' }}><MarkingChip level="confidential" compartment="OPS-N" /></span>
        </div>
        <Card size="sm">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <StatBlock value={Math.round(e.conf * 100) + '%'} label="CLASSIFICATION CONF." size="sm" accent={e.conf < 0.7} />
            <StatBlock value={e.track === 'anomalous' ? 'ANOM' : 'STABLE'} label="TRACK STATE" size="sm" />
          </div>
        </Card>
        <div>
          <SectionLabel number={5}>RANKED OPTIONS · ADVISORY</SectionLabel>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 10 }}>
            {OPTIONS.map(o => (
              <Card key={o.rank} size="sm" interactive onClick={() => setChosen(o.rank)} style={{ borderColor: chosen === o.rank ? 'var(--accent)' : undefined }}>
                <div style={{ display: 'flex', gap: 9, alignItems: 'baseline' }}>
                  <span style={{ fontFamily: 'var(--font-display)', fontWeight: 800, fontSize: 15, color: chosen === o.rank ? 'var(--accent-hover)' : 'var(--text-faint)' }}>{String(o.rank).padStart(2, '0')}</span>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 'var(--fs-sm)', color: 'var(--grey-100)', fontWeight: 500 }}>{o.title}</div>
                    <div style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-muted)', marginTop: 3, lineHeight: 1.5 }}>{o.why}</div>
                    <div style={{ display: 'flex', gap: 5, marginTop: 6, flexWrap: 'wrap' }}>
                      {o.cites.map((c, i) => (
                        <span key={i} style={{ fontFamily: 'var(--font-mono)', fontSize: 9, color: 'var(--accent-hover)', background: 'var(--surface-inset)', border: '1px solid var(--border)', borderRadius: 4, padding: '1px 6px' }}>{c}</span>
                      ))}
                    </div>
                  </div>
                </div>
              </Card>
            ))}
          </div>
        </div>
        <div style={{ padding: '12px 14px', background: 'var(--surface-inset)', border: '1px solid ' + (authorised ? 'var(--secure)' : 'var(--warn)'), borderRadius: 'var(--radius-md)' }}>
          {authorised ? (
            <div style={{ display: 'flex', alignItems: 'center', gap: 9 }}>
              <Icon name="shield-check" size={16} color="var(--secure)" />
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.08em', color: 'var(--secure)' }}>AUTHORISED · SIGNED · AUDIT #D-4471</div>
            </div>
          ) : (
            <>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.12em', color: 'var(--warn)', marginBottom: 8 }}>HUMAN AUTHORISATION REQUIRED · AI IS ADVISORY</div>
              <div style={{ display: 'flex', gap: 8 }}>
                <Button variant="primary" size="sm" fullWidth onClick={() => setAuthorised(true)}>Authorise option {String(chosen).padStart(2, '0')}</Button>
                <Button variant="ghost" size="sm">Defer</Button>
              </div>
            </>
          )}
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 'auto' }}>
          <ProvenanceTag id="FR-H-4" title="AI-assisted, explainable, cited ranked options, advisory" />
          <ProvenanceTag id="FR-H-5" title="Human-gated action workflows with full audit lineage" />
          <ProvenanceTag id="NFR-AI-1" title="Every agentic action traceable, reversible or human-gated" />
        </div>
      </>}>
          <div className="mg-grid-bg" style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }} />
          <div style={{ position: 'absolute', inset: 0, background: 'radial-gradient(ellipse at 55% 45%, rgba(201,154,34,0.05), transparent 60%)' }} />
          {/* range rings */}
          <div style={{ position: 'absolute', inset: 0, overflow: 'hidden', pointerEvents: 'none' }}>
            {[[160, '20 NM'], [320, '40 NM'], [480, '60 NM']].map(([r, lb], i) => (
              <React.Fragment key={i}>
                <div style={{ position: 'absolute', left: '50%', top: '50%', width: r * 2, height: r * 2, marginLeft: -r, marginTop: -r, border: '1px solid var(--divider)', borderRadius: '50%' }} />
                <span style={{ position: 'absolute', left: '50%', top: 'calc(50% - ' + r + 'px)', transform: 'translate(-50%, -50%)', fontFamily: 'var(--font-mono)', fontSize: 8, letterSpacing: '0.12em', color: 'var(--text-faint)', background: 'var(--bg-sunken)', padding: '0 5px' }}>{lb}</span>
              </React.Fragment>
            ))}
            <div style={{ position: 'absolute', top: 12, left: 14, display: 'flex', flexDirection: 'column', gap: 6 }}>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, letterSpacing: '0.14em', color: 'var(--text-muted)' }}>N ↑</span>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
                <span style={{ width: 80, height: 0, borderTop: '2px solid var(--text-faint)', position: 'relative' }}>
                  <span style={{ position: 'absolute', left: 0, top: -4, width: 2, height: 6, background: 'var(--text-faint)' }} />
                  <span style={{ position: 'absolute', right: 0, top: -4, width: 2, height: 6, background: 'var(--text-faint)' }} />
                </span>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 8, letterSpacing: '0.12em', color: 'var(--text-faint)' }}>10 NM</span>
              </span>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 8, letterSpacing: '0.12em', color: 'var(--text-faint)' }}>VECTOR · 1 MIN PROJECTION</span>
            </div>
          </div>
          {layers.feeds && (
            <>
              <div style={{ position: 'absolute', left: '12%', top: '8%', width: '55%', height: '62%', border: '1px dashed rgba(201,154,34,0.35)', borderRadius: '50%', pointerEvents: 'none' }} />
              <span style={{ position: 'absolute', left: '39%', top: '8%', transform: 'translate(-50%, -50%)', fontFamily: 'var(--font-mono)', fontSize: 8, letterSpacing: '0.12em', color: 'var(--heimdall-300)', background: 'var(--bg-sunken)', padding: '1px 6px', pointerEvents: 'none' }}>NORTH-2 · RADAR · 4 HZ · R 60 NM</span>
            </>
          )}
          {visible.map(en => {
            const anomalous = en.track === 'anomalous';
            const selected = en.id === sel;
            const color = anomalous ? 'var(--warn)' : 'var(--accent)';
            const rad = en.hdg * Math.PI / 180;
            const vlen = Math.min(46, 12 + en.spd / 14);
            return (
              <button key={en.id} onClick={() => setSel(en.id)}
                onMouseEnter={() => setHover(en.id)} onMouseLeave={() => setHover(null)}
                onFocus={() => setHover(en.id)} onBlur={() => setHover(null)}
                aria-label={en.id + ' · ' + en.cls + ' · heading ' + en.hdg + ' degrees'}
                style={{
                  all: 'unset', position: 'absolute', left: en.x + '%', top: en.y + '%', transform: 'translate(-50%,-50%)',
                  display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 5, cursor: 'pointer',
                }}>
                <span style={{ position: 'relative', width: 14, height: 14 }}>
                  {/* track trail · history behind the heading */}
                  {[1, 2, 3].map(k => (
                    <span key={k} style={{
                      position: 'absolute', left: '50%', top: '50%', width: 4 - k * 0.7, height: 4 - k * 0.7, borderRadius: '50%',
                      background: color, opacity: 0.45 - k * 0.11,
                      transform: 'translate(-50%,-50%) translate(' + (-Math.sin(rad) * k * 10) + 'px, ' + (Math.cos(rad) * k * 10) + 'px)',
                    }} />
                  ))}
                  {/* velocity vector · 1-min projection */}
                  <span style={{
                    position: 'absolute', left: '50%', bottom: '50%', width: 2, height: vlen,
                    background: 'linear-gradient(to top, ' + color + ', transparent)',
                    transformOrigin: 'bottom center', transform: 'translateX(-50%) rotate(' + en.hdg + 'deg)',
                    opacity: 0.9, pointerEvents: 'none',
                  }} />
                  <span style={{
                    position: 'absolute', inset: 0, borderRadius: en.layer === 'maritime' ? 2 : '50%',
                    background: color,
                    boxShadow: selected ? '0 0 0 5px ' + (anomalous ? 'var(--warn-tint)' : 'var(--accent-tint)') + ', 0 0 18px -2px ' + (anomalous ? 'var(--warn)' : 'var(--accent-glow)') : 'none',
                    outline: selected ? '1px solid ' + color : 'none', outlineOffset: 3,
                  }} />
                </span>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.08em', color: selected ? 'var(--grey-100)' : 'var(--text-faint)', whiteSpace: 'nowrap' }}>{en.id}{anomalous ? ' ⚠' : ''} · {en.hdg}°</span>
              </button>
            );
          })}
          {(() => {
            const t = ENTITIES.find(x => x.id === hover);
            if (!t || layers[t.layer] === false) return null;
            const rng = Math.round(Math.hypot(t.x - 50, t.y - 50) * 1.3);
            const flipY = t.y < 36;
            const rows = [
              ['HDG / SPD', String(t.hdg).padStart(3, '0') + '° · ' + t.spd + ' KT'],
              ['ALT', t.alt],
              ['RNG', rng + ' NM FROM SITE'],
              ['CAP', CAPABILITY[t.cls]],
              ['TRACK', t.track.toUpperCase() + ' · ' + t.feeds + ' FEEDS'],
            ];
            return (
              <div role="tooltip" style={{
                position: 'absolute', left: 'clamp(110px, ' + t.x + '%, calc(100% - 110px))', top: t.y + '%',
                transform: 'translate(-50%, ' + (flipY ? '30px' : 'calc(-100% - 26px)') + ')',
                zIndex: 5, pointerEvents: 'none', minWidth: 200,
                background: 'var(--surface-card)', border: '1px solid ' + (t.track === 'anomalous' ? 'var(--warn)' : 'var(--border-strong)'),
                borderRadius: 'var(--radius-sm)', padding: '9px 11px', boxShadow: 'var(--shadow-md)',
              }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'baseline', marginBottom: 6 }}>
                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fontWeight: 600, color: 'var(--text-heading)' }}>{t.id}</span>
                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.1em', color: 'var(--text-faint)' }}>{t.cls}</span>
                  <span style={{ marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 10, color: t.conf < 0.7 ? 'var(--warn)' : 'var(--secure)' }}>{Math.round(t.conf * 100)}%</span>
                </div>
                {rows.map(([k, v]) => (
                  <div key={k} style={{ display: 'flex', gap: 10, padding: '2px 0', fontFamily: 'var(--font-mono)', fontSize: 9 }}>
                    <span style={{ color: 'var(--text-faint)', width: 62, flex: 'none', letterSpacing: '0.08em' }}>{k}</span>
                    <span style={{ color: 'var(--text-body)' }}>{v}</span>
                  </div>
                ))}
                {t.id === sel && <div style={{ marginTop: 5, fontFamily: 'var(--font-mono)', fontSize: 8, letterSpacing: '0.14em', color: 'var(--accent-hover)' }}>FOCUSED · OPTIONS IN INSPECTOR →</div>}
              </div>
            );
          })()}
          {(() => {
            const t = ENTITIES.find(x => x.id === sel);
            if (!t) return null;
            const rng = Math.round(Math.hypot(t.x - 50, t.y - 50) * 1.3);
            return (
              <div style={{ position: 'absolute', top: 12, right: 14, pointerEvents: 'none', textAlign: 'right', fontFamily: 'var(--font-mono)', display: 'flex', flexDirection: 'column', gap: 3 }}>
                <span style={{ fontSize: 8, letterSpacing: '0.14em', color: 'var(--accent-hover)' }}>FOCUS · {t.id}</span>
                <span style={{ fontSize: 9, color: 'var(--text-muted)' }}>{String(t.hdg).padStart(3, '0')}° · {t.spd} KT · {t.alt}</span>
                <span style={{ fontSize: 9, color: 'var(--text-faint)' }}>{rng} NM · {t.feeds} FEEDS · {t.track.toUpperCase()}</span>
              </div>
            );
          })()}
          <div style={{ position: 'absolute', left: 12, right: 12, bottom: 10, display: 'flex', alignItems: 'flex-end', gap: '8px 18px', flexWrap: 'wrap', zIndex: 4, background: 'color-mix(in srgb, var(--bg-sunken) 80%, transparent)', backdropFilter: 'var(--blur-panel)', WebkitBackdropFilter: 'var(--blur-panel)', border: '1px solid var(--divider)', borderRadius: 'var(--radius-sm)', padding: '8px 12px', width: 'fit-content', maxWidth: 'calc(100% - 24px)' }}>
            <StatBlock value="1,204" label="TRACKED ENTITIES" size="sm" />
            <StatBlock value="0.4s" label="FUSION LATENCY" size="sm" />
            <StatBlock value="1" label="ANOMALIES" size="sm" accent />
            <span style={{ marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.14em', color: 'var(--text-faint)', whiteSpace: 'nowrap' }}>SYNTHETIC PICTURE · REFERENCE LAYOUT ONLY</span>
          </div>
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
