<!-- @dsCard group="Heimdall" viewport="1440x820" subtitle="Marking-aware picture replication across sites over PQ-mTLS" name="Heimdall · Picture Sync" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Heimdall · Picture Sync</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-heimdall">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;
const { Card, Table, StatBlock, StatusPill, Badge, Button, IconButton, Input, Select, Switch, Icon, SectionLabel, Terminal, ProvenanceTag, MarkingChip, Tag, Tabs } = NS;

const SITES = [
  { name: 'SITE-ALPHA (this)', role: 'primary', lag: '—', entities: '1,204', markings: 'C // OPS-N', st: 'online', stl: 'Authoring' },
  { name: 'SITE-BRAVO', role: 'replica', lag: '0.8s', entities: '1,204', markings: 'C // OPS-N', st: 'secure', stl: 'In sync' },
  { name: 'SITE-CHARLIE', role: 'replica', lag: '1.2s', entities: '988', markings: 'RESTRICTED', st: 'secure', stl: 'Filtered sync' },
  { name: 'SITE-DELTA-AG', role: 'air-gap', lag: 'courier', entities: '941', markings: 'RESTRICTED', st: 'offline', stl: 'Snapshot 2d' },
];
function App() {
  const [sel, setSel] = React.useState(2);
  const s = SITES[sel];
  return (
    <ConsoleShell product="heimdall" active="sync" context="PICTURE / SYNC · 4 SITES"
      toolbar={<Button variant="secondary" size="sm" iconLeft={<Icon name="download" size={14} />}>Cut picture snapshot</Button>}
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="network" size={17} color="var(--accent)" />
          <h2 style={{ fontFamily: 'var(--font-mono)', fontWeight: 600, fontSize: 14, flex: 1 }}>{s.name}</h2>
          <StatusPill status={s.st} pulse={s.st === 'online'} label={s.stl} />
        </div>
        <Card size="sm">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <StatBlock value={s.entities} label="ENTITIES VISIBLE" size="sm" />
            <StatBlock value={s.lag} label="REPLICATION LAG" size="sm" />
          </div>
        </Card>
        {sel === 2 && (
          <Card size="sm" style={{ borderColor: 'var(--accent)' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.12em', color: 'var(--accent-hover)', marginBottom: 6 }}>MARKING FILTER ACTIVE</div>
            <p style={{ margin: 0, fontSize: 'var(--fs-xs)', color: 'var(--text-body)', lineHeight: 1.55 }}>216 CONFIDENTIAL // OPS-N entities are withheld from this site: its operators hold RESTRICTED clearance. The filter is evaluated per object, per replication cycle.</p>
          </Card>
        )}
        <Terminal title="REPLICATION" lines={[
          '> heimdall sync status ' + s.name.split(' ')[0].toLowerCase(),
          'transport  PQ-mTLS · X25519+ML-KEM-768',
          'mode       ' + (s.role === 'air-gap' ? 'signed snapshot · courier' : 'delta stream · CRDT merge'),
          'markings   filtered per site clearance',
          '# one picture, per-clearance views',
        ]} />
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 'auto' }}>
          <ProvenanceTag id="FR-H-6" title="Synchronise the common picture across nodes/sites over PQ-mTLS" />
          <ProvenanceTag id="NFR-SEC-2" title="Marking-based access enforced at the object layer" />
        </div>
      </>}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 24 }}>
        <div>
          <SectionLabel number={6}>SYNC</SectionLabel>
          <h1 style={{ fontSize: 'var(--fs-h3)', marginTop: 6 }}>Picture sync</h1>
        </div>
        <div style={{ flex: 1 }} />
        <StatBlock value="4" label="SITES" size="sm" />
        <StatBlock value="0.8s" label="WORST LIVE LAG" size="sm" accent />
        <StatBlock value="216" label="MARKING-FILTERED OBJECTS" size="sm" />
      </div>
      <div className="mg-grid-bg" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 26, padding: 26, background: 'var(--bg-sunken)', border: '1px solid var(--border)', borderRadius: 'var(--radius-md)' }}>
        {SITES.map((site, i) => (
          <React.Fragment key={site.name}>
            <button onClick={() => setSel(i)} style={{ all: 'unset', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
              <span style={{
                width: 54, height: 54, borderRadius: 12, display: 'flex', alignItems: 'center', justifyContent: 'center',
                background: i === sel ? 'var(--accent-tint)' : 'var(--surface-card)',
                border: '1px solid ' + (i === sel ? 'var(--accent)' : 'var(--border)'),
                boxShadow: i === sel ? 'var(--shadow-glow)' : 'none',
              }}>
                <Icon name={site.role === 'air-gap' ? 'download' : site.role === 'primary' ? 'eye' : 'radar'} size={20} color={site.st === 'offline' ? 'var(--text-faint)' : 'var(--accent)'} />
              </span>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.08em', color: i === sel ? 'var(--grey-100)' : 'var(--text-faint)' }}>{site.name.split(' ')[0]}</span>
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: 8, color: 'var(--text-faint)' }}>{site.lag}</span>
            </button>
            {i < SITES.length - 1 && (
              <span style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3 }}>
                <span style={{ width: 44, height: 2, background: SITES[i + 1].st === 'offline' ? 'var(--border-strong)' : 'var(--accent)', opacity: SITES[i + 1].st === 'offline' ? 1 : 0.6, borderRadius: 1 }} />
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: 7.5, letterSpacing: '0.1em', color: 'var(--text-faint)' }}>{SITES[i + 1].st === 'offline' ? 'COURIER' : 'PQ-mTLS'}</span>
              </span>
            )}
          </React.Fragment>
        ))}
      </div>
      <Table
        columns={[
          { header: 'Site', cell: r => <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="radar" size={14} color="var(--accent)" />{r.name}</span> },
          { header: 'Role', key: 'role', mono: true, width: 90 },
          { header: 'Lag', key: 'lag', mono: true, width: 80 },
          { header: 'Entities', key: 'entities', mono: true, align: 'right', width: 90 },
          { header: 'Max marking', key: 'markings', mono: true, width: 130 },
          { header: 'State', cell: r => <StatusPill status={r.st} pulse={r.st === 'online'} label={r.stl} />, width: 140 },
        ]}
        rows={SITES} selectedIndex={sel} onRowClick={setSel}
      />
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
