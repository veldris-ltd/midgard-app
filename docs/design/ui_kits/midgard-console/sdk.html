<!-- @dsCard group="Midgard Console" viewport="1440x820" subtitle="Typed SDKs, CLI, MCP endpoint: governed access for developers and agents" name="Midgard · SDK & APIs" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Midgard · SDK & APIs</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-midgard">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;
const { Card, Table, StatBlock, StatusPill, Badge, Button, IconButton, Input, Select, Switch, Icon, SectionLabel, Terminal, ProvenanceTag, MarkingChip, Tag, Tabs } = NS;

const SURFACES = [
  { name: 'Object API', proto: 'gRPC + REST · PQ-mTLS', use: 'CRUD/query on objects & links; search-around', calls: '4.1M/d', st: 'healthy', stl: 'Serving' },
  { name: 'Action API', proto: 'gRPC + REST', use: 'Apply actions; returns audit id', calls: '212k/d', st: 'healthy', stl: 'Serving' },
  { name: 'Function API', proto: 'gRPC', use: 'Invoke functions incl. Mimir-backed', calls: '96k/d', st: 'healthy', stl: 'Serving' },
  { name: 'Admin API', proto: 'REST', use: 'Types, policies, markings, upgrades', calls: '1.2k/d', st: 'secure', stl: 'Restricted' },
  { name: 'MCP endpoint', proto: 'MCP · PQ-mTLS', use: 'Governed agent/tool access to the fabric', calls: '48k/d', st: 'online', stl: 'Live' },
];
function App() {
  const [sel, setSel] = React.useState(4);
  const [lang, setLang] = React.useState('ts');
  const s = SURFACES[sel];
  const SNIPPETS = {
    ts: ['import { fabric } from "@midgard/sdk";', '', 'const risky = await fabric.objects("aircraft")', '  .where(a => a.riskScore.gt(0.6))', '  .searchAround("maintenanceEvents")', '  .fetch(); // policy applied at query time'],
    py: ['from midgard import fabric', '', 'risky = (fabric.objects("aircraft")', '  .where(lambda a: a.risk_score > 0.6)', '  .search_around("maintenance_events")', '  .fetch())  # policy applied at query time'],
    cli: ['> midgard objects query aircraft \\', '    --where "risk_score > 0.6" \\', '    --search-around maintenance_events', '# 14 objects · purpose: maintenance · audited'],
  };
  return (
    <ConsoleShell product="midgard" active="sdk" context="ENCLOSURE / SDK & API SURFACE"
      toolbar={<Button variant="secondary" size="sm" iconLeft={<Icon name="download" size={14} />}>Download SDKs</Button>}
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="code" size={17} color="var(--accent)" />
          <h2 style={{ fontSize: 15, flex: 1 }}>{s.name}</h2>
          <StatusPill status={s.st} pulse={s.st === 'online'} label={s.stl} />
        </div>
        <Card size="sm">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <StatBlock value={s.calls} label="CALLS" size="sm" />
            <StatBlock value="100%" label="POLICY-CHECKED" size="sm" accent />
          </div>
        </Card>
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>EVERY CALL</div>
          {['PQ-mTLS · workload identity', 'Role / marking / purpose evaluated', 'Deny-by-default · audited', 'Generated, typed clients'].map((l, i) => (
            <div key={i} style={{ display: 'flex', gap: 8, alignItems: 'center', padding: '6px 0', borderBottom: '1px solid var(--divider)', fontSize: 'var(--fs-xs)', color: 'var(--text-body)' }}>
              <Icon name="check" size={13} color="var(--secure)" />{l}
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 'auto' }}>
          <ProvenanceTag id="DD-6" title="Products and developers depend on Midgard contracts, not implementations" />
          <ProvenanceTag id="DD-4" title="MCP endpoint: governed agent/tool access to the fabric" />
          <ProvenanceTag id="NFR-SEC-1" title="Zero-trust: every request mutually authenticated and authorised" />
        </div>
      </>}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 24 }}>
        <div>
          <SectionLabel number={11}>SDK</SectionLabel>
          <h1 style={{ fontSize: 'var(--fs-h3)', marginTop: 6 }}>SDK & API surface</h1>
        </div>
        <div style={{ flex: 1 }} />
        <StatBlock value="5" label="API SURFACES" size="sm" />
        <StatBlock value="2" label="TYPED SDKS · TS / PY" size="sm" />
        <StatBlock value="4.5M" label="CALLS / DAY" size="sm" accent />
      </div>
      <Table
        columns={[
          { header: 'Surface', cell: r => <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="code" size={14} color="var(--accent)" />{r.name}</span> },
          { header: 'Protocol', key: 'proto', mono: true, width: 180 },
          { header: 'Purpose', key: 'use' },
          { header: 'Volume', key: 'calls', mono: true, align: 'right', width: 90 },
          { header: 'State', cell: r => <StatusPill status={r.st} pulse={false} label={r.stl} />, width: 120 },
        ]}
        rows={SURFACES} selectedIndex={sel} onRowClick={setSel}
      />
      <div>
        <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
          {[['ts', 'TypeScript'], ['py', 'Python'], ['cli', 'CLI']].map(([k, lb]) => (
            <Tag key={k} active={lang === k} onClick={() => setLang(k)}>{lb}</Tag>
          ))}
        </div>
        <Terminal title={'TYPED CLIENT · ' + lang.toUpperCase()} lines={SNIPPETS[lang]} />
      </div>
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
