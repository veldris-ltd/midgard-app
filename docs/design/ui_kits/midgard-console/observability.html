<!-- @dsCard group="Midgard Console" viewport="1440x820" subtitle="SLO dashboards, traces, in-enclosure sinks: no external telemetry" name="Midgard · Observability" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Midgard · Observability</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-midgard">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;
const { Card, Table, StatBlock, StatusPill, Badge, Button, IconButton, Input, Select, Switch, Icon, SectionLabel, Terminal, ProvenanceTag, MarkingChip, Tag, Tabs } = NS;

const SLOS = [
  { name: 'Control plane availability', slo: '99.9%', actual: '99.97%', window: '30d', burn: '0.2×', st: 'secure', stl: 'Met' },
  { name: 'Fabric query p99', slo: '< 250ms', actual: '184ms', window: '7d', burn: '0.4×', st: 'secure', stl: 'Met' },
  { name: 'Inference first token', slo: '< 800ms', actual: '420ms', window: '7d', burn: '0.1×', st: 'secure', stl: 'Met' },
  { name: 'Audit write latency', slo: '< 50ms', actual: '61ms', window: '24h', burn: '1.8×', st: 'warn', stl: 'Burning' },
];
function App() {
  const [sel, setSel] = React.useState(3);
  const s = SLOS[sel];
  return (
    <ConsoleShell product="midgard" active="obs" context="ENCLOSURE / OBSERVABILITY"
      toolbar={<Select size="sm" options={['window: 24h', 'window: 7d', 'window: 30d']} value="window: 7d" onChange={() => {}} />}
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="activity" size={17} color="var(--accent)" />
          <h2 style={{ fontSize: 15, flex: 1 }}>{s.name}</h2>
          <StatusPill status={s.st} pulse={false} label={s.stl} />
        </div>
        <Card size="sm">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <StatBlock value={s.actual} label={'TARGET ' + s.slo} size="sm" accent={s.st === 'warn'} />
            <StatBlock value={s.burn} label="ERROR-BUDGET BURN" size="sm" />
          </div>
        </Card>
        {s.st === 'warn' && (
          <Card size="sm" style={{ borderColor: 'var(--warn)' }}>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 9, letterSpacing: '0.12em', color: 'var(--warn)', marginBottom: 6 }}>BURN ALERT</div>
            <p style={{ margin: 0, fontSize: 'var(--fs-xs)', color: 'var(--text-body)', lineHeight: 1.55 }}>Audit-store write latency climbing since 06:00; correlates with ledger compaction. Compaction reschedule proposed; no records lost.</p>
            <Button variant="outline" size="sm" style={{ marginTop: 10 }}>View trace</Button>
          </Card>
        )}
        <Terminal title="TRACE · CORRELATION-TAGGED" lines={[
          '> midgard trace 8f2c-44e1',
          'gateway     2ms   identity  4ms',
          'policy      1ms   fabric   38ms',
          'audit      61ms ⚠ (ledger compaction)',
          '# every hop in-enclosure',
        ]} />
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginTop: 'auto' }}>
          <ProvenanceTag id="NFR-AVA-1" title="99.9% control-plane availability target" />
          <ProvenanceTag id="NFR-PRV-1" title="No external telemetry; in-enclosure sinks only" />
        </div>
      </>}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 24 }}>
        <div>
          <SectionLabel number={12}>OBSERVABILITY</SectionLabel>
          <h1 style={{ fontSize: 'var(--fs-h3)', marginTop: 6 }}>SLOs & traces</h1>
        </div>
        <div style={{ flex: 1 }} />
        <StatBlock value="99.97%" label="CONTROL PLANE · 30D" size="sm" accent />
        <StatBlock value="4" label="SLOS TRACKED" size="sm" />
        <StatBlock value="0" label="EXTERNAL SINKS" size="sm" />
      </div>
      <Table
        columns={[
          { header: 'SLO', cell: r => <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="gauge" size={14} color="var(--accent)" />{r.name}</span> },
          { header: 'Target', key: 'slo', mono: true, width: 100 },
          { header: 'Actual', key: 'actual', mono: true, width: 90 },
          { header: 'Window', key: 'window', mono: true, width: 80 },
          { header: 'Budget burn', key: 'burn', mono: true, align: 'right', width: 100 },
          { header: 'State', cell: r => <StatusPill status={r.st} pulse={false} label={r.stl} />, width: 110 },
        ]}
        rows={SLOS} selectedIndex={sel} onRowClick={setSel}
      />
      <div style={{ display: 'flex', gap: 12 }}>
        {[['LOGS', 'structured · correlation-tagged', 'in-enclosure aggregation'], ['METRICS', 'control plane + inference', 'SLO dashboards, burn alerts'], ['TRACES', 'distributed · mesh-wide', 'request + action paths'], ['BACKUP', 'encrypted snapshots · nightly', 'restore tested 6d ago']].map(([t, v, d]) => (
          <Card key={t} size="sm" style={{ flex: 1 }}>
            <div className="mg-label" style={{ color: 'var(--text-faint)' }}>{t}</div>
            <div style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-xs)', color: 'var(--grey-100)', margin: '8px 0 4px' }}>{v}</div>
            <div style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-muted)' }}>{d}</div>
          </Card>
        ))}
      </div>
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
