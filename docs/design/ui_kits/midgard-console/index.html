<!-- @dsCard group="Midgard Console" viewport="1440x820" subtitle="Enclosure admin: object fabric explorer, governance & audit" name="Midgard Console" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Midgard Console · Object Fabric</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../docs/mode.js"></script>
<style>body{margin:0;overflow:hidden}</style></head>
<body class="theme-midgard">
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="../../ds-loader.js"></script>
<script type="text/babel" src="../kit-shell.jsx"></script>
<script type="text/babel">
const NS = window.__mgNS();
const { ConsoleShell } = window.KitShell;
const { Tabs, Table, Card, StatBlock, StatusPill, MarkingChip, ProvenanceTag, Badge, Button, IconButton, Input, Icon, SectionLabel, Terminal } = NS;

const OBJECTS = [
  { name: 'Aircraft', api: 'aircraft', props: 14, instances: '12,408', marking: 'confidential', comp: 'OPS-N', links: ['operates → Route', 'assigned → Crew'], actions: ['Ground aircraft', 'Schedule maintenance'], updated: '2m ago' },
  { name: 'Facility', api: 'facility', props: 9, instances: '1,882', marking: 'restricted', comp: null, links: ['hosts → Asset'], actions: ['Change status'], updated: '11m ago' },
  { name: 'Sensor Feed', api: 'sensor_feed', props: 21, instances: '640', marking: 'confidential', comp: 'SIG', links: ['observes → Entity'], actions: ['Recalibrate'], updated: '18s ago' },
  { name: 'Crew Member', api: 'crew_member', props: 17, instances: '3,051', marking: 'internal', comp: null, links: ['assigned → Aircraft'], actions: ['Update clearance'], updated: '1h ago' },
  { name: 'Maintenance Event', api: 'maintenance_event', props: 12, instances: '48,112', marking: 'internal', comp: null, links: ['on → Aircraft'], actions: ['Close event'], updated: '4m ago' },
];

const AUDIT = [
  { actor: 'agent:mimir/dispatch-01', action: 'Action · Schedule maintenance', res: 'aircraft/AC-2214', sig: 'ML-DSA ✓', ts: '14:32:08' },
  { actor: 'j.benjamin', action: 'Query · search-around', res: 'aircraft/*', sig: 'ML-DSA ✓', ts: '14:31:56' },
  { actor: 'svc:forge/projector', action: 'Write · object sync', res: 'sensor_feed/†640', sig: 'ML-DSA ✓', ts: '14:31:41' },
];

function App() {
  const [tab, setTab] = React.useState(0);
  const [sel, setSel] = React.useState(0);
  const o = OBJECTS[sel];
  return (
    <ConsoleShell product="midgard" active="objects" context="ENCLOSURE / OBJECT FABRIC" asideWidth={340}
      toolbar={<>
        <Input mono size="sm" placeholder="Search objects, links, actions…" prefix={<Icon name="search" size={14} color="var(--text-faint)" />} style={{ width: 'min(300px, 42vw)' }} />
        <IconButton label="Notifications"><Icon name="bell" size={17} /></IconButton>
        <IconButton label="Account"><Icon name="user" size={17} /></IconButton>
      </>}
      navFooter={<Terminal lines={['> midgard status', '# ALL SYSTEMS NOMINAL']} style={{ fontSize: 10 }} />}
      aside={<>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <Icon name="boxes" size={18} color="var(--accent)" />
          <h2 style={{ fontSize: 'var(--fs-h4)', flex: 1 }}>{o.name}</h2>
          <MarkingChip level={o.marking} compartment={o.comp} />
        </div>
        <Card size="sm">
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
            <StatBlock value={o.props} label="PROPERTIES" size="sm" />
            <StatBlock value={o.instances} label="INSTANCES" size="sm" />
          </div>
        </Card>
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>LINK TYPES</div>
          {o.links.map((l, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 0', borderBottom: '1px solid var(--divider)', fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-xs)', color: 'var(--text-body)' }}>
              <Icon name="network" size={13} color="var(--text-faint)" />{l}
            </div>
          ))}
        </div>
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>ACTION TYPES</div>
          {o.actions.map((a, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '7px 0', borderBottom: '1px solid var(--divider)', fontSize: 'var(--fs-sm)', color: 'var(--text-body)' }}>
              <Icon name="zap" size={13} color="var(--accent)" />{a}
              <span style={{ marginLeft: 'auto' }}><Badge tone="warn">HUMAN GATE</Badge></span>
            </div>
          ))}
        </div>
        <div>
          <div className="mg-label" style={{ color: 'var(--text-faint)', marginBottom: 8 }}>PROVENANCE</div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            <ProvenanceTag id="DD-1" title="Object fabric at the centre" />
            <ProvenanceTag id="NFR-SEC-2" title="Role/marking/purpose enforced at query time" />
            <ProvenanceTag id="NFR-PQ-2" title="AES-256-GCM under ML-KEM-1024-wrapped keys" />
          </div>
        </div>
        <div style={{ marginTop: 'auto', display: 'flex', gap: 8 }}>
          <Button variant="secondary" size="sm" fullWidth>Edit schema</Button>
          <Button variant="primary" size="sm" fullWidth iconRight={<Icon name="arrow-right" size={14} />}>Explore instances</Button>
        </div>
      </>}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: '12px 24px', flexWrap: 'wrap' }}>
        <div>
          <SectionLabel number={2}>OBJECT FABRIC</SectionLabel>
          <h1 style={{ fontSize: 'var(--fs-h3)', marginTop: 6 }}>Object types</h1>
        </div>
        <div style={{ flex: 1 }} />
        <StatBlock value="312" label="OBJECT TYPES" size="sm" />
        <StatBlock value="1.2M" label="INSTANCES" size="sm" />
        <StatBlock value="100%" label="LINEAGE SIGNED" size="sm" accent />
        <Button variant="primary" iconLeft={<Icon name="plus" size={15} />}>New object type</Button>
      </div>
      <Tabs tabs={[{ label: 'All types', badge: '312' }, { label: 'Interfaces' }, { label: 'Shared properties' }, { label: 'Change requests', badge: '4' }]} active={tab} onChange={setTab} />
      <div style={{ overflowX: 'auto' }}>
        <Table
          columns={[
            { header: 'Object type', cell: (r) => <span style={{ display: 'flex', alignItems: 'center', gap: 9 }}><Icon name="boxes" size={15} color="var(--accent)" />{r.name}</span> },
            { header: 'API name', key: 'api', mono: true },
            { header: 'Props', key: 'props', mono: true, align: 'right', width: 70 },
            { header: 'Instances', key: 'instances', mono: true, align: 'right', width: 110 },
            { header: 'Marking', cell: (r) => <MarkingChip level={r.marking} compartment={r.comp} />, width: 190 },
            { header: 'Updated', key: 'updated', mono: true, width: 100 },
          ]}
          rows={OBJECTS} selectedIndex={sel} onRowClick={setSel} style={{ minWidth: 720 }}
        />
      </div>
      <div>
        <SectionLabel number={3} muted>AUDIT LINEAGE · LIVE</SectionLabel>
        <div style={{ overflowX: 'auto', marginTop: 8 }}>
          <Table compact
            columns={[
              { header: 'Actor', key: 'actor', mono: true },
              { header: 'Operation', key: 'action' },
              { header: 'Resource', key: 'res', mono: true },
              { header: 'Signature', cell: (r) => <Badge tone="secure">{r.sig}</Badge>, width: 110 },
              { header: 'TS', key: 'ts', mono: true, width: 90 },
            ]}
            rows={AUDIT} style={{ minWidth: 640 }}
          />
        </div>
      </div>
    </ConsoleShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
