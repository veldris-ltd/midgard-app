<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.b{background:var(--surface-card);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9px;color:var(--grey-400)}
</style></head><body>
<div style="display:flex;gap:14px;padding:20px 24px;align-items:center">
<div class="b" style="width:90px;height:70px;border-radius:4px">xs · 4</div>
<div class="b" style="width:90px;height:70px;border-radius:6px">sm · 6</div>
<div class="b" style="width:90px;height:70px;border-radius:10px">md · 10</div>
<div class="b" style="width:90px;height:70px;border-radius:16px">lg · 16</div>
<div class="b" style="width:110px;height:30px;border-radius:999px;background:var(--secure-tint);border-color:transparent;color:var(--secure)">pill · status</div>
</div></body></html>
