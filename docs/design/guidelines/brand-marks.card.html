<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.m{display:flex;align-items:center;gap:10px}
.tile{width:38px;height:38px;border-radius:10px;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:19px;color:#fff}
.w{font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--text-heading)}
.d{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;color:var(--grey-500)}
</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px 24px;padding:20px 24px">
<div class="m"><div class="tile" style="background:var(--midgard-tint);color:var(--midgard-300)">M</div><div><div class="w">MIDGARD</div><div class="d">CORE PLATFORM</div></div></div>
<div class="m"><div class="tile" style="background:var(--forge-tint);color:var(--forge-300)">F</div><div><div class="w">FORGE</div><div class="d">DATA OPERATIONS</div></div></div>
<div class="m"><div class="tile" style="background:var(--mimir-tint);color:var(--mimir-300)">M</div><div><div class="w">MIMIR</div><div class="d">LOCAL AGENTIC AI</div></div></div>
<div class="m"><div class="tile" style="background:var(--bifrost-tint);color:var(--bifrost-300)">B</div><div><div class="w">BIFROST</div><div class="d">CONTINUOUS DELIVERY</div></div></div>
<div class="m"><div class="tile" style="background:var(--heimdall-tint);color:var(--heimdall-300)">H</div><div><div class="w">HEIMDALL</div><div class="d">OPERATIONAL FUSION</div></div></div>
<div class="m" style="opacity:.65"><div class="tile" style="background:var(--surface-inset);color:var(--grey-400);font-size:12px">···</div><div><div class="d" style="color:var(--grey-400)">TYPE-ONLY STAND-INS · <br>SUPPLY REAL MARKS TO REPLACE</div></div></div>
</div></body></html>
