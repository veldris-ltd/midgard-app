<!-- @dsCard group="Colors" viewport="700x210" subtitle="One accent hue per product, re-pointed via .theme-* scopes" name="Product accents" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.row{display:flex;gap:8px;padding:16px}
.p{flex:1;background:var(--surface-card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.chip{height:64px;display:flex;align-items:flex-end;padding:8px}
.chip span{font-family:var(--font-mono);font-size:9px;color:rgba(255,255,255,.85)}
.meta{padding:8px 10px 10px}
.meta b{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;color:var(--grey-100);display:block}
.meta i{font-family:var(--font-mono);font-size:9px;color:var(--grey-500);font-style:normal}
.bar{height:6px;display:flex}.bar div{flex:1}
</style></head><body>
<div class="row">
<div class="p"><div class="chip" style="background:var(--midgard-500)"><span>#CA1D25</span></div><div class="bar"><div style="background:var(--midgard-300)"></div><div style="background:var(--midgard-500)"></div><div style="background:var(--midgard-600)"></div></div><div class="meta"><b>MIDGARD</b><i>enclosure red</i></div></div>
<div class="p"><div class="chip" style="background:var(--forge-500)"><span>#D96E1E</span></div><div class="bar"><div style="background:var(--forge-300)"></div><div style="background:var(--forge-500)"></div><div style="background:var(--forge-600)"></div></div><div class="meta"><b>FORGE</b><i>ember orange</i></div></div>
<div class="p"><div class="chip" style="background:var(--mimir-500)"><span>#23A8B6</span></div><div class="bar"><div style="background:var(--mimir-300)"></div><div style="background:var(--mimir-500)"></div><div style="background:var(--mimir-600)"></div></div><div class="meta"><b>MIMIR</b><i>well teal</i></div></div>
<div class="p"><div class="chip" style="background:var(--bifrost-500)"><span>#7D5CE6</span></div><div class="bar"><div style="background:var(--bifrost-300)"></div><div style="background:var(--bifrost-500)"></div><div style="background:var(--bifrost-600)"></div></div><div class="meta"><b>BIFROST</b><i>bridge violet</i></div></div>
<div class="p"><div class="chip" style="background:var(--heimdall-500)"><span>#C99A22</span></div><div class="bar"><div style="background:var(--heimdall-300)"></div><div style="background:var(--heimdall-500)"></div><div style="background:var(--heimdall-600)"></div></div><div class="meta"><b>HEIMDALL</b><i>watchman gold</i></div></div>
</div></body></html>
