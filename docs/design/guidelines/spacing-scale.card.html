<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base grid" name="Spacing scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head><body>
<div style="display:flex;align-items:flex-end;gap:14px;padding:20px 24px;height:110px">
<div style="text-align:center"><div style="width:22px;height:4px;background:var(--accent);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--grey-500);margin-top:6px">1·4</div></div>
<div style="text-align:center"><div style="width:22px;height:8px;background:var(--accent);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--grey-500);margin-top:6px">2·8</div></div>
<div style="text-align:center"><div style="width:22px;height:12px;background:var(--accent);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--grey-500);margin-top:6px">3·12</div></div>
<div style="text-align:center"><div style="width:22px;height:16px;background:var(--accent);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--grey-500);margin-top:6px">4·16</div></div>
<div style="text-align:center"><div style="width:22px;height:24px;background:var(--accent);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--grey-500);margin-top:6px">5·24</div></div>
<div style="text-align:center"><div style="width:22px;height:32px;background:var(--accent);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--grey-500);margin-top:6px">6·32</div></div>
<div style="text-align:center"><div style="width:22px;height:48px;background:var(--accent);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--grey-500);margin-top:6px">7·48</div></div>
<div style="text-align:center"><div style="width:22px;height:64px;background:var(--accent);margin:0 auto"></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--grey-500);margin-top:6px">8·64</div></div>
<div style="margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--grey-500);line-height:1.8;text-align:right">--container 1200<br>--row-h 40 · compact 32<br>--toolbar-h 52 · --sidenav-w 232</div>
</div></body></html>
