<!-- @dsCard group="Colors" viewport="700x150" subtitle="Ink ramp, the surfaces the platform is built on" name="Ink ramp" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>
.row{display:flex;gap:8px;padding:16px}
.sw{flex:1;height:96px;border-radius:8px;border:1px solid var(--ink-600);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.sw b{font-family:var(--font-mono);font-size:10px;color:var(--grey-300);font-weight:500}
.sw i{font-family:var(--font-mono);font-size:9px;color:var(--grey-500);font-style:normal}
</style></head><body style="background:var(--ink-950)">
<div class="row">
<div class="sw" style="background:#050506"><b>--ink-950</b><i>sunken</i></div>
<div class="sw" style="background:#0a0b0d"><b>--ink-900</b><i>page</i></div>
<div class="sw" style="background:#101114"><b>--ink-850</b><i>inset</i></div>
<div class="sw" style="background:#16181c"><b>--ink-800</b><i>card</i></div>
<div class="sw" style="background:#1e2126"><b>--ink-700</b><i>raised</i></div>
<div class="sw" style="background:#2a2d34"><b>--ink-600</b><i>border</i></div>
<div class="sw" style="background:#3a3e46"><b>--ink-500</b><i>strong</i></div>
</div></body></html>
