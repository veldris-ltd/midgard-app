<!-- @dsCard group="Colors" viewport="700x150" subtitle="Cool grey text ramp on dark" name="Text ramp" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head><body>
<div style="display:flex;flex-direction:column;gap:0;padding:20px 24px">
<div style="display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--divider)"><span style="font-family:var(--font-mono);font-size:10px;color:var(--grey-500);width:130px">--text-heading</span><span style="color:var(--text-heading);font-family:var(--font-display);font-weight:700;font-size:18px">Headings, pure white</span></div>
<div style="display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--divider)"><span style="font-family:var(--font-mono);font-size:10px;color:var(--grey-500);width:130px">--text-body</span><span style="color:var(--text-body);font-size:15px">Body copy, grey-300</span></div>
<div style="display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--divider)"><span style="font-family:var(--font-mono);font-size:10px;color:var(--grey-500);width:130px">--text-muted</span><span style="color:var(--text-muted);font-size:15px">Muted / secondary, grey-400</span></div>
<div style="display:flex;align-items:baseline;gap:16px;padding:6px 0"><span style="font-family:var(--font-mono);font-size:10px;color:var(--grey-500);width:130px">--text-faint</span><span style="color:var(--text-faint);font-size:15px">Captions, disabled, grey-500</span></div>
</div></body></html>
