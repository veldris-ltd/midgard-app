const GATE = {
  human: { label: 'HUMAN GATE', color: 'var(--warn)' },
  auto: { label: 'AUTO GATE', color: 'var(--info)' },
  crypto: { label: 'PQ / SIGNED', color: 'var(--secure)' },
};

function Step({ s, last }) {
  const g = s.gate ? GATE[s.gate] : null;
  return (
    <div style={{ display: 'flex', alignItems: 'stretch', flex: '1 1 150px', minWidth: 150, maxWidth: 210 }}>
      <div style={{ flex: 1, background: 'var(--surface-card)', border: '1px solid var(--border)', borderTop: g ? '2px solid ' + g.color : '1px solid var(--border)', borderRadius: 'var(--radius-md)', padding: '12px 13px', display: 'flex', flexDirection: 'column', gap: 6 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <Icon name={s.icon} size={15} color="var(--accent)" />
          {g && <span style={{ marginLeft: 'auto', fontFamily: 'var(--font-mono)', fontSize: 8, letterSpacing: '0.1em', color: g.color }}>{g.label}</span>}
        </div>
        <div style={{ fontSize: 'var(--fs-sm)', fontWeight: 600, color: 'var(--text-heading)', lineHeight: 1.3 }}>{s.title}</div>
        <div style={{ fontSize: 'var(--fs-xs)', color: 'var(--text-muted)', lineHeight: 1.45 }}>{s.sub}</div>
        <div style={{ marginTop: 'auto', fontFamily: 'var(--font-mono)', fontSize: 8.5, letterSpacing: '0.1em', color: 'var(--text-faint)', textTransform: 'uppercase' }}>{s.actor}</div>
      </div>
      {!last && (
        <div style={{ display: 'flex', alignItems: 'center', padding: '0 3px', color: 'var(--text-faint)', flex: 'none' }}>
          <Icon name="chevron-right" size={15} />
        </div>
      )}
    </div>
  );
}

function Flow({ f, num }) {
  return (
    <section id={f.id} className={'theme-' + f.theme} style={{ marginBottom: 56, scrollMarginTop: 90 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 6, flexWrap: 'wrap' }}>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 'var(--fs-xs)', color: 'var(--accent)', letterSpacing: '0.1em' }}>F{num} //</span>
        <h2 style={{ fontSize: 'var(--fs-h3)' }}>{f.title}</h2>
        <div style={{ flex: 1 }} />
        <ProductMark product={f.product} size="sm" showDescriptor={false} />
      </div>
      <div style={{ display: 'flex', gap: 14, alignItems: 'center', marginBottom: 16, flexWrap: 'wrap' }}>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.1em', color: 'var(--text-faint)', textTransform: 'uppercase' }}>{f.who}</span>
        {f.prov.map(p => <ProvenanceTag key={p} id={p} />)}
      </div>
      <div className="mg-grid-bg" style={{ display: 'flex', flexWrap: 'wrap', gap: '10px 0', padding: 18, border: '1px solid var(--border)', borderRadius: 'var(--radius-lg)', background: 'var(--bg-sunken)' }}>
        {f.steps.map((s, i) => <Step key={i} s={s} last={i === f.steps.length - 1} />)}
      </div>
      <p style={{ margin: '12px 0 0', fontSize: 'var(--fs-xs)', lineHeight: 1.6, color: 'var(--text-muted)', maxWidth: 720 }}>{f.note}</p>
    </section>
  );
}

function App() {
  return (
    <DocsShell active="flows">
      <PageIntro num={5} eyebrow="USER FLOWS" title="Governed journeys"
        lead="Twenty-eight flows spanning every SAD, including the client layer and the admin control panel: product journeys, the session handshake, crypto-agility, self-healing and self-defending, spoofed-feed rejection, picture sync, degraded mode, enclosure recovery, offline sync, inference tiering, extension brokering, signed client updates, biometric unlock, guarded admin actions, policy simulation, break-glass, the advisory copilot, and the end-to-end composite. Gate markers show where each flow is held: amber = a human must authorise, blue = an automated policy/health gate, green = a cryptographic proof (PQ handshake, seal, or ML-DSA signature)." />
      <div style={{ display: 'flex', gap: 16, marginBottom: 44, flexWrap: 'wrap' }}>
        {Object.entries(GATE).map(([k, g]) => (
          <span key={k} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.1em', color: 'var(--text-muted)' }}>
            <span style={{ width: 18, height: 3, borderRadius: 2, background: g.color }} />{g.label}
          </span>
        ))}
      </div>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 44 }}>
        {FLOWS.map((f, i) => (
          <a key={f.id} href={'#' + f.id} style={{ fontFamily: 'var(--font-mono)', fontSize: 11, padding: '5px 10px', border: '1px solid var(--border)', borderRadius: 'var(--radius-xs)', color: 'var(--text-muted)', textDecoration: 'none', background: 'var(--surface-card)' }}>F{i + 1} · {f.title}</a>
        ))}
      </div>
      {FLOWS.map((f, i) => <Flow key={f.id} f={f} num={i + 1} />)}
    </DocsShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
