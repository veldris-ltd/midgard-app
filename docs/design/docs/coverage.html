function App() {
  const total = SADS.reduce((n, s) => n + s.rows.length, 0);
  return (
    <DocsShell active="coverage">
      <PageIntro num={8} eyebrow="TRACEABILITY" title="Requirement coverage matrix"
        lead={'Every design driver, functional requirement, NFR, and acceptance criterion across the seven Solutions Architecture Documents (' + total + ' requirements), traced to the design surface that demonstrates it. The same discipline the SADs demand of the architecture — no claim without provenance — applied to the design system itself.'} />
      {SADS.map((sad, si) => (
        <Section key={sad.name} id={'sad' + si} num={si + 1} title={sad.name} lead="">
          <div className={'theme-' + sad.theme} style={{ border: '1px solid var(--border)', borderRadius: 'var(--radius-md)', overflow: 'hidden', background: 'var(--surface-card)' }}>
            {sad.rows.map(([id, req, links], i) => (
              <div key={id} style={{ display: 'flex', gap: 14, alignItems: 'baseline', padding: '9px 16px', borderBottom: i < sad.rows.length - 1 ? '1px solid var(--divider)' : 'none', flexWrap: 'wrap' }}>
                <span style={{ width: 100, flex: 'none' }}><ProvenanceTag id={id} /></span>
                <span style={{ flex: '1 1 300px', fontSize: 'var(--fs-xs)', color: 'var(--text-body)', lineHeight: 1.5 }}>{req}</span>
                <span style={{ display: 'flex', gap: 10, flexWrap: 'wrap', flex: '0 1 auto' }}>
                  {links.map(([label, href]) => (
                    <a key={label} href={href} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 'var(--fs-micro)', fontFamily: 'var(--font-mono)', letterSpacing: '0.04em', textDecoration: 'none' }}>
                      {label} <Icon name="arrow-up-right" size={10} />
                    </a>
                  ))}
                </span>
              </div>
            ))}
          </div>
        </Section>
      ))}
    </DocsShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
