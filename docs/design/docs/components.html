<script type="text/babel">
const { DocsShell, PageIntro, Section, SubHead, Demo, Code, PropsTable, DoDont } = window.Docs;
const NSx = window.Docs.NS;
const { Button, IconButton, Badge, Tag, StatusPill, Input, Select, Switch, Card, Table, StatBlock, SectionLabel, Terminal, ProvenanceTag, Tabs, SideNav, ClassificationBanner, MarkingChip, Icon, ProductMark, HumanGate, MeterBar, SyncStatus, TierBadge, KeyCustodyChip, RiskBadge, GuardedAction, BreakGlass } = NSx;

const GROUPS = [

  { id: 'forms', label: 'Forms', items: ['Input', 'Select', 'Switch'] },
  { id: 'data', label: 'Data', items: ['Card', 'Table', 'StatBlock', 'SectionLabel', 'Terminal', 'ProvenanceTag', 'MeterBar'] },
  { id: 'nav', label: 'Navigation', items: ['Tabs', 'SideNav'] },
  { id: 'governance', label: 'Governance', items: ['ClassificationBanner', 'MarkingChip', 'HumanGate'] },
            { id: 'clients', label: 'Clients', items: ['SyncStatus', 'TierBadge', 'KeyCustodyChip'] },
            { id: 'admin', label: 'Admin', items: ['RiskBadge', 'GuardedAction', 'BreakGlass'] },
  { id: 'media', label: 'Media', items: ['Icon', 'ProductMark'] },

function Anchor({ name, children }) {
  return (
    <div id={name.toLowerCase()} style={{ scrollMarginTop: 90, marginBottom: 56 }}>
      <h3 style={{ fontSize: 'var(--fs-h4)', fontFamily: 'var(--font-mono)', fontWeight: 600, letterSpacing: 0, marginBottom: 14, display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{ color: 'var(--accent)' }}>&lt;</span>{name}<span style={{ color: 'var(--accent)' }}>/&gt;</span>
      </h3>
      {children}
    </div>
  );
}

function TabsDemo() { const [t, setT] = React.useState(0); return <Tabs tabs={[{ label: 'Objects', badge: '312' }, { label: 'Links' }, { label: 'Actions', badge: '28' }, { label: 'Audit' }]} active={t} onChange={setT} style={{ width: '100%' }} />; }
function SideNavDemo() {
  const [id, setId] = React.useState('objects');
  return (
    <div style={{ display: 'flex', border: '1px solid var(--border)', borderRadius: 'var(--radius-md)', overflow: 'hidden', height: 220, width: '100%' }}>
      <SideNav sections={[
        { title: 'FABRIC', items: [{ id: 'objects', label: 'Objects', icon: <Icon name="boxes" size={16} />, badge: '312' }, { id: 'links', label: 'Link types', icon: <Icon name="network" size={16} /> }] },
        { title: 'GOVERNANCE', items: [{ id: 'audit', label: 'Audit lineage', icon: <Icon name="scroll-text" size={16} /> }] },
      ]} activeId={id} onSelect={setId} style={{ height: '100%' }} />
      <div className="mg-grid-bg" style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.14em', color: 'var(--text-faint)' }}>{id.toUpperCase()}</div>
    </div>
  );
}
function TableDemo() {
  const [sel, setSel] = React.useState(0);
  return <Table style={{ width: '100%' }}
    columns={[
      { header: 'Dataset', key: 'name' },
      { header: 'Version', key: 'v', mono: true, width: 110 },
      { header: 'Marking', cell: r => <MarkingChip level={r.m} />, width: 160 },
      { header: 'Status', cell: r => <StatusPill status={r.st} pulse={false} label={r.stl} />, width: 130 },
    ]}
    rows={[
      { name: 'flight_tracks_eu', v: 'v41 · main', m: 'confidential', st: 'secure', stl: 'Sealed' },
      { name: 'sensor_feed_north', v: 'v12 · main', m: 'restricted', st: 'healthy', stl: 'Healthy' },
      { name: 'maintenance_events', v: 'v7 · dev', m: 'internal', st: 'warn', stl: 'Drift' },
    ]} selectedIndex={sel} onRowClick={setSel} />;
}
function SwitchDemo() { const [a, setA] = React.useState(true); const [b, setB] = React.useState(false); return (<><Switch checked={a} onChange={setA} label="Air-gapped mode" /><Switch checked={b} onChange={setB} label="Outbound webhooks" /><Switch checked={false} onChange={() => {}} label="Disabled" disabled /></>); }
function SelectDemo() { const [v, setV] = React.useState('stable'); return <Select label="Release channel" options={['stable', 'beta', 'canary']} value={v} onChange={e => setV(e.target.value)} />; }

        ))}

      <Section id="core" num={1} title="Core: actions & inline state">

            <Button variant="secondary">Secondary</Button>
            <Button variant="outline">Outline</Button>
            <Button variant="ghost">Ghost</Button>

            <Button size="md" variant="secondary">Medium</Button>
            <Button size="lg" variant="secondary">Large</Button>

            ['size', "'sm' | 'md' | 'lg'", '30 / 38 / 48px'],
            ['iconLeft / iconRight', 'ReactNode', 'Usually an <Icon>'],
            ['fullWidth · disabled', 'boolean', 'Disabled drops to faint on inset, no accent'],
          ]} />
        </Anchor>
        <Anchor name="IconButton">

            <IconButton label="Alerts"><Icon name="bell" size={17} /></IconButton>
            <IconButton label="Disabled" disabled><Icon name="x" size={17} /></IconButton>
            <IconButton label="Large" size="lg" variant="solid"><Icon name="search" size={20} /></IconButton>

            ['variant', "'ghost' | 'solid'", 'Solid = ink surface + border'],
            ['active', 'boolean', 'Accent tint + accent glyph'],
            ['label', 'string', 'Required for a11y; doubles as tooltip'],
            ['size', "'sm' | 'md' | 'lg'", '28 / 36 / 44px square; press scales 0.96'],

          <PropsTable rows={[['tone', "'neutral' | 'accent' | 'secure' | 'warn' | 'danger' | 'info'", 'Status tones for state only']]} />
        </Anchor>
        <Anchor name="Tag">
          <Demo>
            <Tag active>pipeline:prod</Tag><Tag>air-gap</Tag><Tag onRemove={() => {}}>marking:C</Tag><Tag onClick={() => {}}>clickable</Tag>
          </Demo>
          <PropsTable rows={[['active', 'boolean', 'Accent-selected'], ['onRemove', '() => void', 'Shows the × affordance'], ['onClick', '() => void', 'Makes the tag selectable']]} />

          <PropsTable rows={[['checked / onChange', 'boolean / (next: boolean) => void', 'Accent when on'], ['label', 'string', ''], ['disabled', 'boolean', '']]} />
        </Anchor>
      </Section>

        <Anchor name="Card">

            <Card interactive style={{ flex: 1, minWidth: 180 }}><SectionLabel number={2} muted>INTERACTIVE</SectionLabel><p style={{ margin: '10px 0 0', fontSize: 'var(--fs-sm)', color: 'var(--text-muted)' }}>Lifts one ink step on hover.</p></Card>

        </Anchor>
        <Anchor name="Table">
          <Demo><TableDemo /></Demo>
          <Demo label="COMPACT · 32PX ROWS, FOR LOGS AND AUDIT TRAILS">
            <Table compact style={{ width: '100%' }}
              columns={[
                { header: 'Actor', key: 'a', mono: true },
                { header: 'Operation', key: 'o' },
                { header: 'Signature', cell: r => <Badge tone="secure">ML-DSA ✓</Badge>, width: 110 },
                { header: 'TS', key: 't', mono: true, width: 90 },

              rows={[
                { a: 'agent:mimir/dispatch-01', o: 'Action · Schedule maintenance', t: '14:32:08' },
                { a: 'svc:forge/projector', o: 'Write · object sync', t: '14:31:41' },
              ]} />
          </Demo>
          <PropsTable rows={[
            ['columns', 'TableColumn[]', '{header, key | cell(row), mono, align, width}'],
            ['rows', 'any[]', ''],
            ['compact', 'boolean', '32px rows instead of 40px'],
            ['selectedIndex / onRowClick', 'number / (i) => void', 'Accent tint + 2px left rail on selection'],

        <Anchor name="StatBlock">
          <Demo>
            <StatBlock value="99.9%" label="CONTROL-PLANE SLO" />
            <StatBlock value="312" label="OBJECT TYPES" accent />
            <StatBlock value="0.42s" label="FIRST TOKEN" size="sm" sub="reference GPU class" />
            <StatBlock value="1.2M" label="INSTANCES" size="lg" />
          </Demo>
          <PropsTable rows={[['value / label', 'ReactNode / string', 'Oxanium numeral + mono caps label'], ['accent', 'boolean', 'Numeral in the product accent'], ['size', "'sm' | 'md' | 'lg'", ''], ['sub', 'ReactNode', 'Small sub-line']]} />
        </Anchor>
        <Anchor name="SectionLabel">
          <Demo><SectionLabel number={1}>IDENTITY</SectionLabel><SectionLabel number={2}>OBJECT FABRIC</SectionLabel><SectionLabel number={12} muted>MUTED VARIANT</SectionLabel><SectionLabel>NO NUMBER</SectionLabel></Demo>
          <PropsTable rows={[['number', 'number | string', 'Zero-padded automatically'], ['muted', 'boolean', 'Grey instead of accent']]} />
        </Anchor>
        <Anchor name="Terminal">
          <Demo style={{ display: 'block' }}>
            <Terminal title="ENCLOSURE" lines={[
              '> midgard status --enclosure',
              'identity   OK   fabric   OK   kms   OK',
              '> bifrost verify midgard-suite:2.5.0',
              'signature  ML-DSA verified',
              '# PQ-SEALED · NO EGRESS · AIR-GAP READY',

            <ProvenanceTag id="STD:NIST FIPS 203" />
            <ProvenanceTag id="AC-M-5" title="Full air-gap acceptance criterion" />
          </Demo>
          <PropsTable rows={[['id', 'string', 'Without brackets; colour keys off the prefix (DD / FR / NFR / STD / AC)'], ['title', 'string', 'Tooltip, the requirement statement'], ['kind', "'dd' | 'nfr' | 'fr' | 'std' | 'ac'", 'Override inferred colour']]} />
        </Anchor>
        <Anchor name="MeterBar">
          <Demo>
            <MeterBar value={41} label="CPU" />
            <MeterBar value={88} label="CPU" warnAt={85} dangerAt={95} />
            <MeterBar value={96} label="EVAL PASS" warnAt={90} invert />
            <MeterBar value={54} label="CONF." warnAt={70} invert />
            <MeterBar value={44} width={120} showValue={false} />
          </Demo>
          <PropsTable rows={[['value', 'number', '0–100'], ['label', 'string', 'Mono caps prefix'], ['warnAt / dangerAt', 'number', 'Threshold recolouring'], ['invert', 'boolean', 'Lower is worse (pass rates, confidence)'], ['width · showValue · format', 'number · boolean · fn', '']]} />
        </Anchor>
      </Section>

      <Section id="nav" num={4} title="Navigation">
        <Anchor name="Tabs">
          <Demo style={{ display: 'block' }}><TabsDemo /></Demo>
          <PropsTable rows={[['tabs', "Array<string | {label, icon, badge}>", ''], ['active / onChange', 'number / (i) => void', '2px accent rule on the active tab'], ['size', "'sm' | 'md'", '']]} />

        <Anchor name="SideNav">
          <Demo style={{ display: 'block' }}><SideNavDemo /></Demo>
          <PropsTable rows={[
            ['sections', 'Array<{title, items}>', 'items: {id, label, icon, badge}'],

            ['footer', 'ReactNode', 'Pinned to the bottom'],
            ['width', 'number | string', 'Defaults to --sidenav-w (232px)'],
          ]} />
        </Anchor>
      </Section>

      <Section id="governance" num={5} title="Governance: marking chrome" lead="Classification colours never follow the product theme or the colour mode. A CONFIDENTIAL banner is the same red in Forge, Heimdall, light and dark.">
        <Anchor name="ClassificationBanner">
          <Demo style={{ display: 'flex', flexDirection: 'column', alignItems: 'stretch' }}>
            <ClassificationBanner level="confidential" />
            <ClassificationBanner level="restricted" />
            <ClassificationBanner level="internal" compact />
            <ClassificationBanner level="open" compact />
          </Demo>
          <PropsTable rows={[['level', "'confidential' | 'restricted' | 'internal' | 'open'", 'Fixed colours'], ['text', 'string', 'Override the default banner text'], ['compact', 'boolean', '20px instead of 26px']]} />
        </Anchor>
        <Anchor name="MarkingChip">
          <Demo>
            <MarkingChip level="confidential" compartment="OPS-N" /><MarkingChip level="restricted" /><MarkingChip level="internal" /><MarkingChip level="open" label="unclassified" />

            <SyncStatus state="merged" />

            <TierBadge tier="hybrid" />

        </Anchor>

      <Section id="media" num={6} title="Media">

          <Demo>
            {['lock', 'shield-check', 'key', 'boxes', 'network', 'database', 'terminal', 'hammer', 'git-branch', 'workflow', 'brain-circuit', 'bot', 'sparkles', 'rocket', 'package', 'undo-2', 'eye', 'radar', 'map', 'crosshair', 'layers'].map(n => <Icon key={n} name={n} size={19} color="var(--text-body)" />)}
