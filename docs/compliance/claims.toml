# The claims ledger. One [[claim]] per capability this repository states about Midgard.
# [AC-RF-CA-1a] [AC-RF-CA-13b]
#
# docs/compliance/CLAIMS.md is rendered from this file (bash tools/ci/claims.sh --render)
# and explains the status vocabulary. The check (bash tools/ci/claims.sh --check) holds
# every row to the files, lines and tests it cites.
#
# Keys:
#   id             lower-case letters, digits and hyphens; unique
#   area           the heading the row is rendered under; keep rows of an area together
#   claim          the claim, worded as its status allows
#   status         spec | reference | operable | production | external
#   limit          what the claim does not cover (optional)
#   criteria       acceptance criterion ids the claim maps to
#   evidence       source paths, with a line anchor where one helps
#   tests          path::test_name, the #[test] functions that exercise it
#   service_tests  for operable and above: path.sh:line, a step of a script that drives
#                  the running services, or path::test_name, a test that starts a service
#   fallback       below operable: the wording to use until it is operable
#   milestone      below operable: what has to land, and the item that tracks it
#   stated_in      where the repository states the claim
#   overstated_in  where it is still worded above this status; the list is empty at a tag
#
# The reader is plain awk: one key per line, and no double quote inside a value.

# ---- Core: cryptography and transport --------------------------------------------------

[[claim]]
id = "pq-crypto-core"
area = "Core: cryptography and transport"
claim = "ML-KEM, ML-DSA and SLH-DSA (FIPS 203, 204, 205) with X25519, behind one algorithm-agility layer. The FIPS backend passes the ACVP known-answer tests held in the repository, and the test backend cannot be compiled together with it."
status = "operable"
limit = "The module has no FIPS 140-3 certificate; that is an external laboratory activity and a GA blocker."
evidence = ["crypto/pqc-agility/src/backend/mod.rs:14"]
tests = ["crypto/pqc-agility/tests/fips_backend.rs::kem_roundtrip_every_suite"]
service_tests = ["deploy/compose/smoke.sh:19"]
stated_in = ["README.md:56", "docs/compliance/GA_READINESS.md:62", "docs/launch/pipeline/build-deck.js:454"]

[[claim]]
id = "pq-mtls"
area = "Core: cryptography and transport"
claim = "Services talk to each other over PQ-mTLS: a mutually authenticated handshake with hybrid X25519 and ML-KEM-768 key agreement, certified workload identities, session resumption and per-identity rate limiting."
status = "operable"
criteria = ["RC-40.2"]
evidence = ["crypto/pq-mtls/src/lib.rs:18"]
tests = ["crypto/pq-mtls/tests/real_fips_handshake.rs::real_handshake_negotiates_hybrid_and_agrees", "crypto/pq-mtls/tests/tcp_transport.rs::tcp_handshake_denies_unauthorized", "services/gateway/tests/session.rs::a_second_connection_resumes_and_the_ticket_is_single_use"]
service_tests = ["deploy/compose/smoke.sh:19", "deploy/kind/smoke.sh:115"]
stated_in = ["CHANGELOG.md:58", "docs/releases/v0.1.0-rc.1.md:16", "docs/launch/pipeline/build-deck.js:450"]

[[claim]]
id = "mesh-certificate-lifecycle"
area = "Core: cryptography and transport"
claim = "A mesh certificate authority that issues, renews and revokes workload certificates, with a revocation honoured at the next handshake."
status = "reference"
evidence = ["tools/mg-admin/src/mesh.rs:115"]
tests = ["services/iam/tests/rc_35.rs::renewal_is_downtime_free_and_revocation_is_honoured_on_next_handshake"]
fallback = "Issue, renewal and revocation of workload certificates are implemented and tested as a library (services/iam/tests/rc_35.rs). The certificates deployments use today come from mg-admin mesh issue, which does not set an expiry and does not renew."
milestone = "mg-admin mesh issue goes through the certificate authority and services renew automatically (RF-IAM-6)."

[[claim]]
id = "sealed-durable-state"
area = "Core: cryptography and transport"
claim = "The five running services keep their state in sealed, append-only journals: AES-256-GCM under ML-KEM-1024-wrapped keys, replayed at start. A journal or ledger that has been altered stops the service from starting."
status = "operable"
criteria = ["RC-40.1"]
evidence = ["services/kms/src/lib.rs:85"]
tests = ["services/kms/tests/envelope.rs::seal_is_ml_kem_1024_and_carries_no_plaintext", "services/kms/tests/file_ledger_restart.rs::tampered_on_disk_entry_is_detected_on_load", "services/http-gateway/tests/state_dir_boot.rs::a_tampered_ledger_refuses_to_boot"]
service_tests = ["deploy/compose/smoke.sh:24", "deploy/kind/smoke.sh:80"]
stated_in = ["CHANGELOG.md:106", "docs/launch/pipeline/build-deck.js:451"]

[[claim]]
id = "hardware-key-custody"
area = "Core: cryptography and transport"
claim = "A hardware trust root (HSM or TPM) in which the root secret never enters process memory, with root attestation and key rotation."
status = "reference"
criteria = ["RC-40.3"]
evidence = ["services/kms/src/hardware.rs:167"]
tests = ["services/kms/tests/rc_28.rs::decapsulation_happens_on_the_device_not_in_the_process", "services/kms/tests/rc_28.rs::root_attestation_verifies_and_fails_closed_on_tamper"]
fallback = "Key custody is software: keystores are files. A hardware trust root with attestation is implemented and tested against a software stand-in (services/kms/tests/rc_28.rs); no HSM or TPM has been used."
milestone = "RC-40.3 passes with a release artefact signed by a key held in a real HSM (RF-SEC-8, RF-SC-8)."
stated_in = ["CHANGELOG.md:93", "docs/releases/v0.1.0-rc.1.md:88", "docs/launch/pipeline/build-deck.js:463"]

