[[claim]]
id = "login-and-session-tokens"
area = "Core: fabric, identity and governance"
claim = "A principal logs in at the edge with a password, and a time-based one-time code when enrolled with one, and receives an ML-DSA-signed session token. Principals are held in a durable directory. A session can be ended at the server by the holder of its token, and a revoked or de-enrolled token is refused. Passwords are stored as Argon2id (m=19 MiB, t=2, p=1); a legacy PBKDF2-HMAC-SHA256 entry (210,000 iterations) still verifies and is re-hashed to Argon2id at the next successful sign-in, and a stored cost outside fixed bounds is refused. A one-time code is accepted once (RFC 6238 section 5.2): the step of the last code accepted is kept per principal in the directory, across restarts, and that code or an earlier one is refused."
status = "operable"
evidence = ["services/iam/src/auth.rs:1", "services/http-gateway/src/revocations.rs:1", "services/iam/src/password.rs:1", "services/iam/src/mfa.rs:1", "services/iam/src/directory.rs:1"]
