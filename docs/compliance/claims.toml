# ---- Core: fabric, identity and governance ---------------------------------------------

[[claim]]
id = "audit-ledger"
area = "Core: fabric, identity and governance"
claim = "Edge admission and every object-fabric call are written to one append-only ledger signed with ML-DSA-65. Each response carries the id of the ledger entry that authorised it, and the ledger is verified again at every start, under a pinned audit key, against a signed checkpoint of its length, so a shortened or deleted ledger does not start. Each row records outcome, reason, source address and session where the service knows them, and refused requests (rejected tokens, human-gate refusals) are recorded. The ledger view needs ReadAudit and is scoped to the caller: rows about objects the caller cannot read are omitted, and so are other principals' login rows unless policy grants ReadAudit on audit-ledger:sessions. Caller-derived resource fields are sanitised and usernames of unenrolled principals are recorded as a keyed hash. A partial final frame left by a crash during an append is cut off at start and the repair recorded in the ledger; a partial frame anywhere a crash cannot leave one still stops the start."
status = "operable"
evidence = ["crypto/audit-writer/src/ledger.rs:5", "crypto/audit-writer/src/checkpoint.rs:1", "services/http-gateway/src/enclosure.rs:856", "crypto/audit-writer/src/record.rs:114", "services/http-gateway/src/lib.rs:469", "services/http-gateway/src/lib.rs:1215", "crypto/audit-writer/src/file.rs:23"]
tests = ["crypto/audit-writer/tests/tamper.rs::compromised_signer_cannot_rewrite_history", "crypto/audit-writer/tests/truncation.rs::cutting_entries_off_the_end_is_detected", "crypto/audit-writer/tests/truncation.rs::a_ledger_checked_with_the_wrong_key_is_refused", "services/http-gateway/tests/state_dir_boot.rs::a_shortened_or_deleted_ledger_refuses_to_boot", "services/http-gateway/tests/state_dir_boot.rs::an_audit_keystore_that_is_not_the_pinned_key_refuses_to_boot", "services/http-gateway/tests/fabric_edge.rs::a_query_returns_real_objects_and_its_audit_id_is_a_real_ledger_row", "services/http-gateway/tests/durable_enclosure.rs::an_action_and_its_lineage_survive_a_restart", "services/http-gateway/tests/fabric_edge.rs::the_audit_view_hides_rows_about_objects_the_caller_cannot_read", "services/http-gateway/tests/fabric_edge.rs::reading_the_audit_needs_the_read_audit_permission", "services/http-gateway/tests/fabric_edge.rs::other_principals_login_rows_need_the_sessions_grant", "crypto/audit-writer/tests/append_verify.rs::a_ledger_written_before_the_context_existed_still_verifies", "services/governance/tests/authorize.rs::record_ids_are_unique_and_sequential", "services/governance/tests/authorize.rs::authorize_sets_the_outcome_field", "services/http-gateway/tests/security_record.rs::a_rejected_token_is_uniform_counted_logged_and_audited_once_per_minute", "services/http-gateway/tests/fabric_edge.rs::a_refused_human_gate_and_a_self_approval_are_in_the_ledger", "services/http-gateway/tests/security_record.rs::ledger_resource_fields_are_sanitised", "services/http-gateway/tests/security_record.rs::an_unenrolled_username_is_recorded_as_a_keyed_hash", "services/http-gateway/tests/security_record.rs::the_actor_hash_key_is_created_once_and_kept", "crypto/audit-writer/tests/torn_tail.rs::a_torn_final_frame_is_truncated_and_reported", "crypto/audit-writer/tests/torn_tail.rs::a_torn_frame_before_the_head_count_fails_closed", "crypto/audit-writer/tests/torn_tail.rs::a_torn_frame_after_an_entry_the_checkpoint_does_not_cover_fails_closed"]
service_tests = ["services/http-gateway/tests/http.rs::real_socket_round_trip", "deploy/compose/smoke.sh:24"]
limit = "The ledger covers what the running services do. Agent steps are not in it, because no service runs the agent runtime (see agent-runtime)."
stated_in = ["README.md:54", "CHANGELOG.md:64", "docs/launch/pipeline/build-deck.js:334", "CHANGELOG.md:68", "CHANGELOG.md:155"]

