# ---- Heimdall --------------------------------------------------------------------------

[[claim]]
id = "heimdall-feed-and-picture"
area = "Heimdall"
claim = "heimdall-feed accepts an observation only over PQ-mTLS, only from the feed whose certified identity it carries (or one the feed registry delegates to it), and only with a valid signature over bytes that include the feed's monotonic sequence. Once the signature verifies, an observation is accepted only if its sequence is above the feed's last, its time is within a bounded window around the server's receipt time and its id is not among the feed's last 4,096; each feed's last sequence is sealed at rest, so a replay is refused across requests and restarts, and the picture exposes per-entity staleness. Observations that share an entity key fuse into one tracked entity, and the picture is sealed at rest and recovered at restart. The picture is bounded (entity, per-feed and attribute caps with stale-track eviction), persisted as a sealed per-entity journal with compaction, read in pages that never exceed the mesh frame cap, and Ingest is rate limited per identity."
