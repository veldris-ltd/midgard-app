<!doctype html><html><head><meta charset="utf-8"><title>Midgard</title><link rel="stylesheet" href="base.css"><script>try{if(localStorage.getItem('mg-mode')==='light')document.documentElement.classList.add('mode-light')}catch(e){}</script>
<style>
body { display: grid; place-items: center; }
.wrap { width: 1400px; opacity: 0; animation: in 900ms ease-out 200ms forwards; }

.row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px; margin-top: 44px; }
.stat { border: 1px solid #2a2d34; border-radius: 8px; padding: 22px 24px; background: #101114; }
.stat b { display: block; font-family: 'Oxanium'; font-weight: 800; font-size: 54px; color: #e9ebee; line-height: 1; margin-bottom: 10px; }
.foot { margin-top: 44px; color: #6b7279; }
</style></head><body class="grid"><div class="wrap">
<div class="label">Midgard · Veldris Ltd</div>
<h1 class="display">One boundary.<br>Everything inside it<span>.</span></h1>
<div class="row">
<div class="stat"><b>72</b><span class="label">Acceptance criteria, each with a test</span></div>
<div class="stat"><b>0</b><span class="label">Outbound calls required</span></div>
<div class="stat"><b>5</b><span class="label">Services, one PQ-mTLS mesh</span></div>
<div class="stat"><b style="font-size:44px;padding-top:6px">Apache 2.0</b><span class="label">Open-source core</span></div>
</div>
<div class="foot label">Midgard console recorded against the real enclosure edge · other consoles on built-in sample data</div>
</div></body></html>
